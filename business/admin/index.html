<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verify employers | Beat the Pile</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/icon-192.png?v=3">
<meta name="theme-color" content="#060A2C">
<link rel="stylesheet" href="/business/biz.css">
<style>
  /* /business/admin/ (Nov 2026): owners (ADMIN_EMAILS) approve companies before they can contact students. biz_admin_list / biz_admin_review. */
  .ok{color:var(--green);font-weight:600}.no{color:#A3261A;font-weight:600}
  td .btn{padding:5px 12px;font-size:13px;margin:2px 4px 2px 0}
  .filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .filters button{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}
  .filters button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
  .wrapt{overflow-x:auto}
  .btn.danger{border-color:#9B2C2C;color:#9B2C2C}
</style>
</head>
<body>
<script src="/nav.js"></script>
<main id="main"><div class="card center">Loading…</div></main>
<script src="/business/biz.js"></script>
<script>
(() => {
  const { esc, $ } = biz;
  let L = [], show = "pending";
  function render(){
    const rows = L.filter((r) => show === "all" || r.status === show);
    const n = (s) => L.filter((r) => r.status === s).length;
    $("main").innerHTML = `<section class="card"><h1>Verify employers</h1>
      <p class="sub">Approve only when the person clearly works there. Required: work email confirmed at the company's own domain, that domain matches their website and gets real email, and only one company page per domain (everyone else joins as a recruiter). Anything else needs a written "Override:" reason.</p>
      <div class="filters">${[["pending", `Waiting (${n("pending")})`], ["new", `Not finished (${n("new")})`], ["verified", `Verified (${n("verified")})`], ["rejected", `Rejected (${n("rejected")})`], ["all", "All"]]
        .map(([k, l]) => `<button data-show="${k}" aria-pressed="${k === show}">${esc(l)}</button>`).join("")}</div>
      ${rows.length ? `<div class="wrapt"><table><tr><th>Company</th><th>Person</th><th>Work email</th><th>Checks</th><th>Status</th><th></th></tr>
        ${rows.map((r) => `<tr><td><b>${esc(r.company || "—")}</b><br>${r.website ? `<a href="${esc(r.website)}" target="_blank" rel="noopener nofollow" class="small">${esc(r.website.replace(/^https:\/\//, ""))}</a>` : `<span class="small muted">no website</span>`}</td>
          <td>${esc(r.name || "—")}<br><span class="small muted">${esc(r.title || "")}</span></td>
          <td>${esc(r.workEmail || "—")}</td>
          <td class="small">${esc(r.kind === "recruiter" ? "Recruiter" : "Company page")}<br>${r.emailVerified ? `<span class="ok">Email confirmed</span>` : `<span class="no">Email not confirmed</span>`}<br>${r.domainMatchesWebsite ? `<span class="ok">Domain matches website</span>` : `<span class="no">Domain ≠ website</span>`}
            ${r.mail === false ? `<br><span class="no">Domain gets no email</span>` : r.mail ? `<br><span class="ok">Real mail domain</span>` : ""}
            ${r.schoolDomain ? `<br><span class="no">School domain (students have these)</span>` : ""}${r.sameDomainPage ? `<br><span class="no">Domain already has a page: ${esc(r.sameDomainPage)}</span>` : ""}</td>
          <td>${esc(r.status)}${r.reviewNote ? `<br><span class="small muted">${esc(r.reviewNote)}</span>` : ""}</td>
          <td style="white-space:nowrap">${r.status !== "verified" ? `<button class="btn pri" data-k="${esc(r.key)}" data-s="verified" ${r.emailVerified ? "" : "disabled title='Their work email isn&#39;t confirmed yet'"}>Verify</button>` : ""}
            ${r.status !== "rejected" ? `<button class="btn" data-k="${esc(r.key)}" data-s="rejected">Reject</button>` : ""}
            <button class="btn danger" data-del-emp="${esc(r.key)}" data-name="${esc(r.company || "this account")}">Delete</button></td></tr>`).join("")}</table></div>`
        : `<p class="empty">Nothing here.</p>`}</section>`;
    document.querySelectorAll("[data-show]").forEach((b) => b.onclick = () => { show = b.dataset.show; render(); });
    // Nov 16: delete a business account (company page or recruiter). Your own stays gone (owner access won't recreate it).
    document.querySelectorAll("[data-del-emp]").forEach((b) => b.onclick = async () => {
      const t = prompt(`Delete the business account "${b.dataset.name}"? Its company page, recruiter badge and setup are removed. Students keep their own accounts. Type DELETE to confirm.`);
      if (t !== "DELETE") return;
      b.disabled = true; try { await biz.api({ action: "biz_admin_delete", key: b.dataset.delEmp, confirm: "DELETE" }); await load(); } catch (e) { b.disabled = false; alert(e.message); }
    });
    document.querySelectorAll("[data-k]").forEach((b) => b.onclick = async () => {
      let note = "";
      if (b.dataset.s === "rejected") { note = prompt("Reason (the employer sees this):", "We couldn't confirm you work at this company.") ?? null; if (note === null) return; }
      b.disabled = true;
      try { await biz.api({ action: "biz_admin_review", key: b.dataset.k, status: b.dataset.s, note }); await load(); }
      catch (e) {
        b.disabled = false;
        // a failed hard check can be approved only with a written reason ("Override: called their HR line, confirmed …")
        if (/Override:/.test(e.message)) { const why = prompt(e.message + "\n\nHow did you check? (starts with Override:)", "Override: "); if (why && /^override:\s*\S.{14,}/i.test(why)) {
          try { await biz.api({ action: "biz_admin_review", key: b.dataset.k, status: b.dataset.s, note: why }); await load(); } catch (e2) { alert(e2.message); } } }
        else alert(e.message);
      }
    });
  }
  // Nov 15: faculty & staff checks (school-domain email + their page in the school's directory; you open it and decide)
  let SL = [];
  function renderStaff(){
    const box = document.getElementById("staffAdmin"); if (!box) return;
    box.innerHTML = `<section class="card"><h2>Verify faculty &amp; staff</h2>
      <p class="sub">Open their directory link and approve only if it's clearly the same person at that school. Students have school emails too, so the directory page is the real proof.</p>
      ${SL.length ? `<div class="wrapt"><table><tr><th>Person</th><th>School</th><th>School email</th><th>Directory page</th><th>Status</th><th></th></tr>
        ${SL.map((r) => `<tr><td><b>${esc(r.name || "(no name)")}</b><br><span class="small muted">${esc(r.role || "")}</span></td><td>${esc(r.school || "")}<br><span class="small muted">${esc(r.domain || "")}</span></td>
          <td class="small">${esc(r.email || "")}<br>${r.emailOk ? '<span class="ok">Code confirmed</span>' : '<span class="no">Not confirmed</span>'}</td>
          <td class="small">${r.dir ? `<a href="${esc(r.dir)}" target="_blank" rel="noopener nofollow">Open page</a><br>${r.dirOnDomain ? '<span class="ok">On the school domain</span>' : '<span class="no">Not on the school domain</span>'}` : '<span class="no">No link yet</span>'}</td>
          <td>${esc(r.status)}${r.note ? `<br><span class="small muted">${esc(r.note)}</span>` : ""}</td>
          <td style="white-space:nowrap">${r.status !== "verified" ? `<button class="btn pri" data-sk="${esc(r.key)}" data-s="verified" ${r.emailOk && r.dir && r.dirOnDomain ? "" : "disabled"}>Verify</button>` : ""}${r.status !== "rejected" ? `<button class="btn" data-sk="${esc(r.key)}" data-s="rejected">Reject</button>` : ""}</td></tr>`).join("")}</table></div>`
        : `<p class="empty">Nobody waiting.</p>`}</section>`;
    box.querySelectorAll("[data-sk]").forEach((b) => b.onclick = async () => {
      let note = ""; if (b.dataset.s === "rejected") { note = prompt("Reason (they see this):", "We couldn't match you to your school's directory.") ?? null; if (note === null) return; }
      b.disabled = true; try { await biz.api({ action: "staff_admin_review", key: b.dataset.sk, status: b.dataset.s, note }); await loadStaff(); } catch (e) { b.disabled = false; alert(e.message); }
    });
  }
  // Nov 16: your duplicate sign-ins (accounts with your name). Delete the extras; never the one you're signed in with.
  async function loadAccounts(){
    let box = document.getElementById("myAccts");
    if (!box) { document.getElementById("staffAdmin").insertAdjacentHTML("afterend", '<div id="myAccts" style="max-width:1100px;margin:0 auto 40px;padding:0 16px"></div>'); box = document.getElementById("myAccts"); }
    let A = []; try { A = (await biz.api({ action: "admin_my_accounts" })).accounts || []; } catch (e) { box.innerHTML = ""; return; }
    box.innerHTML = `<section class="card"><h2>Your accounts</h2><p class="sub">Every sign-in with your name. Keep the one you use; delete the extras (their profile, tracker, messages and the sign-in itself).</p>
      <div class="wrapt"><table><tr><th>Account</th><th>Email</th><th>Profile</th><th>Created</th><th></th></tr>
      ${A.map((a) => `<tr><td><b>${esc(a.name || "(no name)")}</b>${a.you ? ' <span class="ok">You’re signed in with this one</span>' : ""}<br><span class="small muted">${esc([a.role, a.founding ? "Founding member #" + a.founding : "No founding number"].filter(Boolean).join(" · "))}</span></td>
        <td class="small">${a.emails.map(esc).join("<br>")}${a.signIn.length ? `<br><span class="muted">via ${esc(a.signIn.join(", "))}</span>` : ""}</td>
        <td class="small">${a.handle ? "@" + esc(a.handle) : "No profile"}${a.companies.length ? `<br>${esc(a.companies.join(", "))}` : ""}</td>
        <td class="small">${esc(a.created || "")}${a.lastSignIn ? `<br><span class="muted">last in ${esc(a.lastSignIn)}</span>` : ""}</td>
        <td>${a.you ? "" : `<button class="btn" data-del="${esc(a.key)}">Delete</button>`}</td></tr>`).join("")}</table></div></section>`;
    box.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
      const t = prompt("This deletes that account's profile, tracker, messages and the sign-in itself. It can't be undone. Type DELETE to confirm."); if (t !== "DELETE") return;
      b.disabled = true; try { await biz.api({ action: "admin_delete_account", key: b.dataset.del, confirm: "DELETE" }); await loadAccounts(); } catch (e) { b.disabled = false; alert(e.message); }
    });
  }
  // Nov 17: Reports & feedback — Report-a-problem notes and Orbit reports. Mark handled (undo-able); Suspend for Orbit reports.
  async function loadFeedback(){
    let box = document.getElementById("fbAdmin");
    if (!box) { document.getElementById("staffAdmin").insertAdjacentHTML("beforebegin", '<div id="fbAdmin" style="max-width:1100px;margin:0 auto 24px;padding:0 16px"></div>'); box = document.getElementById("fbAdmin"); }
    let F = []; try { F = (await biz.api({ action: "admin_feedback" })).items || []; } catch (e) { box.innerHTML = ""; return; }
    const open = F.filter((f) => !f.handled_at), reports = open.filter((f) => f.kind === "orbit_report").length;
    const label = (k) => k === "orbit_report" ? "Orbit report" : k === "pulse" ? "Quick rating" : k === "community_report" ? "Community report" : (k || "Feedback");
    box.innerHTML = `<section class="card"><h2>Reports &amp; feedback${open.length ? ` <span class="small muted">${open.length} open${reports ? ` · ${reports} Orbit report${reports === 1 ? "" : "s"}` : ""}</span>` : ""}</h2>
      <p class="sub">What people sent with Report a problem, plus Orbit reports (the reason and the last messages of that chat). Suspend blocks the reported sign-in at Clerk, hides their profile and removes their connections. Undo it in Clerk → Users → Unban.</p>
      ${F.length ? `<div class="wrapt"><table><tr><th>When</th><th>Type</th><th>Message</th><th></th></tr>
      ${F.map((f) => `<tr${f.handled_at ? ' style="opacity:.55"' : ""}><td class="small">${esc(new Date(f.created_at).toLocaleString())}<br><span class="muted">${esc(f.page || "")}</span></td>
        <td class="small"><b>${esc(label(f.kind))}</b>${f.contact ? `<br>${esc(f.contact)}` : ""}</td>
        <td class="small" style="white-space:pre-wrap;max-width:520px">${esc(f.message || "")}</td>
        <td style="white-space:nowrap">${f.handled_at ? `<button class="btn" data-fbundo="${f.id}">Reopen</button>` : `<button class="btn" data-fbdone="${f.id}">Mark handled</button>`}
          ${f.suspendable && !f.handled_at ? `<br><button class="btn" data-fbsus="${f.id}" style="margin-top:6px;color:#B42318">Suspend</button>` : ""}</td></tr>`).join("")}</table></div>`
      : `<p class="small muted">Nothing yet.</p>`}</section>`;
    const run = async (b, body) => { b.disabled = true; try { await biz.api(body); await loadFeedback(); } catch (e) { b.disabled = false; alert(e.message); } };
    box.querySelectorAll("[data-fbdone]").forEach((b) => b.onclick = () => run(b, { action: "admin_feedback_done", id: +b.dataset.fbdone }));
    box.querySelectorAll("[data-fbundo]").forEach((b) => b.onclick = () => run(b, { action: "admin_feedback_done", id: +b.dataset.fbundo, undo: true }));
    box.querySelectorAll("[data-fbsus]").forEach((b) => b.onclick = () => { const t = prompt("Suspend the reported person? Their sign-in is blocked, their profile hidden and their connections removed. Type SUSPEND to confirm."); if (t !== "SUSPEND") return;
      run(b, { action: "admin_suspend", id: +b.dataset.fbsus, confirm: "SUSPEND" }); });
  }
  async function loadStaff(){ try { SL = (await biz.api({ action: "staff_admin_list" })).staff || []; } catch (e) { SL = []; } renderStaff(); loadAccounts(); loadFeedback(); }
  async function load(){ L = (await biz.api({ action: "biz_admin_list" })).employers; render(); if (!document.getElementById("staffAdmin")) $("main").insertAdjacentHTML("afterend", '<div id="staffAdmin" style="max-width:1100px;margin:0 auto 40px;padding:0 16px"></div>'); loadStaff(); }
  biz.start(async (u) => {
    if (u === undefined) { $("main").innerHTML = '<div class="card center">Sign-in is temporarily unavailable.</div>'; return; }
    if (!u) { $("main").innerHTML = biz.signInCard("Owners only", "Sign in with an owner account."); return; }
    try { await load(); } catch (e) { $("main").innerHTML = `<div class="card center">${esc(e.message)}</div>`; }
  });
})();
</script>
</body>
</html>
