<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InternIQ — Company Coverage</title>
<meta name="robots" content="noindex">
<style>
  :root{--green:#00C285;--green-dark:#009E6C;--navy:#0A1628;--ink:#1E293B;--muted:#64748B;--bg:#F8FFFE;--line:#E2EEEA;--r:12px;
        --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px}
  header{background:var(--navy);color:#fff;padding:24px 0 20px}
  .brand{color:var(--green);font-weight:800;text-decoration:none;font-size:15px}
  h1{margin:8px 0 4px;font-size:clamp(22px,5vw,28px);letter-spacing:-.02em}
  .sub{margin:0;color:#CBD5E1;font-size:14px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0 14px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
  .tile .n{font-size:26px;font-weight:800;color:var(--navy)} .tile .l{font-size:13px;color:var(--muted)}
  .bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#EEF2F1;margin:6px 0 8px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-bottom:18px}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  section{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
  summary{cursor:pointer;padding:12px 16px;font-weight:700;color:var(--navy);list-style:none;display:flex;justify-content:space-between;gap:12px}
  summary::-webkit-details-marker{display:none}
  summary .c{color:var(--muted);font-weight:600}
  .why{font-size:13px;color:var(--muted);padding:0 16px 8px;margin-top:-4px}
  .row{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:4px 14px;padding:8px 16px;border-top:1px solid var(--line);font-size:14px}
  .row .d{color:var(--muted);font-size:13px;word-break:break-word}
  .pill{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:#E6FBF4;color:var(--green-dark);margin-left:6px}
  @media (max-width:560px){.row{grid-template-columns:1fr}}
  .err{padding:24px;text-align:center;color:var(--muted)}
  footer{font-size:13px;color:var(--muted);padding:12px 0 40px}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/jobs/">InternIQ</a>
  <h1>Company coverage</h1>
  <p class="sub">A robot finds each company's real job board and only adds it after proving it belongs to that company.</p>
</div></header>
<main class="wrap" id="app"><div class="err">Loading…</div></main>
<footer class="wrap">Runs automatically twice a day. Turn any company off in Supabase → company_candidates → enabled.</footer>

<script>
(function(){
  const GROUPS = [
    ["live",            "Live — added automatically",            "#00C285", "Board found and proven to be theirs. Listings appear after the next daily sync."],
    ["unsupported",     "Needs a new scraper",                   "#7F77DD", "Their job system is one we don't read yet. Grouped by system — build the biggest one next."],
    ["identity_failed", "Found a board, couldn't prove it's them","#EF9F27", "Held back on purpose. Never shown until checked by hand."],
    ["blocked",         "Site blocks robots",                    "#D85A30", "Their careers site refuses automated visits. Can be added by hand in the browser."],
    ["board_error",     "Board found but not working",           "#B4B2A9", "Usually a wrong guessed address. Retried in 2 weeks."],
    ["no_board",        "No job board found",                    "#888780", "Careers pages didn't link to any job system we recognize. Retried in 2 weeks."],
    ["duplicate",       "Duplicate of a live company",           "#D3D1C7", "Same board as one already listed — skipped so jobs don't show twice."],
    ["no_domain",       "Missing website",                       "#D3D1C7", "Needs a website added to the candidate list."],
    ["error",           "Error",                                 "#E24B4A", "Something broke during the check. Retried automatically."],
    ["pending",         "Queued",                                "#CBD5E1", "Not tried yet. ~25 companies are tried per day."],
  ];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const ago = (ts) => { if (!ts) return ""; const h = Math.round((Date.now() - new Date(ts)) / 36e5); return h < 1 ? "just now" : h < 24 ? h + "h ago" : Math.round(h / 24) + "d ago"; };

  fetch("/api/discovery").then((r) => r.json()).then((d) => {
    if (d.error) throw new Error(d.error);
    const rows = d.rows || [], counts = d.counts || {};
    const total = rows.length, live = (counts.live || 0), hand = (d.handVerified || []).length;
    const tried = total - (counts.pending || 0);
    let html = `<div class="tiles">
      <div class="tile"><div class="n">${hand + live}</div><div class="l">companies live (${hand} hand-checked + ${live} robot-proven)</div></div>
      <div class="tile"><div class="n">${tried}/${total}</div><div class="l">candidates checked so far</div></div>
      <div class="tile"><div class="n">${counts.unsupported || 0}</div><div class="l">waiting on a new scraper</div></div>
      <div class="tile"><div class="n">${counts.identity_failed || 0}</div><div class="l">held back (couldn't prove)</div></div>
    </div><div class="bar">`;
    for (const [k, , color] of GROUPS) if (counts[k]) html += `<div style="width:${(counts[k] / total * 100).toFixed(2)}%;background:${color}" title="${k}: ${counts[k]}"></div>`;
    html += `</div><div class="legend">` + GROUPS.filter(([k]) => counts[k]).map(([k, label, color]) => `<span><span class="sw" style="background:${color}"></span>${esc(label)} · ${counts[k]}</span>`).join("") + `</div>`;

    for (const [k, label, , why] of GROUPS) {
      let list = rows.filter((r) => r.status === k);
      if (!list.length) continue;
      if (k === "unsupported") {
        const by = {};
        list.forEach((r) => { const sys = (r.detail || "").replace(/^Uses /, "").replace(/ — .*$/, "") || "Unknown"; (by[sys] = by[sys] || []).push(r.company); });
        const ranked = Object.entries(by).sort((a, b) => b[1].length - a[1].length);
        html += `<section><details${k === "live" ? " open" : ""}><summary>${esc(label)} <span class="c">${list.length}</span></summary><div class="why">${esc(why)}</div>` +
          ranked.map(([sys, cos]) => `<div class="row"><div><b>${esc(sys)}</b><span class="pill">${cos.length}</span></div><div class="d">${esc(cos.join(", "))}</div></div>`).join("") + `</details></section>`;
        continue;
      }
      if (k === "live") list = list.sort((a, b) => String(b.verified_at).localeCompare(String(a.verified_at)));
      html += `<section><details${k === "live" ? " open" : ""}><summary>${esc(label)} <span class="c">${list.length}</span></summary><div class="why">${esc(why)}</div>` +
        list.map((r) => `<div class="row"><div>${esc(r.company)}${k === "live" && r.intern_count ? `<span class="pill">${r.intern_count} interns</span>` : ""}</div><div class="d">${esc(r.detail || "")}${r.checked_at ? " · " + ago(r.checked_at) : ""}</div></div>`).join("") +
        `</details></section>`;
    }
    if (hand) html += `<section><details><summary>Hand-checked companies <span class="c">${hand}</span></summary><div class="row"><div class="d" style="grid-column:1/-1">${esc(d.handVerified.join(", "))}</div></div></details></section>`;
    document.getElementById("app").innerHTML = html;
  }).catch((e) => {
    document.getElementById("app").innerHTML = `<div class="err">Coverage data isn't available yet (${esc(e.message)}).</div>`;
  });
})();
</script>
</body>
</html>
