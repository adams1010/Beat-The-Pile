<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="InternIQ">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InternIQ — Company Coverage</title>
<meta name="robots" content="noindex">
<style>
  :root{--green:#00C285;--green-dark:#009E6C;--navy:#0A1628;--ink:#1E293B;--muted:#64748B;--bg:#F8FFFE;--line:#E2EEEA;--r:12px;
        --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px}
  header{background:var(--navy);color:#fff;padding:24px 0 20px}
  .brand{color:var(--green);font-weight:800;text-decoration:none;font-size:15px}
  h1{margin:8px 0 4px;font-size:clamp(22px,5vw,28px);letter-spacing:-.02em}
  .sub{margin:0;color:#CBD5E1;font-size:14px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0 14px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
  .tile .n{font-size:26px;font-weight:800;color:var(--navy)} .tile .l{font-size:13px;color:var(--muted)}
  .bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#EEF2F1;margin:6px 0 8px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-bottom:18px}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  section{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
  summary{cursor:pointer;padding:12px 16px;font-weight:700;color:var(--navy);list-style:none;display:flex;justify-content:space-between;gap:12px}
  summary::-webkit-details-marker{display:none}
  summary .c{color:var(--muted);font-weight:600}
  .why{font-size:13px;color:var(--muted);padding:0 16px 8px;margin-top:-4px}
  .row{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:4px 14px;padding:8px 16px;border-top:1px solid var(--line);font-size:14px}
  .row .d{color:var(--muted);font-size:13px;word-break:break-word}
  .pill{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:#E6FBF4;color:var(--green-dark);margin-left:6px}
  @media (max-width:560px){.row{grid-template-columns:1fr}}
  .err{padding:24px;text-align:center;color:var(--muted)}
  footer{font-size:13px;color:var(--muted);padding:12px 0 40px}
  /* Needs-a-link sheet */
  .sheet{background:#fff;border:2px solid var(--green);border-radius:var(--r);margin:4px 0 16px;overflow:hidden}
  .sheet h2{margin:0;padding:14px 16px 2px;font-size:18px;color:var(--navy)}
  .sheet .why{padding:0 16px 10px;margin:0}
  .tools{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px;align-items:center}
  .tools input{flex:1;min-width:160px}
  input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:0}
  button{font:inherit;font-size:13px;font-weight:700;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
  button.go{background:var(--green);border-color:var(--green);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px 10px;border-top:1px solid var(--line);background:#FAFCFC}
  .tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
  .tbl td.co{font-weight:600;white-space:nowrap}
  .tbl .src{display:block;font-size:11px;font-weight:500;color:var(--muted)}
  .tbl .d{color:var(--muted);font-size:13px}
  .tbl a{color:var(--green-dark);font-weight:600;text-decoration:none;white-space:nowrap}
  .linkcell{display:flex;gap:6px}.linkcell input{flex:1;width:100%}
  .tried{font-size:12px;color:#B45309;margin-top:4px;word-break:break-all}
  .ok{font-size:12px;color:var(--green-dark);font-weight:700;margin-top:4px}
  @media (max-width:640px){.tbl thead{display:none}.tbl tr{display:block;border-top:1px solid var(--line);padding:6px 0}.tbl td{display:block;border:0;padding:4px 16px}}
  .account{font-size:13px;color:#CBD5E1;margin-top:10px}.account button{margin-left:6px;padding:4px 10px}
  .addco{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:#FAFCFC}
  @media (max-width:640px){.addco{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/jobs/">InternIQ</a>
  <h1>Company coverage</h1>
  <p class="sub">A robot finds each company's real job board and only adds it after proving it belongs to that company.</p>
  <div class="account" id="account"></div>
</div></header>
<main class="wrap" id="app"><div class="err">Loading…</div></main>
<footer class="wrap">The robot runs every 15 minutes. Turn any company off in Supabase → company_candidates → enabled.</footer>

<script>
(function(){
  const GROUPS = [
    ["live",            "Live — added automatically",            "#00C285", "Board found and proven to be theirs. Listings appear after the next daily sync."],
    ["unsupported",     "Needs a new scraper",                   "#7F77DD", "Their job system is one we don't read yet. Grouped by system — build the biggest one next."],
    ["identity_failed", "Found a board, couldn't prove it's them","#EF9F27", "Held back on purpose. Never shown until checked by hand."],
    ["blocked",         "Site blocks robots",                    "#D85A30", "Their careers site refuses automated visits. Can be added by hand in the browser."],
    ["board_error",     "Board found but not working",           "#B4B2A9", "Usually a wrong guessed address. Retried in 2 weeks."],
    ["no_board",        "No job board found",                    "#888780", "Careers pages didn't link to any job system we recognize. Retried in 2 weeks."],
    ["duplicate",       "Duplicate of a live company",           "#D3D1C7", "Same board as one already listed — skipped so jobs don't show twice."],
    ["no_domain",       "Missing website",                       "#D3D1C7", "Needs a website added to the candidate list."],
    ["error",           "Error",                                 "#E24B4A", "Something broke during the check. Retried automatically."],
    ["pending",         "Queued",                                "#CBD5E1", "Not tried yet. The robot checks ~24 companies every 15 minutes."],
  ];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const ago = (ts) => { if (!ts) return ""; const h = Math.round((Date.now() - new Date(ts)) / 36e5); return h < 1 ? "just now" : h < 24 ? h + "h ago" : Math.round(h / 24) + "d ago"; };

  const NEEDS = ["no_board", "blocked", "board_error", "identity_failed", "error", "no_domain"];
  const SHORT = { no_board: "No job board found", blocked: "Site blocks robots", board_error: "Board didn't work",
                  identity_failed: "Couldn't prove it's theirs", error: "Error", no_domain: "No website" };
  const S = { admin: false, clerk: null, q: "", data: null, saved: new Set() };

  // ── Sign-in (same Clerk account as the app). Only the owner can paste links. ──
  async function token(){ try { return await S.clerk?.session?.getToken(); } catch { return null; } }
  async function loadClerk(){
    try {
      const cfg = await fetch("/api/config").then((r) => r.json());
      const pk = cfg.clerkPublishableKey; if (!pk) return;
      if (!window.Clerk) {
        const host = atob(pk.replace(/^pk_(test|live)_/, "")).replace(/\$$/, "").trim();
        if (!/clerk/.test(host)) return;
        await new Promise((ok, bad) => { const sc = document.createElement("script");
          sc.src = `https://${host}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`; sc.setAttribute("data-clerk-publishable-key", pk);
          sc.async = true; sc.crossOrigin = "anonymous"; sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc); });
      }
      if (!window.Clerk) return;
      if (typeof window.Clerk.load === "function" && !window.Clerk.loaded) await window.Clerk.load({});
      S.clerk = window.Clerk;
      S.clerk.addListener?.(() => account());
      account();
    } catch { /* page still works read-only */ }
  }
  function account(){
    const el = document.getElementById("account"); if (!S.clerk) return;
    const u = S.clerk.user;
    const email = u?.primaryEmailAddress?.emailAddress || "";
    // The server is what actually enforces owner-only; this just decides whether to show the inputs.
    const was = S.admin; S.admin = !!u;
    el.innerHTML = u ? `Signed in as ${esc(email)} <button id="so">Sign out</button>` : `Owner? <button id="si">Sign in to paste links</button>`;
    el.querySelector("#so")?.addEventListener("click", () => S.clerk.signOut());
    el.querySelector("#si")?.addEventListener("click", () => S.clerk.openSignIn());
    if (was !== S.admin && S.data) render(S.data);
  }
  async function post(body){
    const r = await fetch("/api/discovery", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + (await token()) }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ("Error " + r.status));
    return j;
  }

  function sheet(rows){
    const need = rows.filter((r) => NEEDS.includes(r.status))
      .sort((a, b) => (b.source || "").localeCompare(a.source || "") || a.company.localeCompare(b.company));
    const q = S.q.toLowerCase();
    const shown = need.filter((r) => !q || r.company.toLowerCase().includes(q) || (r.source || "").toLowerCase().includes(q));
    const g = (r) => "https://www.google.com/search?q=" + encodeURIComponent(r.company + " internships careers");
    return `<div class="sheet"><h2>Needs a link · ${need.length}</h2>
      <div class="why">The robot couldn't find these job boards on its own. Paste the company's <b>job search page</b> (the page that lists the jobs) and it re-checks within ~15 minutes. A wrong link can't go live: it still has to prove the board is theirs.</div>
      <div class="tools"><input id="q" placeholder="Search companies or source…" value="${esc(S.q)}"><button id="csv">Download CSV</button></div>
      <table class="tbl"><thead><tr><th>Company</th><th>Why</th><th>Find it</th><th>${S.admin ? "Paste job-board link" : "Link tried"}</th></tr></thead><tbody>` +
      shown.map((r) => `<tr data-id="${esc(r.id)}">
        <td class="co">${esc(r.company)}<span class="src">${esc(r.source || "")}</span></td>
        <td class="d">${esc(SHORT[r.status] || r.status)}${r.attempts ? ` · tried ${r.attempts}×` : ""}</td>
        <td><a href="${g(r)}" target="_blank" rel="noopener">Google ↗</a>${r.domain ? `<br><a href="https://${esc(r.domain)}" target="_blank" rel="noopener">${esc(r.domain)} ↗</a>` : ""}</td>
        <td>${S.admin ? `<div class="linkcell"><input type="url" placeholder="https://…" aria-label="Job board link for ${esc(r.company)}"><button class="go save">Save</button></div>` : ""}
          ${r.hint ? `<div class="tried">Tried: ${esc(r.hint)}${r.detail ? " — " + esc(r.detail) : ""}</div>` : ""}
          ${S.saved.has(r.id) ? `<div class="ok">Saved ✓ — robot checks it soon</div>` : ""}</td></tr>`).join("") +
      `</tbody></table>` +
      (S.admin ? `<div class="addco"><input id="nc" placeholder="Add a company (name)"><input id="nd" placeholder="website (acme.com)"><input id="nh" placeholder="job board link (optional)"><button class="go" id="add">Add</button></div>` : "") +
      `</div>`;
  }
  function csv(rows){
    const need = rows.filter((r) => NEEDS.includes(r.status));
    const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const lines = [["Company","Website","Source","Why","Link tried","Robot note","Paste link here"].map(q).join(",")]
      .concat(need.map((r) => [r.company, r.domain, r.source, SHORT[r.status] || r.status, r.hint, r.detail, ""].map(q).join(",")));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
    a.download = "interniq-needs-a-link.csv"; a.click();
  }

  function load(){ return fetch("/api/discovery", { cache: "no-store" }).then((r) => r.json()).then((d) => { if (d.error) throw new Error(d.error); S.data = d; render(d); }); }

  function render(d) {
    const rows = d.rows || [], counts = d.counts || {};
    const total = rows.length, live = (counts.live || 0), hand = (d.handVerified || []).length;
    const tried = total - (counts.pending || 0);
    let html = `<div class="tiles">
      <div class="tile"><div class="n">${hand + live}</div><div class="l">companies live (${hand} hand-checked + ${live} robot-proven)</div></div>
      <div class="tile"><div class="n">${tried}/${total}</div><div class="l">candidates checked so far</div></div>
      <div class="tile"><div class="n">${counts.unsupported || 0}</div><div class="l">waiting on a new scraper</div></div>
      <div class="tile"><div class="n">${counts.identity_failed || 0}</div><div class="l">held back (couldn't prove)</div></div>
    </div><div class="bar">`;
    for (const [k, , color] of GROUPS) if (counts[k]) html += `<div style="width:${(counts[k] / total * 100).toFixed(2)}%;background:${color}" title="${k}: ${counts[k]}"></div>`;
    html += `</div><div class="legend">` + GROUPS.filter(([k]) => counts[k]).map(([k, label, color]) => `<span><span class="sw" style="background:${color}"></span>${esc(label)} · ${counts[k]}</span>`).join("") + `</div>`;

    for (const [k, label, , why] of GROUPS) {
      let list = rows.filter((r) => r.status === k);
      if (!list.length) continue;
      if (k === "unsupported") {
        const by = {};
        list.forEach((r) => { const sys = (r.detail || "").replace(/^Uses /, "").replace(/ — .*$/, "") || "Unknown"; (by[sys] = by[sys] || []).push(r.company); });
        const ranked = Object.entries(by).sort((a, b) => b[1].length - a[1].length);
        html += `<section><details${k === "live" ? " open" : ""}><summary>${esc(label)} <span class="c">${list.length}</span></summary><div class="why">${esc(why)}</div>` +
          ranked.map(([sys, cos]) => `<div class="row"><div><b>${esc(sys)}</b><span class="pill">${cos.length}</span></div><div class="d">${esc(cos.join(", "))}</div></div>`).join("") + `</details></section>`;
        continue;
      }
      if (k === "live") list = list.sort((a, b) => String(b.verified_at).localeCompare(String(a.verified_at)));
      html += `<section><details${k === "live" ? " open" : ""}><summary>${esc(label)} <span class="c">${list.length}</span></summary><div class="why">${esc(why)}</div>` +
        list.map((r) => `<div class="row"><div>${esc(r.company)}${k === "live" && r.intern_count ? `<span class="pill">${r.intern_count} interns</span>` : ""}</div><div class="d">${esc(r.detail || "")}${r.checked_at ? " · " + ago(r.checked_at) : ""}</div></div>`).join("") +
        `</details></section>`;
    }
    html = html.replace(`</div><div class="bar">`, `</div>` + sheet(rows) + `<div class="bar">`);
    if (hand) html += `<section><details><summary>Hand-checked companies <span class="c">${hand}</span></summary><div class="row"><div class="d" style="grid-column:1/-1">${esc(d.handVerified.join(", "))}</div></div></details></section>`;
    const app = document.getElementById("app");
    app.innerHTML = html;
    wire(app, rows);
  }

  function wire(app, rows){
    const q = app.querySelector("#q");
    q?.addEventListener("input", () => { S.q = q.value; const pos = q.selectionStart; render(S.data); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); });
    app.querySelector("#csv")?.addEventListener("click", () => csv(rows));
    app.querySelectorAll("button.save").forEach((b) => b.addEventListener("click", async () => {
      const tr = b.closest("tr"), input = tr.querySelector("input"), id = tr.dataset.id, hint = input.value.trim();
      if (!/^https?:\/\//i.test(hint)) { input.focus(); input.placeholder = "Needs a full link (https://…)"; return; }
      b.disabled = true; b.textContent = "…";
      try { await post({ id, hint }); S.saved.add(id); const r = S.data.rows.find((x) => x.id === id); if (r) { r.hint = hint; r.detail = "queued"; } render(S.data); }
      catch (e) { b.disabled = false; b.textContent = "Save"; alert(e.message); }
    }));
    app.querySelector("#add")?.addEventListener("click", async (ev) => {
      const b = ev.currentTarget, company = app.querySelector("#nc").value.trim(), domain = app.querySelector("#nd").value.trim(), hint = app.querySelector("#nh").value.trim();
      b.disabled = true;
      try { await post({ company, domain, hint: hint || undefined }); b.textContent = "Added ✓"; setTimeout(load, 800); }
      catch (e) { b.disabled = false; alert(e.message); }
    });
  }

  load().catch((e) => { document.getElementById("app").innerHTML = `<div class="err">Coverage data isn't available yet (${esc(e.message)}).</div>`; });
  loadClerk();
})();
</script>
<script src="/feedback.js" defer></script>
</body>
</html>
