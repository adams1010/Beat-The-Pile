<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beat the Pile Tour</title>
<meta name="description" content="A hands-on tour of Beat the Pile: internships and entry-level jobs for every major, jobs near your school, company pages, weekly alerts, resume tailoring, Career Fair Mode, My Season, interview practice for any company, Orbit, My Internship, Opening Radar and your profile.">
<link rel="canonical" href="https://www.beatthepile.com/demo/">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#060A2C">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--green:#4A7000;--green-dark:#3A5A00;--green-light:#F2FADF;--mint:#B0F701;--navy:#060A2C;--navy2:#0E1440;--line2:#22304D;
        --ink:#060A2C;--muted:#55627A;--faint:#5E6A80;--line:#DCE2EC;--bg:#EEF1F6;--amber:#8A4B08;--amber-light:#FFF4E6;
        --font:"Geist",-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
  *{box-sizing:border-box}
  html,body{margin:0;background:#050B16;color:#fff;font-family:var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  .theater{min-height:calc(100vh - 60px);min-height:calc(100dvh - 60px);display:flex;flex-direction:column;
           background:radial-gradient(1200px 600px at 75% 30%,#0D1C33 0%,#050B16 70%)}
  /* chapter rail */
  .rail{display:flex;gap:6px;overflow-x:auto;padding:14px 20px 4px;scrollbar-width:none;max-width:1240px;width:100%;margin:0 auto}
  .rail::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line2);background:transparent;color:#8A97B0;border-radius:999px;padding:6px 12px 6px 7px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .25s var(--ease)}
  .chip i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:600;background:#13223B;color:#9FAAC0}
  .chip:hover{border-color:#3A4D72;color:#C9D2E3}
  .chip.done i{background:var(--mint);color:var(--navy)}
  .chip[aria-current="step"]{background:#fff;color:var(--navy);border-color:#fff}
  .chip[aria-current="step"] i{background:var(--navy);color:#fff}
  .meter{max-width:1200px;width:calc(100% - 40px);margin:8px auto 0;height:2px;background:#13223B;border-radius:2px;overflow:hidden}
  .meter b{display:block;height:100%;background:var(--mint);width:0;transition:width .6s var(--ease)}
  /* scene */
  .scene{flex:1;max-width:1240px;width:100%;margin:0 auto;padding:22px 20px 18px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:44px;align-items:center}
  @media (max-width:900px){.scene{grid-template-columns:1fr;gap:16px;padding-top:14px;align-items:start}}
  .copy .num{font-size:13px;font-weight:600;color:var(--mint);letter-spacing:.02em}
  .copy h1{margin:8px 0 12px;font-size:clamp(30px,4.6vw,54px);line-height:1.02;font-weight:700;letter-spacing:-.035em;text-wrap:balance}
  .copy h1 .w{display:inline-block;opacity:0;transform:translateY(18px);filter:blur(6px);transition:opacity .55s var(--ease),transform .55s var(--ease),filter .55s var(--ease)}
  .copy h1.in .w{opacity:1;transform:none;filter:none}
  .copy p{margin:0;color:#A9B4C9;font-size:clamp(15px,1.6vw,18px);line-height:1.5;max-width:480px;opacity:0;transform:translateY(10px);transition:all .6s var(--ease) .25s}
  .copy.in p{opacity:1;transform:none}
  .todo{margin-top:20px;display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line2);background:rgba(13,26,47,.7);border-radius:999px;padding:8px 14px 8px 10px;font-size:14px;color:#DCE3EF;opacity:0;transition:opacity .5s var(--ease) .45s}
  .copy.in .todo{opacity:1}
  .todo .dot{width:10px;height:10px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(176,247,1,.6);animation:pulse 1.6s infinite}
  .todo.ok .dot{animation:none;box-shadow:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(176,247,1,.55)}70%{box-shadow:0 0 0 10px rgba(176,247,1,0)}100%{box-shadow:0 0 0 0 rgba(176,247,1,0)}}
  .real{margin-top:12px;font-size:12.5px;color:#7F8CA5}
  @media (max-width:900px){.copy h1{font-size:clamp(26px,7.4vw,36px);margin:6px 0 8px}.copy p{font-size:15px}.todo{margin-top:12px;font-size:13.5px}.real{display:none}}
  /* app window */
  .stagewrap{position:relative;perspective:1600px}
  .win{position:relative;background:var(--bg);color:var(--ink);border-radius:10px;overflow:hidden;box-shadow:none;
       transform-origin:50% 60%;transition:transform .7s var(--ease),opacity .5s var(--ease)}
  .win.out{opacity:0;transform:translateY(24px) scale(.97) rotateX(4deg)}
  .bar{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:9px 12px}
  .bar .dots{display:flex;gap:5px}.bar .dots i{width:9px;height:9px;border-radius:50%;background:#DCE2EC}
  .bar .url{flex:1;background:#F1F4F8;border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .url b{color:var(--ink);font-weight:500}
  .view{height:min(560px,62vh);overflow:auto;padding:16px;position:relative;scroll-behavior:smooth}
  @media (max-width:900px){.view{height:auto;min-height:380px;max-height:none;padding:12px}}
  /* spotlight + cursor */
  .spot{position:absolute;pointer-events:none;border-radius:10px;box-shadow:0 0 0 3px var(--mint),0 0 0 9999px rgba(6,10,44,.32);transition:all .45s var(--ease);opacity:0;z-index:20}
  .spot.on{opacity:1;animation:ring 1.6s infinite}
  @keyframes ring{0%,100%{box-shadow:0 0 0 3px var(--mint),0 0 0 9999px rgba(6,10,44,.32)}50%{box-shadow:0 0 0 6px rgba(176,247,1,.55),0 0 0 9999px rgba(6,10,44,.32)}}
  .tip{position:absolute;z-index:21;pointer-events:none;background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;border-radius:8px;padding:6px 10px;white-space:nowrap;opacity:0;transform:translateY(4px);transition:all .3s var(--ease)}
  .tip.on{opacity:1;transform:none}
  .tip::after{content:"";position:absolute;left:16px;top:100%;border:6px solid transparent;border-top-color:var(--navy)}
  .tip.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--navy)}
  .cursor{position:absolute;z-index:30;width:22px;height:22px;pointer-events:none;transition:left .7s var(--ease),top .7s var(--ease),opacity .3s;opacity:0}
  .cursor.on{opacity:1}
  .cursor svg{filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
  .ripple{position:absolute;z-index:29;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:2px solid var(--mint);pointer-events:none;animation:rip .55s var(--ease) forwards}
  @keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
  .burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:25}
  .burst span{background:var(--navy);color:#fff;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;animation:pop .9s var(--ease) forwards;box-shadow:none}
  .burst span::before{content:"✓";width:20px;height:20px;border-radius:50%;background:var(--mint);color:var(--navy);display:grid;place-items:center;font-size:12px}
  @keyframes pop{0%{opacity:0;transform:scale(.85)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
  /* controls */
  .ctrls{max-width:1240px;width:100%;margin:0 auto;padding:6px 20px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .cbtn{border:1px solid var(--line2);background:transparent;color:#C9D2E3;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:44px}
  .cbtn:hover{border-color:#3A4D72;color:#fff}
  .cbtn.next{background:var(--mint);border-color:var(--mint);color:var(--navy)}
  .cbtn.next:hover{background:#5BE0B0}
  .cbtn.next.wait{background:transparent;color:#C9D2E3;border-color:var(--line2)}
  .cbtn[disabled]{opacity:.35;cursor:default}
  .cbtn .pl{width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
  .cbtn .pa{width:9px;height:10px;border-left:3px solid currentColor;border-right:3px solid currentColor}
  .story{color:#8A97B0;font-size:13px}.story a{color:var(--mint)}
  @media (max-width:600px){.story{display:none}.cbtn{padding:10px 13px;font-size:13.5px}}
  @media (max-width:900px){.ctrls{position:sticky;bottom:0;z-index:40;background:rgba(5,11,22,.92);border-top:1px solid var(--line2);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}}
  /* in-app UI (light) */
  .h{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
  .sub{font-size:13px;color:var(--muted);margin:0 0 12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .stack{display:grid;gap:8px}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .pill{font-size:13px;font-weight:500;border:1px solid #C9D1DE;background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
  .pill[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .job{cursor:pointer;transition:border-color .2s}.job:hover{border-color:#B9C3D3}
  .job .t{font-weight:600;font-size:14.5px;line-height:1.3}
  .co{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--muted)}
  .lg{flex:none;width:26px;height:26px;border-radius:7px;background:#E7ECF4;color:var(--navy);font-size:11px;font-weight:700;display:grid;place-items:center}
  .lg.big{width:48px;height:48px;border-radius:10px;font-size:17px}
  .found{font-size:12px;color:var(--faint);margin-top:4px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .b{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;font-weight:600;border-radius:999px;padding:8px 14px;border:1px solid #C9D1DE;background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;min-height:38px}
  .b.go{background:var(--green);border-color:var(--green);color:#fff}
  .b.on{background:var(--green-light);border-color:#BFE3D2;color:var(--green-dark)}
  .ex{display:inline-block;font-size:11px;font-weight:500;color:var(--muted);background:#F1F4F8;border:1px solid var(--line);border-radius:999px;padding:1px 8px;vertical-align:2px;margin-left:4px}
  .est{font-size:11px;font-weight:600;color:var(--amber);background:var(--amber-light);border-radius:999px;padding:1px 8px;margin-left:4px}
  .skel{height:70px;border-radius:10px;background:linear-gradient(90deg,#F1F3F7,#E6EAF0,#F1F3F7);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .fade{animation:fin .5s var(--ease) both}@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
  .kv div{background:#F4F6F9;border-radius:10px;padding:9px 10px;font-size:12px;color:var(--muted)}.kv b{display:block;font-size:18px;color:var(--ink)}
  .mail{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .mail .mh{padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.55}
  .mail .mb{padding:12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
  .er{border-top:1px solid #E3E7ED;padding:8px 0;font-size:13px;color:var(--muted)}.er b{color:var(--ink);font-weight:600}
  .slidein{animation:sl .6s var(--ease) both}@keyframes sl{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
  .rw{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;background:#fff}
  .rw .bf{color:var(--muted);text-decoration:line-through;text-decoration-color:#C9D1DE}.rw .af{margin-top:3px;font-weight:500}.rw .af::before{content:"→ ";color:var(--green);font-weight:700}
  .kw{display:flex;gap:6px;flex-wrap:wrap}.kw span{background:var(--green-light);color:var(--green-dark);border-radius:999px;padding:3px 10px;font-size:12.5px}
  textarea.res{width:100%;min-height:96px;font:13px/1.45 var(--font);border:1px solid #C9D1DE;border-radius:10px;padding:9px;color:var(--ink);resize:none}
  .floor{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  @media (max-width:520px){.floor{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .booth{position:relative;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;text-align:left;cursor:pointer;font:inherit;color:inherit;min-height:66px;transition:all .25s var(--ease)}
  .booth .bn{font-size:11px;font-weight:600;color:var(--muted)}.booth b{display:block;font-size:12.5px;font-weight:600;line-height:1.25;margin-top:2px}
  .booth small{font-size:11px;color:var(--muted)}
  .booth.pick{border-color:var(--green);background:var(--green-light)}
  .booth .ord{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;animation:pop2 .4s var(--ease)}
  @keyframes pop2{from{transform:scale(0)}to{transform:scale(1)}}
  .phone{width:210px;border:9px solid var(--navy);border-radius:10px;background:#fff;padding:14px 12px;margin:0 auto;text-align:center;position:relative}
  .phone.dark{background:linear-gradient(160deg,#1B2B47,#0B1424);color:#fff;min-height:330px;text-align:left}
  .qr{width:120px;height:120px;margin:8px auto;display:grid;grid-template-columns:repeat(21,1fr)}.qr i{display:block}
  .notif{background:rgba(255,255,255,.92);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.35;margin-top:70px;cursor:pointer;animation:drop .6s var(--ease) both}
  .notif b{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px}
  @keyframes drop{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
  .clock{font-size:44px;font-weight:600;text-align:center;margin-top:18px;letter-spacing:-.02em}.date{text-align:center;font-size:12px;color:#B8C2D6}
  .kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .col{background:#E7ECF3;border-radius:10px;padding:8px;min-height:190px}
  .col h4{margin:2px 4px 8px;font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
  .kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 9px;font-size:12px;line-height:1.3;margin-bottom:6px}
  .kc b{display:block;font-size:12.5px}.kc .b{min-height:28px;padding:4px 10px;font-size:12px;margin-top:6px}
  .ring{--p:40;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),#E3E7ED 0);display:grid;place-items:center;transition:--p .8s}
  .ring i{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:16px}
  .radar .card{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .radar small{color:var(--muted);font-size:12px}
  .timer{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;background:conic-gradient(var(--green) calc(var(--p,0)*1%),#E3E7ED 0);position:relative}
  .timer::before{content:"";position:absolute;inset:8px;border-radius:50%;background:#fff}.timer span{position:relative}
  .gr{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
  .grade{width:72px;height:72px;border-radius:10px;background:var(--green-light);color:var(--green-dark);display:grid;place-items:center;font-size:30px;font-weight:700}
  .bars{display:grid;gap:6px;font-size:12px;color:var(--muted)}.bars div{display:grid;grid-template-columns:72px 1fr 26px;gap:8px;align-items:center}
  .bars s{display:block;height:6px;border-radius:6px;background:#E3E7ED;overflow:hidden;text-decoration:none}.bars s i{display:block;height:100%;background:var(--green);width:0;transition:width 1s var(--ease)}
  .prof .band{height:70px;background:var(--navy);border-radius:10px 12px 0 0;margin:-12px -14px 0}
  .prof .av{width:64px;height:64px;border-radius:50%;background:var(--mint);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:22px;border:4px solid #fff;margin-top:-32px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{background:#F1F4F8;border-radius:999px;padding:3px 10px;font-size:12px}
  .finale{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  @media (max-width:600px){.finale{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .fz{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:12.5px;color:var(--muted);text-decoration:none;display:block;transition:border-color .2s}
  .fz:hover{border-color:var(--green)}.fz b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}
  .kd{display:flex;gap:0;border:1px solid #C9D1DE;border-radius:999px;overflow:hidden;width:max-content;margin:0 0 12px}.kd button{border:0;background:#fff;font:inherit;font-size:13px;font-weight:500;padding:6px 12px;cursor:pointer;color:var(--ink)}.kd button[aria-pressed="true"]{background:var(--navy);color:#fff}
  .ft{font-size:11px;font-weight:600;color:var(--green-dark);background:var(--green-light);border-radius:999px;padding:1px 8px;margin-left:6px}
  .mi{font-size:12px;font-weight:600;color:var(--green-dark)}
  .inp{width:100%;font:inherit;font-size:14px;border:1px solid #C9D1DE;border-radius:10px;padding:9px 11px;color:var(--ink);background:#fff}
  .dd{border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:4px;overflow:hidden;box-shadow:none}.dd div{padding:8px 11px;font-size:13.5px;cursor:pointer}.dd div:first-child{background:var(--green-light)}.dd small{display:block;color:var(--muted);font-size:11.5px}
  .prac{margin-top:8px;border:1px solid #C7D2F0;border-radius:10px;background:#F7F5FF;padding:8px 10px;font-size:12px}.prac b{color:#4C1D95;display:block;margin-bottom:6px}
  .orb{width:100%;max-width:330px;display:block;margin:0 auto}.orb .p{cursor:pointer}
  .leg{display:grid;gap:6px;font-size:12.5px}.leg div{display:flex;align-items:center;gap:8px}.leg i{width:10px;height:10px;border-radius:50%;border:2px solid}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 0;border-top:1px solid #EEF1F6}.chk i{flex:none;width:16px;height:16px;border-radius:5px;border:1.5px solid #B9C3D3;margin-top:1px}.chk.ok i{background:var(--green);border-color:var(--green)}.chk.ok span{color:var(--muted);text-decoration:line-through}
  .phase{font-size:11.5px;font-weight:600;color:var(--muted);margin:8px 0 2px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body data-fb-button="off">
<div id="acct" hidden></div>
<main class="theater">
  <nav class="rail" id="rail" aria-label="Tour chapters"></nav>
  <div class="meter" aria-hidden="true"><b id="meter"></b></div>
  <section class="scene">
    <div class="copy" id="copy" aria-live="polite"></div>
    <div class="stagewrap"><div class="win" id="win">
      <div class="bar"><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="url" id="url"></div></div>
      <div class="view" id="view"></div>
    </div></div>
  </section>
  <div class="ctrls">
    <button class="cbtn" type="button" id="back">← Back</button>
    <span class="story">No account needed. Nothing you do here is saved. <a href="/demo/story/">90-second story version</a></span>
    <div class="row"><button class="cbtn" type="button" id="auto"><span class="pl"></span> Watch it</button><button class="cbtn next wait" type="button" id="next">Next →</button></div>
  </div>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  function qr() { let s = 11; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const f = (r, c) => { for (const [r0, c0] of [[0, 0], [0, 14], [14, 0]]) if (r >= r0 && r < r0 + 7 && c >= c0 && c < c0 + 7) { const a = r - r0, b = c - c0; return a === 0 || a === 6 || b === 0 || b === 6 || (a > 1 && a < 5 && b > 1 && b < 5); } return null; };
    let h = ""; for (let r = 0; r < 21; r++) for (let c = 0; c < 21; c++) { const x = f(r, c); h += `<i style="background:${(x === null ? rnd() > .55 : x) ? "#060A2C" : "#fff"}"></i>`; } return h; }

  ch({ key: "finale", label: "Start", url: "/", title: "That's Beat the Pile.",
    line: "Everything you just tried is on the real site. Start with your major, or open any feature below.",
    real: "", steps: [],
    mount(v) {
      const F = [["Internships + full-time", "/jobs/?major=" + D.major, "Every major, from company job boards"], ["Near you", "/jobs/?near=Blacksburg, VA", "Within 50 miles of your school"], ["Company pages", "/jobs/", "Roles, locations, opening dates"],
        ["Weekly email", "/jobs/", "New jobs, once a week"], ["Tailor resume", "/jobs/", "On every job card"], ["Career Fair Mode", "/fair/", "Route, briefs, QR, notes, follow-ups"],
        ["My Season", "/season/", "Pipeline, weekly goal, interview prep"], ["Interview practice", "/#interview", "Any company, out loud, graded"], ["Orbit", "/orbit/", "Classmates, insiders, messages"],
        ["My Internship", "/internship/", "Checklist + resume bullets"], ["Opening Radar", "/radar/", "When companies open"], ["Profile", "/u/", "Your school, your link"]];
      v.innerHTML = `<div class="finale">${F.map(([t, h, s], i) => `<a class="fz fade" style="animation-delay:${i * 45}ms" href="${h}"><b>${t}</b>${s}</a>`).join("")}</div>
        <div class="acts" style="margin-top:14px;justify-content:center"><a class="b go" href="/jobs/?major=${D.major}" style="padding:12px 22px;font-size:15px">Start free →</a><button class="b" id="again">Replay the tour</button></div>`;
      $("again").onclick = () => engine.go(0);
    } });

  // ── engine: chapters, spotlight, autoplay ──
  const engine = { i: 0, step: 0, auto: false, done: new Set(), token: 0 };
  const view = $("view"), win = $("win");
  const spot = document.createElement("div"); spot.className = "spot"; const tip = document.createElement("div"); tip.className = "tip";
  const cur = document.createElement("div"); cur.className = "cursor"; cur.innerHTML = `<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 2l15 9-7 1.5L8 20z" fill="#fff" stroke="#060A2C" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  win.append(spot, tip, cur);
  function rail() {
    $("rail").innerHTML = CH.map((c, k) => `<button class="chip ${engine.done.has(c.key) ? "done" : ""}" type="button" data-k="${k}" ${k === engine.i ? 'aria-current="step"' : ""}><i>${engine.done.has(c.key) ? "✓" : k + 1}</i>${c.label}</button>`).join("");
    $("rail").querySelectorAll("[data-k]").forEach((b) => b.onclick = () => { stopAuto(); engine.go(+b.dataset.k); });
    const on = $("rail").querySelector('[aria-current="step"]'); if (on) on.scrollIntoView({ inline: "center", block: "nearest", behavior: reduce ? "auto" : "smooth" });
    $("meter").style.width = (engine.i / (CH.length - 1) * 100) + "%";
  }
  function copy(c) {
    const words = c.title.split(" ").map((w, k) => `<span class="w" style="transition-delay:${k * 55}ms">${esc(w)}</span>`).join(" ");
    $("copy").className = "copy";
    $("copy").innerHTML = `<div class="num">${String(engine.i + 1).padStart(2, "0")} / ${CH.length}${c.real ? ` · ${esc(c.real)}` : ""}</div><h1>${words}</h1><p>${esc(c.line)}</p>
      ${c.steps.length ? `<div class="todo" id="todo"><span class="dot"></span><span id="todoT"></span></div>` : ""}`;
    requestAnimationFrame(() => requestAnimationFrame(() => { $("copy").classList.add("in"); $("copy").querySelector("h1").classList.add("in"); }));
  }
  function place(el, label, below) {
    const w = win.getBoundingClientRect(), r = el.getBoundingClientRect();
    if (r.bottom > view.getBoundingClientRect().bottom || r.top < view.getBoundingClientRect().top) el.scrollIntoView({ block: "center", behavior: "auto" });
    const r2 = el.getBoundingClientRect();
    Object.assign(spot.style, { left: r2.left - w.left - 5 + "px", top: r2.top - w.top - 5 + "px", width: r2.width + 10 + "px", height: r2.height + 10 + "px" });
    spot.classList.add("on");
    tip.textContent = label; tip.classList.toggle("below", !!below);
    const tw = Math.min(220, label.length * 7.4 + 24);
    tip.style.left = Math.max(8, Math.min(w.width - tw - 8, r2.left - w.left)) + "px";
    tip.style.top = (below ? r2.bottom - w.top + 12 : r2.top - w.top - 40) + "px";
    tip.classList.add("on");
  }
  function hideSpot() { spot.classList.remove("on"); tip.classList.remove("on"); }
  function target() { const s = CH[engine.i].steps[engine.step]; return s ? [view.querySelector(s[0]), s] : [null, null]; }
  async function showStep() {
    const t = engine.token, c = CH[engine.i];
    if (engine.step >= c.steps.length) return complete();
    let el, s; for (let k = 0; k < 60; k++) { [el, s] = target(); if (el || t !== engine.token) break; await sleep(100); }
    if (t !== engine.token) return;
    if (!el) { hideSpot(); return complete(true); }
    if ($("todoT")) $("todoT").textContent = s[1];
    place(el, s[1], s[2] === "below");
    if (engine.auto) autoClick(el, t);
  }
  view.addEventListener("click", (e) => {
    const s = CH[engine.i].steps[engine.step]; if (!s) return;
    const hit = e.target.closest && e.target.closest(s[0]);
    if (hit && view.contains(hit)) {
      if (s[0] === "#tgo") { engine.step++; hideSpot(); return; }   // tailor advances when the AI answers
      engine.step++; hideSpot(); setTimeout(showStep, 380);
    }
  }, true);
  engine.advance = () => { if (CH[engine.i].key === "tailor") setTimeout(showStep, 200); };
  addEventListener("resize", () => { const [el, s] = target(); if (el && spot.classList.contains("on")) place(el, s[1], s[2] === "below"); });
  view.addEventListener("scroll", () => { const [el, s] = target(); if (el && spot.classList.contains("on")) place(el, s[1], s[2] === "below"); });
  async function complete(skipped) {
    const c = CH[engine.i]; const t = engine.token;
    if (!skipped && !engine.done.has(c.key)) { engine.done.add(c.key); track("demo_chapter", { chapter: c.key, auto: engine.auto }); }
    rail();
    if ($("todo")) { $("todo").classList.add("ok"); $("todoT").textContent = "Done"; }
    if (c.steps.length && !skipped) { const b = document.createElement("div"); b.className = "burst"; b.innerHTML = `<span>${esc(c.label)}</span>`; win.append(b); setTimeout(() => b.remove(), 950); }
    $("next").classList.remove("wait");
    if (engine.auto && engine.i < CH.length - 1) { await sleep(2300); if (engine.auto && t === engine.token) engine.go(engine.i + 1); }
  }
  async function autoClick(el, t) {
    await sleep(900); if (!engine.auto || t !== engine.token) return;
    const w = win.getBoundingClientRect(), r = el.getBoundingClientRect();
    cur.classList.add("on"); cur.style.left = r.left - w.left + Math.min(r.width / 2, 60) + "px"; cur.style.top = r.top - w.top + r.height / 2 + "px";
    await sleep(800); if (!engine.auto || t !== engine.token) return;
    const rp = document.createElement("div"); rp.className = "ripple"; rp.style.left = cur.style.left; rp.style.top = cur.style.top; win.append(rp); setTimeout(() => rp.remove(), 600);
    if (typeof el.click === "function") el.click(); else el.dispatchEvent(new MouseEvent("click", { bubbles: true }));   // SVG nodes (Orbit) have no .click()
  }
  engine.go = async (k) => {
    engine.token++; const t = engine.token;
    engine.i = Math.max(0, Math.min(CH.length - 1, k)); engine.step = 0; hideSpot();
    const c = CH[engine.i];
    win.classList.add("out"); await sleep(reduce ? 0 : 260); if (t !== engine.token) return;
    $("url").innerHTML = `beatthepile.com<b>${esc(typeof c.url === "function" ? c.url() : c.url)}</b>`;
    view.scrollTop = 0; copy(c); rail();
    $("back").disabled = engine.i === 0; $("next").textContent = engine.i === CH.length - 1 ? "Start free →" : "Next →";
    $("next").classList.toggle("wait", c.steps.length > 0 && !engine.done.has(c.key));
    await c.mount(view); if (t !== engine.token) return;
    win.classList.remove("out");
    if (!c.steps.length) { if (!engine.done.has(c.key)) engine.done.add(c.key); rail(); stopAuto(); return; }
    await sleep(reduce ? 0 : 650); if (t === engine.token) showStep();
  };
  function stopAuto() { engine.auto = false; cur.classList.remove("on"); $("auto").innerHTML = `<span class="pl"></span> Watch it`; }
  $("auto").onclick = () => {
    if (engine.auto) return stopAuto();
    engine.auto = true; $("auto").innerHTML = `<span class="pa"></span> Pause`; track("demo_autoplay", {});
    const [el] = target(); if (el) autoClick(el, engine.token); else if (engine.done.has(CH[engine.i].key) || !CH[engine.i].steps.length) engine.go(engine.i + 1);
  };
  $("next").onclick = () => { if (engine.i === CH.length - 1) { location.href = "/jobs/?major=" + D.major; return; } engine.go(engine.i + 1); };
  $("back").onclick = () => { stopAuto(); engine.go(engine.i - 1); };
  view.addEventListener("pointerdown", (e) => { if (engine.auto && e.isTrusted) stopAuto(); });
  addEventListener("keydown", (e) => { if (e.target.closest("input,textarea")) return; if (e.key === "ArrowRight") $("next").click(); if (e.key === "ArrowLeft") $("back").click(); });
  try { const m = localStorage.getItem("btp_major"); if (LABEL[m]) D.major = m; } catch {}
  engine.go(0);
})();
</script>
