<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker — Beat the Pile</title>
<meta name="description" content="Your application tracker: every company, role, pay, status and next step in one editable sheet.">
<link rel="canonical" href="https://www.beatthepile.com/tracker/">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<meta name="theme-color" content="#060A2C">
<link rel="stylesheet" href="/business/biz.css">
<style>
  /* /tracker/ (Nov 12): an editable application sheet. Same records as My Season (user_jobs.apps via action "app"),
     plus the tracker columns in cleanApp (kind, pay, payUnit, location, deadline, contact, notes, checks).
     Signed out → saved on this device (localStorage btp_tracker_local) and moved into the account at sign-in. */
  main{max-width:1320px}
  .head{background:var(--navy);color:#fff;border-radius:16px;padding:20px 22px;margin-bottom:14px}
  .head h1{color:#fff;margin:0;font-size:26px}.head .sub{color:#C9D2E3;margin:4px 0 0}
  .stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:16px}
  .stat{background:#0E1440;border:1px solid #22304D;border-radius:12px;padding:10px 12px}
  .stat b{display:block;font-size:24px;line-height:1.1;color:var(--lime);font-variant-numeric:tabular-nums}
  .stat span{font-size:12.5px;color:#C9D2E3}
  @media (max-width:820px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
  .tools input[type=search],.tools select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;color:var(--ink)}
  .tools input[type=search]{flex:1 1 260px;min-width:180px;width:auto;margin:0}
  .tools select,.tools .btn{flex:0 0 auto;width:auto;margin:0}
  .tools .sp{flex:1}
  .note{font-size:13px;color:var(--muted);margin:0 0 10px}
  .note.warn{background:#FEF3E2;border:1px solid #F5D9A8;color:#6B3B05;border-radius:10px;padding:8px 12px}
  .sheet{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 220px)}
  table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13.5px}
  th,td{border-bottom:1px solid #EEF1F6;border-right:1px solid #F2F4F8;padding:0;vertical-align:middle;background:#fff}
  th{position:sticky;top:0;z-index:2;background:#F7F9FC;font-weight:600;font-size:12.5px;color:var(--muted);text-align:left;white-space:nowrap}
  th button{all:unset;cursor:pointer;display:block;padding:9px 10px}
  th button:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
  th .ar{color:var(--green);margin-left:4px}
  th.c,td.c{text-align:center}
  td input,td select,td textarea{font:inherit;font-size:13.5px;color:var(--ink);border:0;background:transparent;padding:8px 10px;width:100%;min-width:0;border-radius:0}
  td input:focus,td select:focus,td textarea:focus{outline:2px solid var(--green);outline-offset:-2px;background:#FBFDF6}
  td input[type=checkbox]{width:18px;height:18px;padding:0;margin:0 auto;display:block;accent-color:var(--green);cursor:pointer}
  td textarea{resize:vertical;min-height:34px;height:34px;display:block}
  .col-co{position:sticky;left:0;z-index:1}
  th.col-co{z-index:3}
  tr:hover td{background:#FAFBFD}
  tr.off td{background:#FBF7F7}
  .pay{display:flex;align-items:center}.pay span{padding-left:10px;color:var(--muted)}.pay input{width:96px;text-align:right;padding-left:2px}.pay select{width:auto;padding-left:2px;color:var(--muted)}
  .st{font-weight:600}
  .st[data-v=applied]{color:#1D4ED8}.st[data-v=interview]{color:#6D28D9}.st[data-v=offer]{color:var(--green)}.st[data-v=rejected]{color:#B91C1C}
  .lnk{display:flex;align-items:center}.lnk a{padding:0 8px;color:var(--green);font-weight:600;text-decoration:none}
  .del{all:unset;cursor:pointer;color:var(--faint);padding:8px 10px;font-size:16px}.del:hover{color:#B91C1C}
  .saved{font-size:12.5px;color:var(--muted);min-width:70px}
  .empty{padding:28px;text-align:center;color:var(--muted)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#B45309;margin-left:6px;vertical-align:1px}
  @media (max-width:640px){.head{padding:16px}.head h1{font-size:22px}.sheet{max-height:none}}
</style>
</head>
<body>
<script src="/nav.js"></script>
<main id="main"><div class="card center">Loading…</div></main>
<script src="/business/biz.js"></script>
<script>
(() => {
  const { esc, $ } = biz;
  const LOCAL_KEY = "btp_tracker_local";
  const UNITS = [["hour", "/hr"], ["year", "/yr"], ["month", "/mo"], ["week", "/wk"], ["total", "total"]];
  const STAGES = [["applied", "Applied"], ["interview", "Interview"], ["offer", "Offer"], ["rejected", "Rejected"]];
  // Columns: [key, label, kind, width]. "check" = tick box, sortable everywhere.
  const COLS = [
    ["submitted", "Applied", "check", 70], ["company", "Company", "text", 180], ["title", "Role", "text", 220], ["kind", "Type", "kind", 110],
    ["pay", "Pay", "pay", 190], ["location", "Location", "text", 150], ["appliedAt", "Date applied", "date", 140], ["deadline", "Deadline", "date", 140],
    ["stage", "Status", "stage", 120], ["followedUp", "Followed up", "check", 92], ["interviewed", "Interview", "check", 84], ["offered", "Offer", "check", 70],
    ["accepted", "Accepted", "check", 82], ["thankyou", "Thank-you sent", "check", 112], ["contact", "Contact", "text", 160], ["url", "Link", "url", 190], ["notes", "Notes", "notes", 260],
  ];
  let S = { user: null, apps: [], local: false, sort: { key: "appliedAt", dir: -1 }, q: "", stage: "all", kind: "all" };
  const timers = new Map();

  const day = (iso) => (iso ? String(iso).slice(0, 10) : "");
  const toIso = (d) => (d ? new Date(d + "T12:00:00").toISOString() : null);
  const getV = (a, k) => k in (a.checks || {}) && ["submitted", "interviewed", "offered", "accepted", "thankyou"].includes(k) ? !!a.checks[k]
    : k === "followedUp" ? !!a.followedUpAt : a[k];
  const blank = () => ({ id: "m:" + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)), company: "", title: "", kind: "intern",
    pay: null, payUnit: "hour", location: "", appliedAt: new Date().toISOString(), deadline: null, stage: "applied", followedUpAt: null,
    checks: { submitted: true, interviewed: false, offered: false, accepted: false, thankyou: false }, contact: "", url: "", notes: "", fresh: true });
  const norm = (a) => ({ ...a, checks: { submitted: true, interviewed: a.stage === "interview" || a.stage === "offer", offered: a.stage === "offer", accepted: false, thankyou: false, ...(a.checks || {}) } });

  // ── storage: your account, or this device when signed out ──
  const readLocal = () => { try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); } catch { return []; } };
  const writeLocal = () => { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(S.apps)); } catch {} };
  async function save(a){
    if (S.local) { writeLocal(); return flash(a.id, "Saved on this device"); }
    if (!a.company.trim()) return flash(a.id, "Add a company");
    flash(a.id, "Saving…");
    try {
      const { fresh, ...app } = a;
      const r = await biz.api({ action: "app", app });
      const back = (r.apps || []).find((x) => x.id === a.id); if (back) Object.assign(a, norm(back), { fresh: false });
      flash(a.id, "Saved");
    } catch (e) { flash(a.id, e.message); }
  }
  const later = (a) => { clearTimeout(timers.get(a.id)); timers.set(a.id, setTimeout(() => save(a), 700)); };
  function flash(id, text){ const el = document.querySelector(`[data-saved="${CSS.escape(id)}"]`); if (el) el.textContent = text; }

  // ── numbers at the top (only what's in your sheet) ──
  function stats(){
    const A = S.apps.filter((a) => a.company), n = A.length;
    const sent = A.filter((a) => a.checks.submitted).length, iv = A.filter((a) => a.checks.interviewed || a.stage === "interview" || a.stage === "offer").length;
    const of = A.filter((a) => a.checks.offered || a.stage === "offer").length, rej = A.filter((a) => a.stage === "rejected").length;
    const hr = A.filter((a) => a.pay && a.payUnit === "hour").map((a) => a.pay), yr = A.filter((a) => a.pay && a.payUnit === "year").map((a) => a.pay);
    const avg = (x) => x.reduce((s, v) => s + v, 0) / x.length, money = (v, d = 0) => "$" + v.toLocaleString(undefined, { maximumFractionDigits: d });
    const pay = hr.length ? money(avg(hr), 2) + "/hr" : yr.length ? money(avg(yr)) + "/yr" : "—";
    return [[sent, "Applied"], [iv, "Interviews"], [of, "Offers"], [rej, "Rejected"], [sent ? Math.round(((iv + rej) / sent) * 100) + "%" : "—", "Heard back"], [pay, hr.length ? "Avg hourly pay" : "Avg pay"]]
      .map(([b, s]) => `<div class="stat"><b data-noi18n>${esc(b)}</b><span>${esc(s)}</span></div>`).join("") + (n ? "" : "");
  }

  function rows(){
    const q = S.q.trim().toLowerCase();
    let list = S.apps.filter((a) => (S.stage === "all" || a.stage === S.stage) && (S.kind === "all" || (a.kind || "intern") === S.kind)
      && (!q || [a.company, a.title, a.location, a.contact, a.notes].some((x) => String(x || "").toLowerCase().includes(q))));
    const { key, dir } = S.sort;
    list = list.slice().sort((x, y) => {
      if (x.fresh !== y.fresh) return x.fresh ? -1 : 1;       // a row you just added stays on top while you fill it in
      let a = getV(x, key), b = getV(y, key);
      if (typeof a === "boolean" || typeof b === "boolean") { a = a ? 1 : 0; b = b ? 1 : 0; }
      if (key === "pay") { const yrly = (r) => !r.pay ? -1 : r.pay * ({ hour: 2080, week: 52, month: 12, year: 1, total: 1 }[r.payUnit || "hour"]); a = yrly(x); b = yrly(y); }
      if (a == null || a === "") return 1; if (b == null || b === "") return -1;
      return (a > b ? 1 : a < b ? -1 : 0) * dir;
    });
    return list;
  }

  function cell(a, [k, , type]){
    const v = getV(a, k), id = esc(a.id);
    if (type === "check") return `<td class="c"><input type="checkbox" data-id="${id}" data-k="${k}" aria-label="${esc(k)}" ${v ? "checked" : ""}></td>`;
    if (type === "kind") return `<td><select data-id="${id}" data-k="kind" aria-label="Type"><option value="intern"${(v || "intern") === "intern" ? " selected" : ""}>Internship</option><option value="fulltime"${v === "fulltime" ? " selected" : ""}>Full-time</option></select></td>`;
    if (type === "stage") return `<td><select class="st" data-v="${esc(v)}" data-id="${id}" data-k="stage" aria-label="Status">${STAGES.map(([s, l]) => `<option value="${s}"${v === s ? " selected" : ""}>${l}</option>`).join("")}</select></td>`;
    if (type === "pay") return `<td><div class="pay"><span>$</span><input type="number" min="0" step="0.01" inputmode="decimal" data-id="${id}" data-k="pay" value="${a.pay ?? ""}" placeholder="0" aria-label="Pay">
      <select data-id="${id}" data-k="payUnit" aria-label="Pay per">${UNITS.map(([u, l]) => `<option value="${u}"${(a.payUnit || "hour") === u ? " selected" : ""}>${l}</option>`).join("")}</select></div></td>`;
    if (type === "date") return `<td><input type="date" data-id="${id}" data-k="${k}" value="${day(v)}" aria-label="${esc(k)}"></td>`;
    if (type === "url") return `<td><div class="lnk"><input type="url" data-id="${id}" data-k="url" value="${esc(v || "")}" placeholder="https://" aria-label="Link">${/^https?:\/\//.test(v || "") ? `<a href="${esc(v)}" target="_blank" rel="noopener" title="Open">↗</a>` : ""}</div></td>`;
    if (type === "notes") return `<td><textarea data-id="${id}" data-k="notes" rows="1" placeholder="Anything to remember" aria-label="Notes">${esc(v || "")}</textarea></td>`;
    return `<td${k === "company" ? ' class="col-co"' : ""}><input type="text" data-id="${id}" data-k="${k}" value="${esc(v || "")}" placeholder="${k === "company" ? "Company" : k === "title" ? "Role" : ""}" aria-label="${esc(k)}"${k === "company" ? ' data-noi18n' : ""}></td>`;
  }

  function render(){
    const list = rows();
    $("#main").innerHTML = `
      <section class="head"><h1>Tracker</h1>
        <p class="sub">Every application in one sheet. Click any cell to edit. Changes save on their own.</p>
        <div class="stats">${stats()}</div></section>
      ${S.local ? `<p class="note warn">You're not signed in, so this sheet is saved on this device only. <a href="/start/?next=/tracker/">Sign in</a> to keep it in your account. Your rows come with you.</p>` : ""}
      <div class="tools">
        <button class="btn pri" id="add" type="button">+ Add application</button>
        <input type="search" id="q" placeholder="Search company, role, place, notes" value="${esc(S.q)}" aria-label="Search">
        <select id="fs" aria-label="Status"><option value="all">All statuses</option>${STAGES.map(([s, l]) => `<option value="${s}"${S.stage === s ? " selected" : ""}>${l}</option>`).join("")}</select>
        <select id="fk" aria-label="Type"><option value="all">Internships + full-time</option><option value="intern"${S.kind === "intern" ? " selected" : ""}>Internships</option><option value="fulltime"${S.kind === "fulltime" ? " selected" : ""}>Full-time</option></select>
        <button class="btn" id="csv" type="button">Export CSV</button>
      </div>
      <p class="note">Same list as <a href="/season/">My Season</a>. Applying from Jobs adds a row here automatically.</p>
      <div class="sheet"><table>
        <thead><tr>${COLS.map(([k, l, t, w]) => `<th class="${t === "check" ? "c" : ""}${k === "company" ? " col-co" : ""}" style="min-width:${w}px" aria-sort="${S.sort.key === k ? (S.sort.dir > 0 ? "ascending" : "descending") : "none"}"><button data-sort="${k}">${esc(l)}${S.sort.key === k ? `<span class="ar">${S.sort.dir > 0 ? "▲" : "▼"}</span>` : ""}</button></th>`).join("")}<th><span class="sr-only">Saved</span></th><th></th></tr></thead>
        <tbody>${list.length ? list.map((a) => `<tr class="${a.stage === "rejected" ? "off" : ""}">${COLS.map((c) => cell(a, c)).join("")}<td class="saved" data-saved="${esc(a.id)}"></td><td><button class="del" data-del="${esc(a.id)}" aria-label="Delete row" title="Delete">×</button></td></tr>`).join("")
          : `<tr><td colspan="${COLS.length + 2}" class="empty">${S.apps.length ? "Nothing matches your filters." : "No applications yet. Click <b>+ Add application</b> to start your sheet, or tap Apply on any job in <a href='/jobs/'>Jobs</a>."}</td></tr>`}</tbody>
      </table></div>`;
    wire();
  }

  function wire(){
    $("#add").onclick = () => { const a = blank(); S.apps.unshift(a); render(); const el = document.querySelector(`input[data-id="${CSS.escape(a.id)}"][data-k="company"]`); el && el.focus(); };
    $("#q").oninput = (e) => { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); };
    $("#fs").onchange = (e) => { S.stage = e.target.value; render(); };
    $("#fk").onchange = (e) => { S.kind = e.target.value; render(); };
    $("#csv").onclick = exportCsv;
    document.querySelectorAll("[data-sort]").forEach((b) => b.onclick = () => { const k = b.dataset.sort; S.sort = S.sort.key === k ? { key: k, dir: -S.sort.dir } : { key: k, dir: ["appliedAt", "pay", "deadline"].includes(k) ? -1 : 1 }; render(); });
    document.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
      const a = S.apps.find((x) => x.id === b.dataset.del); if (!a) return;
      if (a.company && !confirm(`Delete ${a.company}${a.title ? " — " + a.title : ""} from your tracker?`)) return;
      S.apps = S.apps.filter((x) => x.id !== a.id); render();
      if (S.local) writeLocal(); else if (!a.fresh) biz.api({ action: "app_delete", id: a.id }).catch((e) => alert(e.message));
    });
    document.querySelectorAll("[data-k]").forEach((el) => {
      const a = () => S.apps.find((x) => x.id === el.dataset.id);
      const ev = el.type === "checkbox" || el.tagName === "SELECT" || el.type === "date" ? "change" : "input";
      el.addEventListener(ev, () => {
        const r = a(); if (!r) return; const k = el.dataset.k;
        if (el.type === "checkbox") {
          if (k === "followedUp") r.followedUpAt = el.checked ? new Date().toISOString() : null;
          else r.checks = { ...r.checks, [k]: el.checked };
          // ticking Interview / Offer moves the status forward (never backward)
          if (k === "interviewed" && el.checked && r.stage === "applied") r.stage = "interview";
          if (k === "offered" && el.checked && r.stage !== "offer") r.stage = "offer";
          if (k === "accepted" && el.checked) { r.checks.offered = true; r.stage = "offer"; }
          save(r); return render();
        }
        if (k === "stage") { r.stage = el.value; if (el.value === "interview") r.checks.interviewed = true; if (el.value === "offer") r.checks = { ...r.checks, interviewed: true, offered: true }; save(r); return render(); }
        if (k === "pay") r.pay = el.value === "" ? null : Math.max(0, +el.value);
        else if (k === "appliedAt" || k === "deadline") r[k] = toIso(el.value) || (k === "appliedAt" ? r.appliedAt : null);
        else r[k] = el.value;
        if (el.tagName === "SELECT" || el.type === "date") save(r); else later(r);
        if (k === "pay" || k === "payUnit") { const s = document.querySelector(".stats"); if (s) s.innerHTML = stats(); }
      });
      if (el.type === "text" || el.type === "url" || el.type === "number" || el.tagName === "TEXTAREA") el.addEventListener("blur", () => { const r = a(); if (r && timers.has(r.id)) { clearTimeout(timers.get(r.id)); timers.delete(r.id); save(r); } });
    });
  }

  function exportCsv(){
    const head = COLS.map((c) => c[1]).concat(["Pay per"]);
    const val = (a, k, t) => { const v = getV(a, k); return t === "check" ? (v ? "Yes" : "No") : t === "date" ? day(v) : k === "kind" ? (v === "fulltime" ? "Full-time" : "Internship") : k === "stage" ? (STAGES.find((s) => s[0] === v) || [, ""])[1] : v ?? ""; };
    const q = (s) => `"${String(s).replace(/"/g, '""')}"`;
    const lines = [head.map(q).join(","), ...rows().map((a) => COLS.map(([k, , t]) => q(val(a, k, t))).concat(q(a.pay ? (UNITS.find((u) => u[0] === (a.payUnit || "hour")) || [, ""])[1] : "")).join(","))];
    const url = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv" }));
    const l = document.createElement("a"); l.href = url; l.download = "beat-the-pile-tracker.csv"; l.click(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  biz.start(async (u) => {
    S.user = u || null;
    if (!u) { S.local = true; S.apps = readLocal().map(norm); return render(); }
    S.local = false;
    let me = {};
    try { const t = await biz.clerk().session.getToken(); const r = await fetch("/api/me", { headers: { Authorization: "Bearer " + t } }); me = await r.json(); if (!r.ok) throw new Error(me.error || "Couldn't load your tracker"); }
    catch (e) { $("#main").innerHTML = `<div class="card center"><h1>Couldn't load your tracker</h1><p class="sub">${esc(e.message)}. Try again in a minute.</p></div>`; return; }
    S.apps = (me.apps || []).map(norm);
    // rows you added while signed out move into your account once
    const local = readLocal().filter((a) => a.company);
    if (local.length) {
      for (const a of local) { try { const { fresh, ...app } = a; await biz.api({ action: "app", app }); S.apps.unshift(norm(a)); } catch {} }
      try { localStorage.removeItem(LOCAL_KEY); } catch {}
    }
    render();
  });
})();
</script>
<script src="/logos.js" defer></script>
<script src="/ph.js" defer></script>
<script src="/feedback.js" defer></script>
</body>
</html>
