<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#0E8A5F;--green-dark:#0B6E4B;--green-light:#EEF6F2;--green-mid:#CFE6DA;
  --amber:#FF8C00;--amber-light:#FFF4E6;--coral:#FF5733;--coral-light:#FFF0ED;
  --blue:#2563EB;--purple:#7C3AED;
  --bg:#FBFBFC;--bg2:#FBFBFC;--bg3:#F4F6F8;
  --text1:#0B1220;--text2:#4A5568;--text3:#6B7280;
  --border:#E3E7ED;--border2:#CBD5E0;
  --shadow:0 1px 2px rgba(11,18,32,0.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.1);
  --font:"Geist",-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:10px;--rl:14px;--rxl:20px;
}
html{font-family:var(--font);background:var(--bg);color:var(--text1);scroll-behavior:smooth}
body{min-height:100vh}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#CBD5E0;border-radius:99px}
@keyframes dscan{0%{transform:translateY(-120px)}100%{transform:translateY(640px)}}
@keyframes dblink{50%{opacity:.25}}
@keyframes dtick{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.d-blink{animation:dblink 1.6s infinite}.d-tick{animation:dtick 45s linear infinite}.d-tick:hover{animation-play-state:paused}
.d-grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.d-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.d-grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.d-grid3{grid-template-columns:1fr}}
@media (max-width:560px){.d-search{flex-direction:column}.d-search .d-sep{width:auto!important;height:1px;margin:0 10px!important}.d-grid4{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.d-blink,.d-tick{animation:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0.4;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(0.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(600px) rotate(720deg);opacity:0}}
@keyframes countUp{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}
@keyframes nudgeRight{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@keyframes hintPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.92;transform:scale(1.02)}}
.fade-up{animation:fadeUp 0.2s ease-out both}
.card-hover{transition:all 0.2s ease}
.card-hover:hover{border-color:#CBD5E0}
/* Mobile polish */
@media (max-width:560px){
  .nav-links{gap:0!important}
  .nav-hide-mobile{display:none!important}
  .nav-logo-text{font-size:16px!important}
  .nav-tab{padding:7px 9px!important;font-size:13px!important}
  .nav-pad{padding:0 0.9rem!important}
}
/* Phones: nav scrolls sideways instead of pushing the page wider than the screen */
html,body{max-width:100%;overflow-x:hidden}
.nav-links::-webkit-scrollbar{display:none}
.nav-links > *{flex:0 0 auto}
@media (max-width:820px){
  .nav-pad{gap:10px}
  .nav-links{flex:1;min-width:0;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links > *{flex:0 0 auto;white-space:nowrap}
  .nav-logo-text{display:none!important}
}
@media (max-width:380px){
  .nav-logo-text{display:none!important}
  .nav-tab{padding:7px 7px!important;font-size:12.5px!important}
}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea,select{font-size:16px!important} /* prevents iOS zoom-on-focus */
</style>
