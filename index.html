<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#00C285;--green-dark:#009E6C;--green-light:#E6FBF4;--green-mid:#B3F0DA;
  --amber:#FF8C00;--amber-light:#FFF4E6;--coral:#FF5733;--coral-light:#FFF0ED;
  --blue:#2563EB;--purple:#7C3AED;
  --bg:#F8FFFE;--bg2:#F8FFFE;--bg3:#F0FBF7;
  --text1:#0A1628;--text2:#4A5568;--text3:#9CA3AF;
  --border:#E2F5EE;--border2:#CBD5E0;
  --shadow:0 2px 12px rgba(0,194,133,0.1);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.1);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --r:10px;--rl:14px;--rxl:20px;
}
html{font-family:var(--font);background:var(--bg);color:var(--text1);scroll-behavior:smooth}
body{min-height:100vh}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--green-mid);border-radius:99px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0.4;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(0.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(600px) rotate(720deg);opacity:0}}
@keyframes countUp{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}
@keyframes nudgeRight{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@keyframes hintPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.92;transform:scale(1.02)}}
.fade-up{animation:fadeUp 0.2s ease-out both}
.card-hover{transition:all 0.2s ease}
.card-hover:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,194,133,0.15)}
/* Mobile polish */
@media (max-width:560px){
  .nav-links{gap:0!important}
  .nav-hide-mobile{display:none!important}
  .nav-logo-text{font-size:16px!important}
  .nav-tab{padding:7px 9px!important;font-size:13px!important}
  .nav-pad{padding:0 0.9rem!important}
}
/* Phones: nav scrolls sideways instead of pushing the page wider than the screen */
html,body{max-width:100%;overflow-x:hidden}
@media (max-width:820px){
  .nav-pad{gap:10px}
  .nav-links{flex:1;min-width:0;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links > *{flex:0 0 auto;white-space:nowrap}
  .nav-logo-text{display:none!important}
}
@media (max-width:380px){
  .nav-logo-text{display:none!important}
  .nav-tab{padding:7px 7px!important;font-size:12.5px!important}
}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea,select{font-size:16px!important} /* prevents iOS zoom-on-focus */
</style>
