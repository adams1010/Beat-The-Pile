# Hourly: 🛡 Watchdog — restarts any bot that went quiet or keeps failing, and opens a "bot-alert" issue if one stays broken.
name: watchdog
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions: { contents: read, actions: write, issues: write }
concurrency: { group: watchdog, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Check every bot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/watchdog.mjs
