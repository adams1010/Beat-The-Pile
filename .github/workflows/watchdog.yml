# Hourly: 🛡 Watchdog — restarts any bot that went quiet or keeps failing, and opens a "bot-alert" issue if one stays broken.
name: watchdog
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions: { contents: read, actions: write, issues: write }
concurrency: { group: watchdog, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check every bot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/watchdog.mjs
