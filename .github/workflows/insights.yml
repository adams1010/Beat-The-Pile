# Daily: the two analyst bots (Gap Finder + Unlock Finder, scripts/insights.mjs). They change nothing: they read the map dots
# in this repo (map-dots.yml refreshes them at 06:15 UTC), Census counties, the college list, the public company feed and
# the public SimplifyJobs list, then report their numbers privately to /bots. Each checks its own switch on /bots.
name: insights
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch: {}
permissions: { contents: read }
concurrency: { group: insights, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Gap Finder + Unlock Finder
        run: node scripts/insights.mjs
        env: { CRON_SECRET: "${{ secrets.CRON_SECRET }}" }
