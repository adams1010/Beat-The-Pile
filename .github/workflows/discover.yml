# Runs the company-discovery robot on Vercel. Nov 15: hourly, 2 passes (was every 15 min x 3 passes + 24 Vercel crons,
# which used up most of Vercel's free 4 h/month of CPU). This workflow is now the only thing that starts it.
# Needs one repo secret: CRON_SECRET (same value as in Vercel → Environment Variables).
name: discover
on:
  schedule:
    - cron: "11,41 * * * *"   # Nov 18: every 30 min (Vercel Pro)
  workflow_dispatch:
    inputs:
      import:
        description: "Also pull brand-new companies from the SimplifyJobs list now"
        type: boolean
        default: false
      query:
        description: "Extra query string (debug), e.g. stage=3"
        required: false
        default: ""
concurrency: { group: discover, cancel-in-progress: false }
permissions: { contents: read, actions: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # Nov 19: GitHub fired the 30-min schedule only ~4x a day, so each run now keeps calling the finder for ~40 min
      # (one pass ~= 60 companies) and then starts the next run itself. Stops only when switched off (Nov 23: an empty queue waits 10 min and asks again).
      - name: Call /api/discover (passes for ~40 min)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Add the CRON_SECRET repo secret first"; exit 1; fi
          manual="${{ inputs.query }}${{ inputs.import && 'x' || '' }}"
          end=$(( $(date +%s) + 2400 )); pass=0; fails=0
          while [ $(date +%s) -lt $end ]; do
            pass=$((pass+1))
            code=$(curl -s -o out.json -w '%{http_code}' --max-time 70 \
              -H "Authorization: Bearer $CRON_SECRET" "https://www.beatthepile.com/api/discover?x=1${{ inputs.import && '&import=1' || '' }}${{ inputs.query && format('&{0}', inputs.query) || '' }}")
            echo "pass $pass: HTTP $code $(head -c 300 out.json)"
            if [ "$code" != 200 ]; then fails=$((fails+1)); [ $fails -ge 3 ] && exit 1; sleep 20; continue; fi
            fails=0
            grep -q '"off":true' out.json && { echo off > stop; break; }
            # Nov 23: an empty queue no longer ends the chain (it sat idle for hours while rate-limited boards and new
            # wanted-list companies waited); wait 10 min and ask again (an empty pass is ~2 s on Vercel)
            if grep -q '"tried":0' out.json; then [ -n "$manual" ] && { echo manual > stop; break; }; sleep 600; continue; fi
            [ -n "$manual" ] && { echo manual > stop; break; }
          done
          exit 0
      - name: Start the next run
        if: success() && !inputs.query && !inputs.import
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [ -f stop ] && { echo "chain ends: $(cat stop)"; exit 0; }
          gh workflow run discover.yml --repo ${{ github.repository }} --ref main && echo "next run started"
