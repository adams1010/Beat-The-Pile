# Runs the company-discovery robot every 15 minutes (on top of Vercel's 2 daily runs).
# Needs one repo secret: CRON_SECRET (same value as in Vercel → Environment Variables).
name: discover
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
concurrency: { group: discover, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/discover
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Add the CRON_SECRET repo secret first"; exit 1; fi
          code=$(curl -s -o out.json -w '%{http_code}' --max-time 70 \
            -H "Authorization: Bearer $CRON_SECRET" https://intern-iq-psi.vercel.app/api/discover)
          cat out.json | head -c 2000; echo
          echo "HTTP $code"
          [ "$code" = 200 ]
