# Daily: 🖼 Logo Finder — find each live company's real website, PROVE it's theirs, save its logo (scripts/find-logos.mjs).
name: logos
on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      limit: { description: "Companies per run", default: "400" }
permissions: { contents: read }
concurrency: { group: logos, cancel-in-progress: false }
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Find logos
        env: { CRON_SECRET: "${{ secrets.CRON_SECRET }}", LIMIT: "${{ inputs.limit || '400' }}" }
        run: node scripts/find-logos.mjs --limit="$LIMIT"
