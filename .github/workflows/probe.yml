# Manual only: lets Claude test readers against real job sites (its own workspace can't reach them).
name: probe
on:
  workflow_dispatch:
    inputs:
      code: { description: "JS to run (async, has fetch)", required: true }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: node scripts/probe.mjs "$CODE"
        env: { CODE: "${{ inputs.code }}" }
