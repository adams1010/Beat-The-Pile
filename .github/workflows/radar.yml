# Daily: rebuild the Opening Radar (radar/radar.json) from the public SimplifyJobs list + InternIQ's company list.
# Past seasons are already baked into radar/history.json; this only folds in the current season.
name: radar
on:
  schedule:
    - cron: "40 10 * * *"
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: radar, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Download current internship list
        run: curl -sfL --retry 3 -o /tmp/current.json https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
      - name: Get InternIQ's company list
        run: |
          node -e '
            const fs = require("fs");
            (async () => {
              const out = [];
              try { const d = await (await fetch("https://intern-iq-psi.vercel.app/api/discovery")).json();
                    for (const r of (d.rows || d.companies || [])) if (r.id && r.company && r.status !== "duplicate") out.push({ id: r.id, company: r.company }); } catch (e) { console.log("discovery:", e.message); }
              try { const l = await (await fetch("https://intern-iq-psi.vercel.app/api/listings")).json();
                    for (const j of (l.listings || [])) if (j.company_id) out.push({ id: j.company_id, company: j.company }); } catch (e) { console.log("listings:", e.message); }
              fs.writeFileSync("/tmp/tracked.json", JSON.stringify(out)); console.log("tracked names:", out.length);
            })();'
      - name: Build radar
        run: node scripts/build-radar.mjs /tmp/current.json --tracked /tmp/tracked.json
      - name: Commit if changed
        run: |
          if git diff --quiet radar/radar.json; then echo "no change"; exit 0; fi
          git config user.name "interniq-radar"; git config user.email "radar@users.noreply.github.com"
          git add radar/radar.json && git commit -m "Radar: daily refresh" && git push
