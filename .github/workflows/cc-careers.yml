# Weekly: the Careers Finder looks up parked companies' careers pages in Common Crawl's public archive and hands any
# job-board link (or the real careers page address) to the Company Finder, which still proves every board itself.
name: cc-careers
on:
  schedule:
    - cron: "0 9 * * 0"     # Sundays ~4 AM ET (a new crawl comes out about monthly)
  workflow_dispatch:
    inputs:
      args: { description: "e.g. --dry --limit=300", required: false, default: "" }
concurrency: { group: cc-careers, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Careers Finder
        run: set -f; node scripts/cc-careers.mjs $ARGS
        env: { CRON_SECRET: "${{ secrets.CRON_SECRET }}", ARGS: "${{ inputs.args }}", NODE_OPTIONS: "--max-old-space-size=6144" }
