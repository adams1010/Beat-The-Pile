# Nightly browser pass: opens careers pages that need JavaScript and hands any job board it finds to the robot,
# which still has to prove the board belongs to that company. Uses the CRON_SECRET repo secret.
name: deep-discover
on:
  schedule:
    - cron: "30 8,20 * * *"   # Nov 18: twice a day (Vercel Pro)
  workflow_dispatch:
    inputs:
      args: { description: "e.g. --dry --limit=15", required: false, default: "--limit=60" }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: set -f; node scripts/deep-discover.mjs $ARGS
        env: { CRON_SECRET: "${{ secrets.CRON_SECRET }}", ARGS: "${{ inputs.args || '--limit=60' }}" }
