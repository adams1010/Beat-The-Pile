# On demand: read ONLY the federal jobs (USAJOBS) and save them — a quick check after changing the key or the reader.
# Turbo Sync also reads USAJOBS on every normal run; this one has its own queue so it never bumps that chain.
name: usajobs
on: { workflow_dispatch: {} }
concurrency: { group: usajobs, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Check what USAJOBS answers (codes and counts only)
        run: |
          node --input-type=module -e 'const { fetchUsajobs } = await import(process.cwd() + "/lib/fetchers/usajobs.js"); const { fetchCompany } = await import(process.cwd() + "/lib/fetchers/index.js"); const raw = await fetchUsajobs({}); console.log("raw jobs:", raw.length, "partial:", !!raw.partial); console.log("sample:", JSON.stringify(raw.slice(0, 5).map((j) => [j.title, j.location, j.agency]))); const got = await fetchCompany({ id: "usajobs", company: "US Federal Government", ats: "usajobs" }); console.log("kept:", got.listings.length, "by kind:", JSON.stringify(got.listings.reduce((m, l) => (m[l.kind] = (m[l.kind] || 0) + 1, m), {})));'
        env:
          USAJOBS_KEY: ${{ secrets.USAJOBS_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          USAJOBS_DEBUG: "1"
      - name: Count what's on USAJOBS
        run: node scripts/usajobs-count.mjs
        env:
          USAJOBS_KEY: ${{ secrets.USAJOBS_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
      - run: node scripts/turbo-sync.mjs --only=usajobs --minutes=10
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          USAJOBS_KEY: ${{ secrets.USAJOBS_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          BTP_TURBO: "1"
