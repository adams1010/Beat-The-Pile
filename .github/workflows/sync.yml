# Hourly (when GitHub actually fires it): 3 passes of sync + link check back to back.
# Uses the same CRON_SECRET repo secret as discover.yml.
name: sync
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
concurrency: { group: sync, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync listings + check links (3 passes)
        env: { CRON_SECRET: "${{ secrets.CRON_SECRET }}" }
        run: |
          fail=0
          for pass in 1 2 3; do
            code=$(curl -s -o out.json -w '%{http_code}' --max-time 70 -H "Authorization: Bearer $CRON_SECRET" https://intern-iq-psi.vercel.app/api/sync)
            head -c 400 out.json; echo; echo "sync pass $pass: HTTP $code"; [ "$code" = 200 ] || fail=1
            code=$(curl -s -o out.json -w '%{http_code}' --max-time 70 -H "Authorization: Bearer $CRON_SECRET" https://intern-iq-psi.vercel.app/api/check-links)
            head -c 300 out.json; echo; echo "links pass $pass: HTTP $code"; [ "$code" = 200 ] || fail=1
          done
          exit $fail
