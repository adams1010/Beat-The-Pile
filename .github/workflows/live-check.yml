# Live check (Nov 14 2026): every time Vercel finishes a production deploy (and every 6 hours), open the real site and
# check every page, every job tab, search and the APIs. A red run = something is broken for users right now
# (GitHub emails the repo owner). Script: scripts/live-check.mjs
name: live-check
on:
  deployment_status:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
concurrency: { group: live-check, cancel-in-progress: true }
jobs:
  check:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: sleep 30 && node scripts/live-check.mjs https://www.beatthepile.com
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: phone-shots, path: shots/, if-no-files-found: ignore, retention-days: 7 }
