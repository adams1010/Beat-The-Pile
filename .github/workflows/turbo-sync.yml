# ⚡ Turbo Sync (Nov 13 2026): reads every verified company's job board from GitHub's servers — 24 at once, no 60-second
# limit, deeper searches (BTP_TURBO) — and hands the results to Vercel to store (/api/discovery "turbo_save").
# Nov 14: GitHub skips a lot of scheduled runs, so each run starts the next one itself, about an hour after it began
# (the cron stays as a backup). Nov 15: every 3 h, not hourly: each run's saves run on Vercel and hourly runs were
# using up the free 4 h/month of Vercel CPU. Off on /bots → the run stops and the chain ends. Switch: "Turbo Sync" on /bots.
name: turbo-sync
on:
  schedule:
    - cron: "20 * * * *"   # Nov 18: hourly again (Vercel Pro)
  workflow_dispatch:
    inputs:
      args: { description: "e.g. --limit=40 --minutes=10", required: false, default: "" }
concurrency: { group: turbo-sync, cancel-in-progress: false }
permissions: { contents: read, actions: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Nov 17: fingerprints of what Vercel already has, so unchanged boards aren't re-sent (scripts/turbo-sync.mjs)
      - uses: actions/cache/restore@v4
        with: { path: .turbo-cache, key: "turbo-sent-${{ github.run_id }}", restore-keys: "turbo-sent-" }
      - run: node scripts/turbo-sync.mjs ${{ inputs.args }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          USAJOBS_KEY: ${{ secrets.USAJOBS_KEY }}        # Nov 16: federal jobs (lib/fetchers/usajobs.js)
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          BTP_TURBO: "1"
      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with: { path: .turbo-cache, key: "turbo-sent-${{ github.run_id }}" }
      - name: Start the next run (about 1 hour after this one began; Nov 19, Vercel Pro)
        if: always() && !inputs.args
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          on=$(curl -s https://www.beatthepile.com/api/discovery?bots=1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const b=JSON.parse(s).bots.find(x=>x.id==="turbo");console.log(b&&b.enabled===false?"off":"on")}catch{console.log("on")}})')
          [ "$on" = "off" ] && { echo "Turbo Sync is off: chain ends"; exit 0; }
          elapsed=$(( $(date +%s) - $(date -d "$(gh run view ${{ github.run_id }} --repo ${{ github.repository }} --json createdAt -q .createdAt)" +%s) ))
          wait=$(( 3600 - elapsed )); [ $wait -gt 0 ] && { echo "sleeping $wait s"; sleep $wait; }
          gh workflow run turbo-sync.yml --repo ${{ github.repository }} --ref main && echo "next run started"
