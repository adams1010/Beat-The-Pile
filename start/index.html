<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get started | Beat the Pile</title>
<meta name="description" content="Join Beat the Pile: find an internship or first job in any major, or hire interns and new grads.">
<link rel="canonical" href="https://www.beatthepile.com/start/">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#060A2C">
<style>
  /* /start/ (Nov 2026): step 1 = email (Clerk sign-in / sign-up), step 2 = "looking" or "hiring" (Clerk unsafeMetadata.role).
     ?role=employer|student preselects a card; ?next=/path sends them somewhere specific after. */
  :root{--navy:#060A2C;--lime:#B0F701;--green:#4A7000;--ink:#060A2C;--muted:#55627A;--line:#DCE2EC;--font:"Geist",-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--navy);color:#fff;font-family:var(--font);font-size:16px;line-height:1.5}
  .panel.f{max-width:760px;margin-left:auto;margin-right:auto}
  main{max-width:1180px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
  .steps{display:flex;gap:8px;justify-content:center;margin-bottom:22px;font-size:13px;color:#9FAAC0}
  .steps span{padding:4px 12px;border-radius:999px;border:1px solid #22304D}.steps span.on{background:var(--lime);color:var(--navy);border-color:var(--lime);font-weight:600}
  h1{font-size:clamp(28px,4.5vw,40px);line-height:1.1;letter-spacing:-.025em;text-align:center;margin:0 0 10px}
  h1 em{font-style:normal;color:var(--lime)}
  .lead{text-align:center;color:#C9D2E3;margin:0 auto 28px;max-width:52ch}
  .panel{background:#fff;color:var(--ink);border-radius:10px;padding:28px;box-shadow:none}
  #signin{display:flex;justify-content:center;min-height:120px;width:100%}
  /* Nov 9: Clerk's own card is ~400px wide with its own shadow; inside our panel on a phone it ran off the right edge.
     Let it fill the panel, centered, with no second card around it. */
  #signin .cl-rootBox,#signin .cl-cardBox,#signin .cl-card{width:100%!important;max-width:420px!important;margin:0 auto!important;box-shadow:none!important;border:0!important}
  #signin .cl-card{padding:0!important;background:transparent!important}
  #signin .cl-footer{background:transparent!important}
  @media (max-width:520px){.panel{padding:20px 16px}}
  .f label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:#060A2C}
  .f input,.f select{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid #DCE2EC;border-radius:10px;background:#fff;color:#060A2C;box-sizing:border-box}
  .f .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:520px){.f .two{grid-template-columns:1fr}}
  .f .chk{display:flex;gap:10px;align-items:flex-start;margin:18px 0 0;font-size:14px;color:#060A2C;font-weight:400}.f .chk input{width:auto;margin-top:3px}
  .f .go{margin-top:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .f .go button{font:inherit;font-weight:600;background:#4A7000;color:#fff;border:0;border-radius:999px;padding:12px 24px;cursor:pointer}
  .f .go a{color:#4A7000;font-size:14px}.f .msg{font-size:13px;color:#B42318}
  .center{text-align:center;color:var(--muted)}
  .switch{text-align:center;margin-top:18px;font-size:14px;color:#9FAAC0}.switch a{color:var(--lime)}
  .lead.legal a{color:#B0F701;text-decoration:underline}
  .tourpick{display:grid;gap:10px;max-width:420px;margin:18px auto 0}
  .tourgo,.tourskip{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;font-weight:700;font-size:17px;text-decoration:none}
  .tourgo{background:#4A7000;color:#fff}.tourskip{color:#4A7000;border:1px solid #C9D2E0;background:#fff}
</style>
</head>
<body>
<script src="/nav.js"></script>
<script src="/orbit-start.js" defer></script>
<script src="/pick.js"></script>
<main id="main">
  <div class="steps" aria-hidden="true"><span id="s1" class="on">1 · Your email</span><span id="s2">2 · About you</span><span id="s3">3 · Your school</span></div>
  <div id="view"><p class="center">Loading…</p></div>
</main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const qs = new URLSearchParams(location.search);
  const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pre = ["student", "employer"].includes(qs.get("role")) ? qs.get("role") : null;
  if (pre === "employer") { const s2 = document.getElementById("s2"); if (s2) s2.textContent = "2 · Your company"; }
  const roleNow = () => { const u = window.Clerk && window.Clerk.user; return (u && u.unsafeMetadata && u.unsafeMetadata.role) || ""; };
  const wantSchool = qs.get("school") === "1";   // sent here by the top bar / welcome sheet: no school on file yet
  const next = /^\/[a-z0-9/_#?=&-]*$/i.test(qs.get("next") || "") ? qs.get("next") : null;
  function stepEmail(C){
    $("#s1").className = "on"; $("#s2").className = "";
    $("#view").innerHTML = `<h1>Beat the pile. <em>Start here.</em></h1>
      <p class="lead">${pre === "employer" ? "Sign in or create your company account. Next you'll set up your company and confirm your work email." : "Enter your email to sign in or create a free account. Students and companies both start here."}</p>
      ${pre === "employer" ? "" : `<p class="lead" id="found" hidden></p>`}
      <div class="panel"><div id="signin"></div></div>
      <p class="lead legal" style="font-size:13.5px;margin-top:12px">By continuing, you agree to our <a href="/terms/">Terms of Use</a> and <a href="/privacy/">Privacy Policy</a>, and confirm you're 16 or older.</p>`;
    if (pre !== "employer") fetch("/api/me?founding=1").then((r) => r.ok ? r.json() : null).then((d) => { const el = $("#found");   // real count (lib/founding.js)
      if (el && d && d.left > 0) { el.innerHTML = `<b style="color:#B0F701">${+d.left} of ${+d.total} founding spots left.</b> The first ${+d.total} students keep every Pro feature free, for life.`; el.hidden = false; } }).catch(() => {});
    try { C.mountSignIn($("#signin"), { forceRedirectUrl: location.href, signUpForceRedirectUrl: location.href, withSignUp: true,
      appearance: { variables: { colorPrimary: "#4A7000", fontFamily: "Geist, system-ui, sans-serif", fontSize: "16px", borderRadius: "12px" }, elements: { rootBox: { width: "100%", maxWidth: "420px", margin: "0 auto" }, cardBox: { width: "100%", maxWidth: "420px", boxShadow: "none", border: "none" },
        card: { width: "100%", boxShadow: "none", border: "none", padding: "0", background: "transparent" }, footer: { background: "transparent" } } } }); }
    catch { $("#signin").innerHTML = `<button class="btn" id="si" style="font:inherit;font-weight:600;background:#4A7000;color:#fff;border:0;border-radius:999px;padding:12px 24px;cursor:pointer">Continue with email</button>`; $("#si").onclick = () => C.openSignIn({}); }
  }
  function stepRole(C){
    $("#s1").className = ""; $("#s2").className = "on";
    // Came from "Find interns" on /business/: no "looking or hiring?" question — straight to company setup.
    if (pre === "employer") { $("#view").innerHTML = `<div class="panel center">Setting up your company account…</div>`; window.btpSaveRole("employer", next || "/business/setup/"); return; }
    const has = C.user.unsafeMetadata && C.user.unsafeMetadata.role;
    $("#view").innerHTML = `<h1>What brings you to <em>Beat the Pile</em>?</h1>
      <p class="lead">${has ? "You can switch any time. This changes your top bar and home screen." : "Pick one to set up your home screen. You can switch later."}</p>
      <div class="panel">${window.btpRoleCards(pre || has || null)}</div>
      <p class="switch">Signed in as ${String(C.user.primaryEmailAddress?.emailAddress || "").replace(/[<>&"]/g, "")} · <a href="#" id="out">Use a different account</a></p>`;
    document.querySelectorAll(".btprole-card").forEach((b) => b.addEventListener("click", async (e) => { e.stopPropagation(); b.disabled = true;
      if (b.dataset.role === "student" || b.dataset.role === "educator") {   // students (and school staff): one more short step so classmates can find them in Orbit
        const role = b.dataset.role;
        try { await C.user.update({ unsafeMetadata: { ...(C.user.unsafeMetadata || {}), role } }); } catch {}
        try { localStorage.setItem("btp_role", role); } catch {}
        return stepSchool(C, role === "educator");
      }
      window.btpSaveRole(b.dataset.role, window.btpRoleDest ? window.btpRoleDest(b, next) : next); }, true));
    $("#out").onclick = async (e) => { e.preventDefault(); await C.signOut(); location.reload(); };
  }
  // Step 3 (students, Nov 9): school, major, graduation → classmates at the same school see each other in Orbit right away.
  async function stepSchoolOrRole(C){
    let mine = {}; try { const t = await C.session?.getToken?.(); const r = await fetch("/api/me", { headers: { Authorization: "Bearer " + t } }); if (r.ok) mine = (await r.json()).profile || {}; } catch {}
    if (mine.school) return wantSchool ? (location.href = next || "/jobs/") : stepRole(C);   // already in their school's orbit
    return stepSchool(C, roleNow() === "educator");
  }
  async function stepSchool(C, staff){
    const api = async (body) => { const t = await C.session?.getToken?.(); const r = await fetch("/api/me", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + t }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "Couldn't save. Try again."); return j; };
    let mine = {}; try { const t = await C.session?.getToken?.(); const r = await fetch("/api/me", { headers: { Authorization: "Bearer " + t } }); if (r.ok) mine = (await r.json()).profile || {}; } catch {}
    const go = () => { location.href = next || "/jobs/"; };
    if (mine.school && (staff ? mine.staff : mine.major)) return go();           // already set up
    // Nov 13: brand-new students get one choice before the site: the 2-minute tour, or straight to jobs
    const tour = () => {
      if (next || staff) return go();
      $("#view").innerHTML = `<h1>You're in. <em>Want the 2-minute tour?</em></h1>
        <p class="lead">See every part of Beat the Pile with real data: jobs near you, your major, Career Fair Mode, My Season, Orbit and interview practice.</p>
        <div class="panel center tourpick"><a class="tourgo" href="/demo/?from=signup">Take the 2-minute tour</a><a class="tourskip" href="/jobs/">Skip, show me jobs</a></div>`;
      window.scrollTo(0, 0);
    };
    const nm = mine.name || [C.user.firstName, C.user.lastName].filter(Boolean).join(" ");
    const P = window.btpPick, Y = new Date().getFullYear(), st = { school: mine.school || "", schoolId: mine.schoolId || null, major: mine.major || "" };
    $("#s1").className = ""; $("#s2").className = ""; const s3 = $("#s3"); if (s3) s3.className = "on";
    const ROLES = ["Professor", "Lecturer or instructor", "Academic advisor", "Career center", "Department staff", "Other school staff"];
    $("#view").innerHTML = `${staff ? `<h1>Where do you <em>work</em>?</h1>
      <p class="lead">We use this to put you in your school's orbit, with a Faculty &amp; staff tag on your profile.</p>` : `<h1>Where do you go to <em>school</em>?</h1>
      <p class="lead">We use this to show you classmates in Orbit and internships for your major.</p>`}
      <div class="panel f">
        <label for="o_nm">Your name</label><input id="o_nm" value="${esc(nm)}" autocomplete="name" placeholder="Jordan Lee">
        <label for="o_sc">School</label><input id="o_sc" value="${esc(st.school)}" placeholder="Start typing, e.g. Virginia Tech">
        ${staff ? `<label for="o_rl">Your role</label><select id="o_rl"><option value="">Pick one</option>${ROLES.map((r) => `<option${mine.staff === r ? " selected" : ""}>${r}</option>`).join("")}</select>` : ""}
        <div id="o_mjw"><label for="o_mj">${staff ? "Department (optional)" : "Major"}</label><input id="o_mj" value="${esc(st.major)}" placeholder="Pick your school first"></div>
        <div class="two"${staff ? ' style="display:none"' : ""}><div><label for="o_gt">Graduation</label><select id="o_gt"><option value="">Term</option>${["Spring", "Summer", "Fall", "Winter"].map((t) => `<option${mine.gradTerm === t ? " selected" : ""}>${t}</option>`).join("")}</select></div>
          <div><label for="o_gy">Year</label><select id="o_gy"><option value="">Year</option>${Array.from({ length: 8 }, (_, i) => Y + i - 1).map((y) => `<option${+mine.gradYear === y ? " selected" : ""}>${y}</option>`).join("")}</select></div></div>
        <label class="chk"><input type="checkbox" id="o_show" checked> <span>${staff ? "Show me to students at my school in Orbit (your name, school, role and photo). You can turn this off any time on your profile." : "Show me to students at my school in Orbit (your name, school, major and photo). You can turn this off any time on your profile."}</span></label>
        <div class="go"><button id="o_go">Continue</button><a href="#" id="o_skip">Skip for now</a><span class="msg" id="o_msg" role="status"></span></div>
      </div>`;
    const majorBox = async () => {
      const progs = st.schoolId ? (await P.majors(st.schoolId)).map((x) => x.label) : [];
      if (progs.length) {
        $("#o_mjw").innerHTML = `<label for="o_mjs">${staff ? "Department (optional)" : "Major"}</label><select id="o_mjs"><option value="">${staff ? "Pick your department" : "Pick your major"}</option>${progs.map((m) => `<option${m === st.major ? " selected" : ""}>${esc(m)}</option>`).join("")}<option value="__o">Not listed, type it</option></select><input id="o_mj" hidden placeholder="Your major" style="margin-top:6px">`;
        $("#o_mjs").onchange = (e) => { const v = e.target.value; $("#o_mj").hidden = v !== "__o"; st.major = v === "__o" ? "" : v; if (v === "__o") $("#o_mj").focus(); };
        $("#o_mj").oninput = (e) => { st.major = e.target.value; };
      } else {
        $("#o_mjw").innerHTML = `<label for="o_mj">${staff ? "Department (optional)" : "Major"}</label><input id="o_mj" value="${esc(st.major)}" placeholder="Start typing, e.g. Finance">`;
        P.attach($("#o_mj"), { load: () => P.majors(null), other: true, onPick: (it) => { st.major = it ? it.label : ""; } });
        $("#o_mj").oninput = (e) => { st.major = e.target.value; };
      }
    };
    P.attach($("#o_sc"), { load: P.schools, other: true, hint: "Type the first letters of your school, e.g. Virginia Tech", onPick: (it) => { st.school = it ? it.label : ""; st.schoolId = it && it.id ? it.id : null; majorBox(); } });
    majorBox();
    if (nm) $("#o_sc").focus();
    $("#o_skip").onclick = (e) => { e.preventDefault(); try { sessionStorage.setItem("btp_school_skip", "1"); } catch {} tour(); };
    $("#o_go").onclick = async () => {
      const b = $("#o_go"); $("#o_msg").textContent = "";
      if (staff && !$("#o_rl").value) { $("#o_msg").textContent = "Pick your role."; return; }
      b.disabled = true;
      try { await api({ action: "onboard", name: $("#o_nm").value, school: st.school || $("#o_sc").value, schoolId: st.schoolId, major: st.major || ($("#o_mj") && $("#o_mj").value) || "",
          gradTerm: $("#o_gt").value, gradYear: $("#o_gy").value ? +$("#o_gy").value : null, show: $("#o_show").checked, ...(staff ? { staff: $("#o_rl").value } : {}) });
        // Nov 10: right after sign-up, the "build your orbit" checklist (join classmates' orbits) — then on to the site
        if (window.btpOrbitStart) return window.btpOrbitStart.show({ getToken: () => C.session.getToken(), done: tour, force: true });
        tour(); }
      catch (e) { b.disabled = false; $("#o_msg").textContent = e.message; }
    };
  }
  async function loadClerk(){
    try {
      const pk = (await fetch("/api/config").then((r) => r.json())).clerkPublishableKey; if (!pk) throw 0;
      if (!window.Clerk) {
        const host = atob(pk.replace(/^pk_(test|live)_/, "")).replace(/\$$/, "").trim(); if (!/clerk/.test(host)) throw 0;
        await new Promise((ok, bad) => { const s = document.createElement("script"); s.src = `https://${host}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`;
          s.setAttribute("data-clerk-publishable-key", pk); s.async = true; s.crossOrigin = "anonymous"; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
      }
      if (typeof window.Clerk.load === "function" && !window.Clerk.loaded) await window.Clerk.load({});
      const C = window.Clerk;
      // Nov 10: a student or school staff who already picked a role but has no school yet goes straight to the school step
      const show = () => (!C.user ? stepEmail(C) : ["student", "educator"].includes(roleNow()) && pre !== "employer" ? stepSchoolOrRole(C) : stepRole(C));
      let last = C.user?.id || null; C.addListener?.(({ user }) => { const id = user?.id || null; if (id !== last) { last = id; show(); } });
      show();
    } catch { $("#view").innerHTML = '<div class="panel center">Sign-in is temporarily unavailable. Try again in a minute.</div>'; }
  }
  window.__startPreview = (who) => who ? stepRole({ user: { unsafeMetadata: {}, primaryEmailAddress: { emailAddress: "you@school.edu" } }, signOut(){} }) : stepEmail({ mountSignIn(el){ el.innerHTML = '<div style="width:380px;max-width:100%;border:1px dashed #DCE2EC;border-radius:10px;padding:30px;text-align:center;color:#55627A">Clerk email box</div>'; } });
  loadClerk();
})();
</script>
<script src="/ph.js" defer></script>
<script src="/feedback.js" defer></script>
</body>
</html>
