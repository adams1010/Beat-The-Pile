<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit — Beat the Pile</title>
<meta name="description" content="Orbit: classmates in your major, students who interned where you're applying, and what's new at the companies you follow.">
<link rel="canonical" href="https://www.beatthepile.com/orbit/">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#060A2C">
<style>
  /* Orbit (Nov 2026): POST /api/me {action:"orbit"} → lib/orbit.js (public profiles only).
     Part 2 (Nov 8): Connect (two-way), messages, "going to the same fair" → orbit_* actions in lib/orbitnet.js. */
  :root{--green:#4A7000;--green-l:#F2FADF;--ink:#060A2C;--muted:#55627A;--line:#DCE2EC;--bg:#EEF1F6;--font:"Geist",-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
  main{max-width:1180px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
  .grid{display:grid;grid-template-columns:260px minmax(0,1fr) 320px;gap:20px;align-items:start}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
  .side{position:sticky;top:80px}
  h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em} h2{font-size:16px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
  .me .av{width:64px;height:64px;font-size:20px;margin-bottom:10px}
  .me .nm{font-weight:650;font-size:16px}.me .ln{color:var(--muted);font-size:13px}
  .stat{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-top:1px solid #EEF1F6;color:var(--muted)} .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
  .nudge{background:#FFF8E6;border:1px solid #F1DFAE;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
  .nudge a{color:#7A5200;font-weight:600}
  section.card{margin-bottom:16px}
  .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  .p{border:1px solid var(--line);border-radius:12px;padding:16px 12px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;min-width:0}
  .av{width:56px;height:56px;border-radius:50%;background:#4A7000;color:#fff;display:grid;place-items:center;font-weight:600;overflow:hidden;flex-shrink:0}
  .av img{width:100%;height:100%;object-fit:cover}
  .p .nm{font-weight:600;margin-top:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p .hl{color:var(--muted);font-size:12.5px;margin-top:2px;min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .p .at{font-size:12.5px;margin-top:6px;color:var(--green);font-weight:600}
  .btn{display:inline-block;margin-top:10px;font:inherit;font-size:13px;font-weight:600;border-radius:999px;padding:6px 16px;text-decoration:none;cursor:pointer;border:1px solid var(--green);color:var(--green);background:#fff}
  .btn:hover{background:var(--green-l)} .btn.pri{background:var(--green);color:#fff} .btn.pri:hover{background:#3A5A00}
  .empty{color:var(--muted);font-size:13.5px;padding:6px 0}
  .empty a{color:var(--green);font-weight:600}
  .feed .it{padding:12px 0;border-top:1px solid #EEF1F6;font-size:13.5px} .feed .it:first-of-type{border-top:0}
  .feed .k{font-size:12px;color:var(--muted)} .feed a{color:var(--ink);font-weight:600;text-decoration:none} .feed a:hover{text-decoration:underline}
  .feed .tx{white-space:pre-wrap;overflow-wrap:anywhere}
  .center{text-align:center;padding:40px 24px}
  .orb-ic{width:44px;height:44px;border-radius:12px;background:var(--green-l);color:var(--green);display:grid;place-items:center;margin:0 auto 12px}
  .soon{font-size:12px;color:var(--muted);margin-top:10px}
  /* Nov 8: Orbit is drawn as an orbit — you in the middle, three rings of people around you */
  .sky{background:#060A2C;border-radius:16px;color:#fff;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:center;margin-bottom:16px}
  .sky h1{color:#fff;font-size:24px;margin:0 0 4px}.sky .sub{color:#C9D2E3;margin:0 0 12px}
  .sky svg{width:100%;height:auto;display:block;max-height:420px}
  .sky .node{cursor:pointer}.sky .node:focus{outline:none}.sky .node:focus circle,.sky .node:hover circle{stroke:#B0F701;stroke-width:3}
  .legend{display:grid;gap:10px}
  .legend button{font:inherit;text-align:left;display:flex;align-items:center;gap:10px;background:#0E1440;border:1px solid #1E2A5C;color:#fff;border-radius:12px;padding:12px;cursor:pointer}
  .legend button[aria-pressed=true]{border-color:#B0F701;background:#141B4D}
  .legend i{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:2px solid}
  .legend b{font-variant-numeric:tabular-nums;font-size:18px;margin-left:auto}.legend small{display:block;color:#8D9AB3;font-size:12px}
  .gravity{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:#C9D2E3}
  .gravity a{color:#B0F701}
  .feed h2::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#4A7000;margin-right:8px;vertical-align:middle}
  .grid2{grid-template-columns:minmax(0,1fr) 340px}
  .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}.acts .btn{margin-top:0}
  .lnk{font-size:12.5px;color:var(--muted);margin-top:8px;text-decoration:none}.lnk:hover{text-decoration:underline;color:var(--ink)}
  .btn[disabled]{opacity:.6;cursor:default;background:#fff}
  .tag{font-size:11.5px;color:var(--green);background:var(--green-l);border-radius:999px;padding:1px 8px;margin-top:6px;font-weight:600}
  .reqs{border-left:3px solid var(--green)} .reqs .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #EEF1F6}.reqs .row:first-of-type{border-top:0}
  .reqs .av{width:40px;height:40px;font-size:14px}.reqs .who{flex:1;min-width:0}.reqs .who b{display:block}.reqs .who span{color:var(--muted);font-size:12.5px}
  .reqs .row .btn{margin-top:0}
  .thr{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #EEF1F6;cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;text-align:left;color:inherit}
  .thr:first-of-type{border-top:0}.thr:hover .who b{text-decoration:underline}
  .thr .av{width:38px;height:38px;font-size:13px}.thr .who{flex:1;min-width:0}.thr .who b{display:block;font-size:13.5px}
  .thr .who span{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex-shrink:0}
  .count{display:inline-block;min-width:20px;text-align:center;background:var(--green);color:#fff;border-radius:999px;font-size:12px;padding:0 6px;margin-left:6px;font-variant-numeric:tabular-nums;vertical-align:2px}
  .fairbox select{width:100%;font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:4px 0 8px}
  .fairbox label.sw{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:8px}
  .mini{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.mini a{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px}
  .mini .av{width:24px;height:24px;font-size:10px}
  dialog.chat{border:0;border-radius:14px;padding:0;width:min(560px,94vw);max-height:86vh;box-shadow:0 20px 60px rgba(6,10,44,.3)}
  dialog.chat::backdrop{background:rgba(6,10,44,.45)}
  .chat .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}.chat .hd .av{width:38px;height:38px;font-size:13px}
  .chat .hd .who{flex:1;min-width:0}.chat .hd .who b{display:block}.chat .hd .who span{color:var(--muted);font-size:12.5px}
  .chat .x{font:inherit;font-size:20px;background:none;border:0;cursor:pointer;color:var(--muted);padding:4px 8px}
  .chat .msgs{padding:14px 16px;overflow:auto;height:min(52vh,440px);background:#F7F9FC;display:flex;flex-direction:column;gap:8px}
  .chat .m{max-width:78%;padding:8px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
  .chat .m.mine{align-self:flex-end;background:var(--green);color:#fff;border-color:var(--green)}
  .chat .m small{display:block;font-size:11px;opacity:.7;margin-top:2px}
  .chat form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
  .chat textarea{flex:1;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;resize:none;height:44px}
  .chat .why{padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  .chat .note{font-size:11.5px;color:var(--muted);padding:0 16px 10px}
  @media (max-width:1060px){.grid.grid2{grid-template-columns:1fr}}
  @media (max-width:860px){.sky{grid-template-columns:1fr}}
  @media (max-width:1060px){.grid{grid-template-columns:240px minmax(0,1fr)}.feedcol{grid-column:1/-1}}
  @media (max-width:720px){.grid{grid-template-columns:1fr}.side{position:static}.people{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<script src="/nav.js"></script>
<div id="acct"></div>
<main id="main"><div class="card center">Loading Orbit…</div></main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const S = { clerk: null };
  const GLOBE = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.3 2.4 3.5 5.2 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.2-3.5-8.5S9.7 5.9 12 3.5z"/></svg>';
  const initials = (n) => String(n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?";
  const av = (p) => `<div class="av">${p.photo ? `<img alt="" src="${esc(p.photo)}">` : esc(initials(p.name))}</div>`;
  const yr = (y) => y ? ` '${String(y).slice(2)}` : "";
  const ago = (iso) => { const d = Math.floor((Date.now() - Date.parse(iso)) / 864e5); return d <= 0 ? "today" : d === 1 ? "yesterday" : `${d} days ago`; };

  async function token(){ try { return await S.clerk?.session?.getToken(); } catch { return null; } }
  async function api(body){
    const r = await fetch("/api/me", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + (await token()) }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "Couldn't load Orbit"); return j;
  }

  const to = (p) => p.key || p.handle;
  function linkBtns(p){
    const t = esc(to(p));
    if (p.link === "connected") return `<button class="btn pri" data-msg="${t}">Message</button>`;
    if (p.link === "incoming") return `<button class="btn pri" data-accept="${t}">Accept</button><button class="btn" data-remove="${t}">Ignore</button>`;
    if (p.link === "requested") return `<button class="btn" data-remove="${t}" data-confirm="1" title="Tap to cancel the request">Requested</button>`;
    return `<button class="btn pri" data-connect="${t}">Connect</button>`;
  }
  const person = (p) => `<div class="p">${av(p)}<div class="nm" title="${esc(p.name)}">${esc(p.name)}</div>
    <div class="hl">${esc(p.headline || [p.major, p.school].filter(Boolean).join(" · ") + yr(p.gradYear))}</div>
    ${p.at ? `<div class="at">${esc(p.role ? p.role + " at " : "Worked at ")}${esc(p.at)}</div>` : ""}
    ${p.link === "connected" ? `<div class="tag">Connected</div>` : ""}
    <div class="acts">${linkBtns(p)}</div>
    ${p.handle ? `<a class="lnk" href="/u/${encodeURIComponent(p.handle)}">View profile</a>` : ""}</div>`;
  const people = (list, none) => list.length ? `<div class="people">${list.map(person).join("")}</div>` : `<p class="empty">${none}</p>`;

  const RINGS = [
    ["inner", "Inner orbit", "Your major, your school", "#B0F701"],
    ["campus", "Campus", "Other majors at your school", "#7FB2FF"],
    ["insiders", "Insiders", "Interned where you're aiming", "#FFB86B"],
    ["conn", "Connections", "People you're connected with", "#FFFFFF"],
  ];
  function sky(o){
    const sets = { inner: o.classmates, campus: o.schoolmates, insiders: o.atTargets };
    const R = { inner: 92, campus: 150, insiders: 205 }, C = 230;
    let nodes = "", rings = "";
    RINGS.slice(0, 3).forEach(([k, , , col], ri) => {
      rings += `<circle cx="${C}" cy="${C}" r="${R[k]}" fill="none" stroke="${col}" stroke-opacity=".35" stroke-dasharray="${ri === 2 ? "3 6" : "none"}"/>`;
      const list = sets[k].slice(0, ri === 0 ? 8 : 12), n = list.length;
      list.forEach((p, i) => {
        const a = (i / Math.max(n, 1)) * Math.PI * 2 - Math.PI / 2 + ri * 0.45;
        const x = C + R[k] * Math.cos(a), y = C + R[k] * Math.sin(a);
        nodes += `<a class="node" href="/u/${encodeURIComponent(p.handle)}" tabindex="0" aria-label="${esc(p.name)}"><title>${esc(p.name)}${p.at ? " · " + esc(p.at) : ""}</title>
          <circle cx="${x}" cy="${y}" r="19" fill="${p.link === "connected" ? "#26345F" : "#0E1440"}" stroke="${col}" stroke-width="${p.link === "connected" ? 4 : 2}"/>
          <text x="${x}" y="${y + 4.5}" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">${esc(initials(p.name))}</text></a>`;
      });
    });
    const me = o.me;
    return `<svg viewBox="0 0 460 460" role="img" aria-label="Your orbit: ${o.classmates.length} in your major, ${o.schoolmates.length} on campus, ${o.atTargets.length} insiders">
      ${rings}<circle cx="${C}" cy="${C}" r="34" fill="#B0F701"/><text x="${C}" y="${C + 6}" text-anchor="middle" font-size="16" font-weight="700" fill="#060A2C">${esc(initials(me.name) || "You")}</text>
      <text x="${C}" y="${C + 52}" text-anchor="middle" font-size="11" fill="#8D9AB3">You</text>${nodes}</svg>`;
  }
  function render(o){
    S.o = o; const m = o.me, ring = S.ring || "inner";
    const sets = { inner: o.classmates, campus: o.schoolmates, insiders: o.atTargets, conn: o.connections || [] };
    const gravity = !m.hasSchool || !m.hasMajor ? `<span>Add your school and major to <a href="/u/">your profile</a> to fill your orbit.</span>`
      : !m.isPublic ? `<span>You're invisible to others. <a href="/u/">Make your profile public</a> to show up in their orbits.</span>`
      : `<span>You're visible in other students' orbits.</span>`;
    const empty = { inner: m.hasSchool ? "No one in your major has a public profile yet. Invite a classmate." : `<a href="/u/">Add your school and major</a> first.`,
      campus: m.hasSchool ? "No one else at your school has a public profile yet." : `<a href="/u/">Add your school</a> first.`,
      insiders: m.following ? "No public profiles list the companies you follow yet." : `Follow companies with ☆ on <a href="/jobs/">Jobs</a> to find insiders.`,
      conn: "No connections yet. Tap Connect on anyone in your orbit." };
    const [, title, desc] = RINGS.find((r) => r[0] === ring);
    const feed = o.feed.length ? o.feed.map((f) => f.kind === "job"
      ? `<div class="it"><div class="k">New opening · ${esc(ago(f.at))}</div><a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">${esc(f.title)}</a><div>${esc(f.company)}${f.location ? " · " + esc(f.location) : ""}</div></div>`
      : `<div class="it"><div class="k">${esc(f.name)} posted${f.category ? " in " + esc(f.category) : ""} · ${esc(ago(f.at))}</div><div class="tx">${esc(f.text)}</div></div>`).join("")
      : `<p class="empty">Quiet for now. Follow companies with ☆ on <a href="/jobs/">Jobs</a> and their new openings land here.</p>`;
    $("main").innerHTML = `
      <div class="sky"><div><h1>Your orbit</h1><p class="sub">The people around your search, closest first. Tap anyone to see their profile.</p>${sky(o)}</div>
        <div><div class="legend">${RINGS.map(([k, t, d, col]) => `<button type="button" data-ring="${k}" aria-pressed="${k === ring}"><i style="border-color:${col}"></i><span>${t}<small>${d}</small></span><b>${sets[k].length}</b></button>`).join("")}</div>
          <div class="gravity">${gravity}</div>
          </div></div>
      <div class="grid grid2">
        <div>${requests(o)}
        <section class="card"><h2>${title}</h2><p class="sub">${desc}${ring === "inner" && m.hasSchool ? ` · ${esc(m.major || "")} at ${esc(m.school)}` : ""}</p>${people(sets[ring], empty[ring])}</section></div>
        <aside class="feedcol">
          <section class="card" id="messages"><h2>Messages${o.unread ? `<span class="count">${o.unread}</span>` : ""}</h2><p class="sub">Students you're connected with, plus employers if you turned on “Let employers find me”.</p><div id="threads"><p class="empty">Loading…</p></div></section>
          ${fairBox(o)}
          <section class="card feed"><h2>Signals</h2><p class="sub">New openings at companies you follow, and posts from students.</p>${feed}</section></aside>
      </div>`;
    document.querySelectorAll("[data-ring]").forEach((b) => b.onclick = () => { S.ring = b.dataset.ring; render(S.o); });
    wire($("main")); loadThreads(); loadFairs();
  }

  // ── Part 2: requests, connect buttons, messages, same fair ──
  function requests(o){
    const r = o.requests || [];
    if (!r.length) return "";
    return `<section class="card reqs"><h2>Connection requests<span class="count">${r.length}</span></h2><p class="sub">Accept to message each other.</p>
      ${r.map((p) => `<div class="row">${av(p)}<div class="who"><b>${esc(p.name)}</b><span>${esc(p.headline || [p.major, p.school].filter(Boolean).join(" · "))}</span></div>
        <button class="btn pri" data-accept="${esc(to(p))}">Accept</button><button class="btn" data-remove="${esc(to(p))}">Ignore</button></div>`).join("")}</section>`;
  }
  function wire(root){
    const act = async (b, action, t) => {
      b.disabled = true;
      try { await api({ action, to: t }); render(await api({ action: "orbit" })); }
      catch (e) { b.disabled = false; alertBox(e.message); }
    };
    root.querySelectorAll("[data-connect]").forEach((b) => b.onclick = () => act(b, "orbit_connect", b.dataset.connect));
    root.querySelectorAll("[data-accept]").forEach((b) => b.onclick = () => act(b, "orbit_accept", b.dataset.accept));
    root.querySelectorAll("[data-remove]").forEach((b) => b.onclick = () => {
      if (b.dataset.confirm && !confirm("Cancel your connection request?")) return;
      act(b, "orbit_remove", b.dataset.remove); });
    root.querySelectorAll("[data-msg]").forEach((b) => b.onclick = () => openChat(b.dataset.msg));
  }
  function alertBox(msg){ const d = document.createElement("div"); d.className = "nudge"; d.style.cssText = "position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;max-width:90vw";
    d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 4500); }

  async function loadThreads(){
    const el = $("#threads"); if (!el) return;
    try {
      const d = await api({ action: "orbit_inbox" });
      el.innerHTML = d.threads.length ? d.threads.map((t) => `<button type="button" class="thr" data-msg="${esc(t.key)}">${av(t)}
        <span class="who"><b>${esc(t.name)}</b><span>${t.last.mine ? "You: " : ""}${esc(t.last.body)}</span></span>${t.unread ? '<i class="dot" aria-label="Unread"></i>' : ""}</button>`).join("")
        : `<p class="empty">No messages yet. Connect with someone, then say hi.</p>`;
      wire(el);
    } catch { el.innerHTML = `<p class="empty">Couldn't load messages. Refresh in a minute.</p>`; }
  }

  let chatTo = null, chatTimer = null;
  const when = (iso) => new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  async function openChat(t){
    chatTo = t;
    let d = $("#chat");
    if (!d) { d = document.createElement("dialog"); d.id = "chat"; d.className = "chat"; document.body.appendChild(d);
      d.addEventListener("close", () => { clearInterval(chatTimer); chatTo = null; loadThreads(); }); }
    d.innerHTML = `<div class="msgs"><p class="empty">Loading…</p></div>`;
    if (!d.open) d.showModal();
    await drawChat(true);
    clearInterval(chatTimer); chatTimer = setInterval(() => drawChat(false), 15000);
  }
  async function drawChat(first){
    const d = $("#chat"); if (!d || !chatTo) return;
    let c;
    try { c = await api({ action: "orbit_thread", to: chatTo }); }
    catch (e) { d.innerHTML = `<div class="hd"><div class="who"><b>Messages</b></div><button class="x" aria-label="Close">×</button></div><div class="why">${esc(e.message)}</div>`;
      d.querySelector(".x").onclick = () => d.close(); return; }
    const draft = d.querySelector("textarea")?.value || "";
    const p = c.peer;
    d.innerHTML = `<div class="hd">${av(p)}<div class="who"><b>${esc(p.name)}</b><span>${esc(p.headline || [p.major, p.school].filter(Boolean).join(" · "))}</span></div>
        ${p.handle ? `<a class="btn" href="/u/${encodeURIComponent(p.handle)}" style="margin-top:0">Profile</a>` : ""}<button class="x" aria-label="Close">×</button></div>
      <div class="msgs">${c.messages.length ? c.messages.map((m) => `<div class="m${m.mine ? " mine" : ""}">${esc(m.body)}<small>${esc(when(m.at))}</small></div>`).join("")
        : `<p class="empty">No messages yet. Say hi.</p>`}</div>
      ${c.canSend ? `<form><textarea maxlength="2000" placeholder="Write a message" aria-label="Message"></textarea><button class="btn pri" style="margin-top:0">Send</button></form>
        <div class="note">Be kind and professional. Never share passwords or payment details here.</div>` : `<div class="why">${esc(c.why || "You can't message this person.")}</div>`}`;
    d.querySelector(".x").onclick = () => d.close();
    const box = d.querySelector(".msgs"); box.scrollTop = box.scrollHeight;
    const f = d.querySelector("form");
    if (f) {
      const ta = f.querySelector("textarea"); ta.value = draft; if (first) ta.focus();
      ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } };
      f.onsubmit = async (e) => {
        e.preventDefault(); const body = ta.value.trim(); if (!body) return;
        const btn = f.querySelector("button"); btn.disabled = true;
        try { await api({ action: "orbit_send", to: chatTo, body }); ta.value = ""; await drawChat(false); }
        catch (err) { btn.disabled = false; alertBox(err.message); }
      };
    }
  }

  function fairBox(o){
    const f = o.fair || { id: null, on: false, people: [] };
    return `<section class="card fairbox"><h2>Going to a career fair?</h2>
      <p class="sub">Pick your fair and see which students are going too. Only students who turn this on for the same fair see each other.</p>
      <select id="fairSel" aria-label="Career fair"><option value="">Choose a fair</option></select>
      <label class="sw"><input type="checkbox" id="fairOn" ${f.on ? "checked" : ""}> <span>Show me to other students going</span></label>
      <button class="btn pri" id="fairSave" style="margin-top:0">Save</button>
      ${f.on ? (f.people.length ? `<div class="sub" style="margin:12px 0 0">${f.people.length} going</div><div class="mini">${f.people.map((p) =>
        `<a href="/u/${encodeURIComponent(p.handle)}">${av(p)}${esc(p.name)}</a>`).join("")}</div>`
        : `<p class="empty" style="margin-top:10px">No one else has turned this on for that fair yet.</p>`) : ""}</section>`;
  }
  async function loadFairs(){
    const sel = $("#fairSel"); if (!sel) return;
    const cur = S.o?.fair?.id || "";
    try {
      S.fairs = S.fairs || (await fetch("/fair/fairs.json").then((r) => r.json())).fairs || [];
      const today = new Date().toISOString().slice(0, 10);
      const list = S.fairs.filter((x) => !x.date || x.date >= today || x.id === cur).sort((a, b) => String(a.date).localeCompare(String(b.date)));
      sel.insertAdjacentHTML("beforeend", list.map((x) => `<option value="${esc(x.id)}" ${x.id === cur ? "selected" : ""} data-noi18n>${esc(x.name)}${x.term ? " — " + esc(x.term) : ""}</option>`).join(""));
    } catch {}
    $("#fairSave").onclick = async () => {
      const b = $("#fairSave"); b.disabled = true;
      try { await api({ action: "orbit_fair", fair: sel.value, on: $("#fairOn").checked }); render(await api({ action: "orbit" })); }
      catch (e) { b.disabled = false; alertBox(e.message); }
    };
  }

  async function onUser(u){
    if (!u) {
      $("main").innerHTML = `<div class="card center"><div class="orb-ic">${GLOBE}</div><h1>Orbit</h1>
        <p class="sub" style="max-width:52ch;margin:6px auto 16px">The people around your internship search: classmates in your major, students who interned where you're applying, and what's new at the companies you follow.</p>
        <button class="btn pri" id="si">Sign in to see your Orbit</button></div>`;
      $("#si").onclick = () => S.clerk.openSignIn({}); return;
    }
    try { render(await api({ action: "orbit" })); }
    catch (e) { $("main").innerHTML = `<div class="card center">Couldn't load Orbit right now (${esc(e.message)}). Refresh in a minute.</div>`; }
  }
  async function loadClerk(){
    try {
      const pk = (await fetch("/api/config").then((r) => r.json())).clerkPublishableKey; if (!pk) throw 0;
      if (!window.Clerk) {
        const host = atob(pk.replace(/^pk_(test|live)_/, "")).replace(/\$$/, "").trim(); if (!/clerk/.test(host)) throw 0;
        await new Promise((ok, bad) => { const s = document.createElement("script"); s.src = `https://${host}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`;
          s.setAttribute("data-clerk-publishable-key", pk); s.async = true; s.crossOrigin = "anonymous"; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
      }
      if (typeof window.Clerk.load === "function" && !window.Clerk.loaded) await window.Clerk.load({});
      S.clerk = window.Clerk;
      let last = S.clerk.user?.id || null;
      S.clerk.addListener?.(({ user }) => { const id = user?.id || null; if (id !== last) { last = id; onUser(user); } });
      await onUser(S.clerk.user);
    } catch { $("main").innerHTML = '<div class="card center">Sign-in is temporarily unavailable. Try again in a minute.</div>'; }
  }
  window.__orbitRender = render;   // used by the offline preview test
  if (location.hash === "#messages") addEventListener("load", () => setTimeout(() => $("#messages")?.scrollIntoView(), 1200));
  loadClerk();
})();
</script>
<script src="/ph.js" defer></script>
<script src="/feedback.js" defer></script>
</body>
</html>
