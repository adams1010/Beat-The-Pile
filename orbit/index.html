<style>
  /* Orbit (Nov 2026): POST /api/me {action:"orbit"} → lib/orbit.js (public profiles only).
     Part 2 (Nov 8): Connect (two-way), messages, "going to the same fair" → orbit_* actions in lib/orbitnet.js. */
  :root{--green:#4A7000;--green-l:#F2FADF;--ink:#060A2C;--muted:#55627A;--line:#DCE2EC;--bg:#EEF1F6;--font:"Geist",-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
  main{max-width:1440px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
  .grid{display:grid;grid-template-columns:260px minmax(0,1fr) 320px;gap:20px;align-items:start}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}

  .sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
  .me .av{width:64px;height:64px;font-size:20px;margin-bottom:10px}

  .nudge a{color:#7A5200;font-weight:600}
  section.card{margin-bottom:16px}
  .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  @media (min-width:1200px){.people{grid-template-columns:repeat(5,minmax(0,1fr))}}

  .ppager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.ppager .pinfo{font-size:13px;color:var(--muted)}

  .feed .k{font-size:12px;color:var(--muted)} .feed a{color:var(--ink);font-weight:600;text-decoration:none} .feed a:hover{text-decoration:underline}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;background:#F2FADF;color:#2F4A00;border-radius:999px;padding:3px 10px;font-weight:600}

  .sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sugg button{font:inherit;font-size:12.5px;border:1px solid #D5DCE6;background:#fff;border-radius:999px;padding:4px 10px;cursor:pointer}

  .reqs .row .btn{margin-top:0}
  .thr{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #EEF1F6;cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;text-align:left;color:inherit}
  .thr:first-of-type{border-top:0}.thr:hover .who b{text-decoration:underline}
  .thr .av{width:38px;height:38px;font-size:13px}.thr .who{flex:1;min-width:0}.thr .who b{display:block;font-size:13.5px}

  .fairbox label.sw{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:8px}
  .mini{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.mini a{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px}
  .mini .av{width:24px;height:24px;font-size:10px}
  dialog.chat{border:0;border-radius:10px;padding:0;width:min(560px,94vw);max-height:86vh;box-shadow:none}
  dialog.chat::backdrop{background:rgba(6,10,44,.45)}
  .chat .hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}.chat .hd .av{width:38px;height:38px;font-size:13px}
  .chat .hd .who{flex:1;min-width:0}.chat .hd .who b{display:block}.chat .hd .who span{color:var(--muted);font-size:12.5px}
  .chat .hd .who b,.chat .hd .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat .hd .who span{display:block}
  .chat .x{font:inherit;font-size:20px;background:none;border:0;cursor:pointer;color:var(--muted);padding:4px 8px}
  .chat .msgs{padding:14px 16px;overflow:auto;height:min(52vh,440px);background:#F7F9FC;display:flex;flex-direction:column;gap:8px}
  .chat .m{max-width:78%;padding:8px 12px;border-radius:10px;background:#fff;border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}

  .chat form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
  .chat textarea{flex:1;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;resize:none;height:44px}
  .chat .why{padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
  .chat .note{font-size:11.5px;color:var(--muted);padding:0 16px 10px}
  .chat .safety{display:flex;gap:14px;align-items:center;padding:0 16px 12px;font-size:12.5px}
  .chat .safety button{font:inherit;background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;cursor:pointer}
  .chat .rep{padding:0 16px 14px}.chat .rep textarea{width:100%;min-height:70px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px;box-sizing:border-box}
  .chat .rep .row{display:flex;gap:8px;margin-top:8px}
  @media (max-width:1060px){.grid.grid2{grid-template-columns:minmax(0,1fr)}}
  @media (max-width:860px){.sky{grid-template-columns:1fr}}
  @media (max-width:1060px){.grid{grid-template-columns:240px minmax(0,1fr)}.feedcol{grid-column:1/-1}}
  @media (max-width:720px){.grid{grid-template-columns:minmax(0,1fr)}.grid>*{min-width:0}.side{position:static}.people{grid-template-columns:repeat(2,minmax(0,1fr))}}
  /* Nov 16 (owner): phones get a compact list, one row per person, so the page stays short as Orbit grows */
  .pmore{display:block;width:100%;margin-top:12px;font:inherit;font-size:13.5px;font-weight:600;color:var(--green);background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px;cursor:pointer}
  #invSlotM{display:none}
  @media (max-width:720px){
    #invSlotM{display:block}#invSlot{display:none}
    .sky{padding:14px;gap:10px}.sky>*,.sky>*>*{min-width:0}.sky h1{font-size:20px}.sky svg{max-height:230px}.legend small{display:none}
    .legend{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}.legend::-webkit-scrollbar{display:none}
    .legend button{flex:none;padding:7px 12px;border-radius:999px;gap:7px;font-size:13px}.legend b{font-size:13px;margin-left:2px}.legend i{width:9px;height:9px}
    .p .tag{justify-self:start}

    .p:first-child{border-top:0}
    .p>*{grid-column:2;margin-top:0!important;min-width:0}
    .p>.avw{grid-column:1;grid-row:1/span 3;align-self:start}.p .av{width:44px;height:44px;font-size:14px}

    .p .tag,.p .at{font-size:12px}}
  #ringList,#bizRingList{scroll-margin-top:72px}#ringList.updating h2::after,#bizRingList.updating h2::after{content:" · updating";font-size:13px;font-weight:500;color:var(--muted,#55627A)}

<body>
<script src="/invite.js"></script>
<script src="/nav.js"></script>
<div id="acct"></div>
<main id="main"><div class="card center">Loading Orbit…</div></main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const S = { clerk: null, findQ: (new URLSearchParams(location.search).get("q") || "").slice(0, 80) };
  const GLOBE = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.3 2.4 3.5 5.2 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.2-3.5-8.5S9.7 5.9 12 3.5z"/></svg>';
  const initials = (n) => String(n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?";
  const av = (p) => `<div class="avw"><div class="av">${p.photo ? `<img alt="" src="${esc(p.photo)}">` : esc(initials(p.name))}</div>${p.hiring ? '<span class="hiring">Hiring</span>' : ""}</div>`;
  const yr = (y) => y ? ` '${String(y).slice(2)}` : "";
  const ago = (iso) => { const d = Math.floor((Date.now() - Date.parse(iso)) / 864e5); return d <= 0 ? "today" : d === 1 ? "yesterday" : `${d} days ago`; };

  async function token(){ try { return await S.clerk?.session?.getToken(); } catch { return null; } }
  async function api(body){
    const r = await fetch("/api/me", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + (await token()) }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "Couldn't load Orbit"); return j;
  }

  const to = (p) => p.key || p.handle;
  const first = (n) => String(n || "Someone").split(/\s+/)[0];
  function linkBtns(p){
    if (p.employer && p.link === "none") return "";
    const t = esc(to(p));
    if (p.link === "connected") return `<button class="btn msg" data-msg="${t}">Message</button>`;
    if (p.link === "incoming") return `<button class="btn pri" data-accept="${t}">Accept</button><button class="btn" data-remove="${t}">Ignore</button>`;
    if (p.link === "requested") return `<button class="btn" data-remove="${t}" data-confirm="1" title="Tap to cancel the request">Orbit requested</button>`;
    return `<button class="btn pri" data-connect="${t}">Join orbit</button>`;
  }
  const person = (p) => `<div class="p">${av(p)}<div class="nm" title="${esc(p.name)}">${esc(p.name)}</div>
    <div class="hl">${esc(p.headline || [p.major, p.school].filter(Boolean).join(" · ") + yr(p.gradYear))}</div>
    ${(p.badges || []).length ? `<div class="bdgs">${p.badges.map((b) => `<span class="bdg ${/beat the pile/i.test(b.org || "") && /founder/i.test(b.label || "") ? "gold" : b.kind === "staff" ? "staff" : "rec"}">${esc(b.label)} · <span data-noi18n>${esc(b.org)}</span></span>`).join("")}</div>` : p.staff ? `<div class="at">Faculty &amp; staff · ${esc(p.staff)}</div>` : ""}
    ${p.coffee ? `<div class="tag">Open to coffee chats</div>` : ""}
    ${(p.askMe || []).length ? `<div class="ask">Ask me about ${esc(p.askMe.slice(0, 2).join(", "))}</div>` : ""}
    ${p.at ? `<div class="at">${esc(atLine(p))}</div>${p.role ? `<div class="role">${esc(p.role)}${p.when ? " · " + esc(p.when) : ""}</div>` : ""}` : ""}
    ${p.link === "connected" ? `<div class="tag">In orbit</div>` : p.link === "incoming" ? `<div class="tag">${esc(first(p.name))} wants to join your orbit</div>` : ""}
    <div class="acts">${linkBtns(p)}</div>
    ${p.handle ? `<a class="lnk" href="/u/${encodeURIComponent(p.handle)}">View profile</a>` : ""}</div>`;
  // "Interned at Northrop Grumman" / "Works at Northrop Grumman" (insiders: people at companies you want)
  const atLine = (p) => (p.type === "internship" ? (p.now ? "Interning at " : "Interned at ") : (p.now ? "Works at " : "Worked at ")) + p.at;
  // Nov 19 (owner): pages, not "Show more": 15 per page on desktop (3 rows of 5), 8 on phones, with page buttons.
  const MORE = {}; let moreN = 0;
  const batch = () => (matchMedia("(max-width:720px)").matches ? 8 : 15);

  const pager = (k) => { const m = MORE[k], n = batch(), pages = Math.ceil(m.list.length / n); if (pages < 2) return "";

          <section class="card feed"><h2>Signals</h2><p class="sub">New openings at companies you follow, and posts from students.</p>${feed}</section></aside>
      </div>`;
    if (window.btpInvite) window.btpInvite.mount(document.getElementById(matchMedia("(max-width:720px)").matches ? "invSlotM" : "invSlot"), token);   // Nov 16: invite classmates (top of the page on phones)
    document.querySelectorAll("[data-ring]").forEach((b) => b.onclick = () => pickRing(b.dataset.ring, render));
    const gp = $("#goPublic"); if (gp) gp.onclick = async () => {   // Nov 9: one tap — gives you a link name and a public profile (name, school, major, photo)
      gp.disabled = true;
      try { await api({ action: "onboard", show: true }); await refresh(); }
      catch { location.href = "/u/#visibility"; } };
    wire($("main")); wireFind(); wireWant(); loadThreads(); loadFairs();
    try { window.btpOrbitBadge && window.btpOrbitBadge((o.unread || 0) + (o.requests || []).length); } catch {}
  }

  // ── Insiders: companies you want. Followed ★ and your Tracker count on their own; ones typed here stay on this device. ──
  const TKEY = "btp_orbit_targets";
  const typed = () => { try { const v = JSON.parse(localStorage.getItem(TKEY) || "[]"); return Array.isArray(v) ? v.filter((x) => typeof x === "string").slice(0, 10) : []; } catch { return []; } };
  const setTyped = (v) => { try { localStorage.setItem(TKEY, JSON.stringify(v.slice(0, 10))); } catch {} };
  function wantBox(o){
    const mine = typed(), low = new Set(mine.map((x) => x.toLowerCase()));
    const auto = (o.targets || []).filter((t) => !low.has(t.toLowerCase()));
    return `<div class="want"><div class="wl">Companies you want</div><div class="chips">
      ${mine.map((t) => `<span class="chip">${esc(t)}<button type="button" data-unwant="${esc(t)}" aria-label="Remove ${esc(t)}">×</button></span>`).join("")}
      ${auto.slice(0, 12).map((t) => `<span class="chip auto" title="From companies you follow or your Tracker">${esc(t)}</span>`).join("")}</div>
      <form id="wantF" class="findf" autocomplete="off"><input id="wantQ" type="text" maxlength="80" placeholder="Add a company, e.g. Northrop Grumman" aria-label="Add a company you want to work at"><button class="btn pri" type="submit">Add</button></form>
      <div id="wantS" class="sugg"></div>
      <p class="hint">Companies you follow on Jobs and the ones in your Tracker are added for you.</p></div>`;
  }
  let NAMES = null;
  async function names(){ if (!NAMES) NAMES = fetch("/companies/names.json").then((r) => r.json()).then((a) => a.map((x) => x[0])).catch(() => []); return NAMES; }
  function wireWant(){
    const f = $("#wantF"); if (!f) return;
    const add = (name) => { const t = String(name || "").trim().slice(0, 80); if (t.length < 2) return;
      const v = typed().filter((x) => x.toLowerCase() !== t.toLowerCase()); v.unshift(t); setTyped(v); pickRing("insiders", render); };
    f.onsubmit = (e) => { e.preventDefault(); add($("#wantQ").value); };
    document.querySelectorAll("[data-unwant]").forEach((b) => b.onclick = () => { setTyped(typed().filter((x) => x !== b.dataset.unwant)); pickRing("insiders", render); });
    $("#wantQ").onfocus = () => names();
    $("#wantQ").oninput = async () => {
      const q = $("#wantQ").value.trim().toLowerCase(), box = $("#wantS"); if (q.length < 2) { box.innerHTML = ""; return; }
      const all = await names(); if ($("#wantQ").value.trim().toLowerCase() !== q) return;
      const hit = all.filter((n) => n.toLowerCase().startsWith(q)).slice(0, 6);
      const more = hit.length < 6 ? all.filter((n) => !n.toLowerCase().startsWith(q) && n.toLowerCase().includes(" " + q)).slice(0, 6 - hit.length) : [];
      box.innerHTML = [...hit, ...more].map((n) => `<button type="button" data-sugg="${esc(n)}">${esc(n)}</button>`).join("");
      box.querySelectorAll("[data-sugg]").forEach((b) => b.onclick = () => add(b.dataset.sugg));
    };
  }

  // Nov 15: Insiders only works if students list where they've been. Students with no experience on their profile get one nudge (dismissable).
  const NKEY = "btp_exp_nudge";
  function expNudge(m){
    if (m.hasExperience || !m.isPublic) return "";
    try { if (Date.now() - Number(localStorage.getItem(NKEY) || 0) < 14 * 864e5) return ""; } catch {}
    return `<section class="card nudge" id="expNudge"><div><b>Add your internships and jobs</b><p>Younger students looking at those companies will find you under Insiders, and can ask you how you got in.</p></div>
      <div class="nb"><a class="btn pri" href="/u/#experience">Add experience</a><button type="button" class="btn" id="expLater">Not now</button></div></section>`;
  }
  document.addEventListener("click", (e) => { if (e.target && e.target.id === "expLater") { try { localStorage.setItem(NKEY, String(Date.now())); } catch {} document.getElementById("expNudge")?.remove(); } });

  async function refresh(){ if (S.biz) renderBiz(await api({ action: "biz_orbit" })); else render(await api({ action: "orbit", targets: typed() })); }
  // Nov 13: tapping a ring shows it at once, then reloads fresh people for it (new classmates, new requests). Coming back to the tab reloads too (at most every 20 s).
  let lastLoad = Date.now(), loading = false;
  async function pickRing(ring, draw){
    // Nov 25 (owner): phones stay on the sky like desktop (no jump down to the list); the page keeps its place through both redraws
    // and the phone's sideways tab row keeps its scroll too (a redraw used to snap it back to the first tab)
    const lx = document.querySelector(".legend")?.scrollLeft || 0;
    const y = scrollY, keep = () => { if (Math.abs(scrollY - y) > 2) scrollTo(0, y); const l = document.querySelector(".legend"); if (l) l.scrollLeft = lx; };
    S.ring = ring; draw(S.o); keep();
    const sec = document.getElementById("ringList");
    if (sec) sec.classList.add("updating");
    if (loading) return; loading = true;
    try { await refresh(); keep(); lastLoad = Date.now(); } catch {} finally { loading = false; }
    const sec2 = document.getElementById("ringList"); if (sec2) sec2.classList.remove("updating");
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.o && !loading && Date.now() - lastLoad > 20000) { lastLoad = Date.now(); refresh().catch(() => {}); } });

  // ── Business Orbit (employer accounts): your team · interested students · former interns · at your fairs · in orbit ──
  const BRINGS = [
    ["interested", "Interested students", "Follow your company and are open to employers", "#B0F701"],
    ["alumni", "Former interns", "Interned with you and are open to employers", "#7FB2FF"],
    ["team", "Your team", "Recruiters from your company", "#FFB86B"],
    ["fairs", "At your fairs", "Going to a fair you're attending", "#C9A7FF"],
    ["conn", "In orbit", "Students who joined your orbit", "#FFFFFF"],
  ];
  function renderBiz(o){
    S.o = o; const ring = BRINGS.some((r) => r[0] === S.ring) ? S.ring : ((o.connections || []).length ? "conn" : "interested"), m = o.me;
    const sets = { interested: o.interested || [], alumni: o.alumni || [], team: o.team || [], fairs: o.atFairs || [], conn: o.connections || [] };
    const empty = { interested: "No students who follow your company have opened their profile to employers yet.",
      alumni: "No former interns of yours have opened their profile to employers yet.",
      team: "No one else from your company is on Beat the Pile yet. Colleagues join by signing up with their work email.",
      fairs: `No students yet. <a href="/business/fairs/">Pick the fairs you'll attend</a> to see who's going.`,
      conn: `No one yet. <a href="/business/talent/">Find talent</a> and tap Join orbit.` };
    const [, title, desc] = BRINGS.find((r) => r[0] === ring);
    const pend = m.status !== "verified" ? `<span>Your company is still being verified. You can view your orbit, and you can contact students once it's approved.</span>` : `<span>Only students who chose to be found by employers appear here.</span>`;
    $("main").innerHTML = `
      <div class="sky" data-btp-keep><div><h1>${m.kind === "recruiter" ? `${esc(m.name || "Your")}'s orbit` : `${esc(m.company || "Your company")}'s orbit`}</h1><p class="sub">${m.kind === "recruiter" ? `You, at ${esc(m.company || "your company")}. Students close to your company, closest first.` : "Students already close to your company, closest first."}</p>
        ${sky(o, sets, BRINGS.slice(0, 3), m.kind === "recruiter" ? { text: initials(m.name) || "You", label: "You", photo: m.photo } : { text: initials(m.company) || "Co", label: m.company || "Your company", photo: m.logo })}</div>
        <div><div class="legend">${[BRINGS[4], ...BRINGS.slice(0, 4)].map(([k, t, d, col]) => `<button type="button" data-ring="${k}" aria-pressed="${k === ring}"><i style="border-color:${col}"></i><span>${t}<small>${d}</small></span><b>${sets[k].length}</b></button>`).join("")}</div>
          <div class="gravity">${pend}</div></div></div>
      <div class="grid grid2">
        <div>${findBox()}${requests(o)}
        <section class="card" id="ringList"><h2>${title}</h2><p class="sub">${desc}</p>${people(sets[ring], empty[ring])}</section></div>
        <aside class="feedcol">
          <section class="card" id="messages"><h2>Messages${o.unread ? `<span class="count">${o.unread}</span>` : ""}</h2><p class="sub">Students you've written to, and students in your orbit.</p><div id="threads"><p class="empty">Loading…</p></div></section>
          <section class="card"><h2>Grow your orbit</h2><p class="sub">Students land in your orbit when they follow your company, list you as an internship, or go to the same fair.</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn pri" href="/business/talent/">Find talent</a><a class="btn" href="/business/fairs/">Career fairs</a><a class="btn" href="/business/company/">Company page</a></div></section></aside>
      </div>`;
    document.querySelectorAll("[data-ring]").forEach((b) => b.onclick = () => pickRing(b.dataset.ring, renderBiz));
    wireFind(); wire($("main")); loadThreads();
    try { window.btpOrbitBadge && window.btpOrbitBadge((o.unread || 0) + (o.requests || []).length); } catch {}
  }

  // ── Part 2: requests, connect buttons, messages, same fair ──
  function requests(o){
    const r = o.requests || [];
    if (!r.length) return "";
    return `<section class="card reqs"><h2>Orbit requests<span class="count">${r.length}</span></h2><p class="sub">Accept to message each other.</p>
      ${r.map((p) => `<div class="row">${av(p)}<div class="who"><b>${esc(p.name)} wants to join your orbit</b><span>${esc(p.headline || [p.major, p.school].filter(Boolean).join(" · "))}</span></div>
        <button class="btn pri" data-accept="${esc(to(p))}">Accept</button><button class="btn" data-remove="${esc(to(p))}">Ignore</button></div>`).join("")}</section>`;
  }
  function wire(root){
    const act = async (b, action, t) => {
      b.disabled = true;
      try { await api({ action, to: t }); await refresh(); }
      catch (e) { b.disabled = false; alertBox(e.message); }
    };
    root.querySelectorAll("[data-connect]").forEach((b) => b.onclick = () => act(b, "orbit_connect", b.dataset.connect));
    root.querySelectorAll("[data-accept]").forEach((b) => b.onclick = () => act(b, "orbit_accept", b.dataset.accept));
    root.querySelectorAll("[data-remove]").forEach((b) => b.onclick = () => {
      if (b.dataset.confirm && !confirm("Cancel your orbit request?")) return;
      act(b, "orbit_remove", b.dataset.remove); });
    root.querySelectorAll("[data-msg]").forEach((b) => b.onclick = () => openChat(b.dataset.msg));
  }
  function alertBox(msg){ const d = document.createElement("div"); d.className = "nudge"; d.style.cssText = "position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;max-width:90vw";
    d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 4500); }

  async function loadThreads(){
    const el = $("#threads"); if (!el) return;
    try {
      const d = await api({ action: "orbit_inbox" });
      el.innerHTML = d.threads.length ? d.threads.map((t) => `<button type="button" class="thr" data-msg="${esc(t.key)}">${av(t)}
        <span class="who"><b>${esc(t.name)}</b><span>${t.last.mine ? "You: " : ""}${esc(t.last.body)}</span></span>${t.unread ? '<i class="dot" aria-label="Unread"></i>' : ""}</button>`).join("")
        : `<p class="empty">No messages yet. Bring someone into your orbit, then say hi.</p>`;
      wire(el);
    } catch { el.innerHTML = `<p class="empty">Couldn't load messages. Refresh in a minute.</p>`; }
  }

  let chatTo = null, chatTimer = null;
  const when = (iso) => new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  async function openChat(t){
    chatTo = t;
    let d = $("#chat");
    if (!d) { d = document.createElement("dialog"); d.id = "chat"; d.className = "chat"; document.body.appendChild(d);
      d.addEventListener("close", async () => { clearInterval(chatTimer); chatTo = null; loadThreads();
        try { window.btpOrbitBadge && window.btpOrbitBadge((await api({ action: "orbit_count" })).n); } catch {} }); }
    d.innerHTML = `<div class="msgs"><p class="empty">Loading…</p></div>`;
    if (!d.open) d.showModal();
    await drawChat(true);
    clearInterval(chatTimer); chatTimer = setInterval(() => drawChat(false), 15000);
  }
  async function drawChat(first){
    const d = $("#chat"); if (!d || !chatTo) return;
    if (!first && d.querySelector("#chatRep:not([hidden])")) return;   // don't wipe a report someone is writing
    let c;
    try { c = await api({ action: "orbit_thread", to: chatTo }); }
    catch (e) { d.innerHTML = `<div class="hd"><div class="who"><b>Messages</b></div><button class="x" aria-label="Close">×</button></div><div class="why">${esc(e.message)}</div>`;
      d.querySelector(".x").onclick = () => d.close(); return; }
    const draft = d.querySelector("textarea")?.value || "";
    const p = c.peer;
    d.innerHTML = `<div class="hd">${av(p)}<div class="who"><b>${esc(p.name)}</b><span>${esc(p.headline || [p.major, p.school].filter(Boolean).join(" · "))}</span></div>
        ${p.link === "none" ? `<button class="btn pri" id="chatJoin" style="margin-top:0">Join orbit</button>` : p.link === "requested" ? `<span class="tag" style="margin:0">Orbit requested</span>` : p.link === "incoming" ? `<button class="btn pri" id="chatAccept" style="margin-top:0">Accept</button>` : `<span class="tag" style="margin:0">In orbit</span>`}
        ${p.handle ? `<a class="btn" href="/u/${encodeURIComponent(p.handle)}" style="margin-top:0">Profile</a>` : p.companySlug ? `<a class="btn" href="/co/${encodeURIComponent(p.companySlug)}" style="margin-top:0">Company</a>` : ""}<button class="x" aria-label="Close">×</button></div>
      <div class="msgs">${c.messages.length ? c.messages.map((m) => `<div class="m${m.mine ? " mine" : ""}">${esc(m.body)}<small>${esc(when(m.at))}</small></div>`).join("")
        : `<p class="empty">No messages yet. Say hi.</p>`}</div>
      ${c.canSend ? `<form><textarea maxlength="2000" placeholder="Write a message" aria-label="Message"></textarea><button class="btn pri" style="margin-top:0">Send</button></form>
        <div class="note">Be kind and professional. Never share passwords or payment details here.</div>` : `<div class="why">${esc(c.why || "You can't message this person.")}</div>`}
      <div class="safety">${c.blocked ? `<button type="button" id="chatUnblock">Unblock</button>` : `<button type="button" id="chatBlock">Block</button><button type="button" id="chatReport">Report</button>`}</div>
      <div class="rep" id="chatRep" hidden><textarea maxlength="500" placeholder="What happened? We read every report." aria-label="What happened"></textarea>
        <div class="row"><button type="button" class="btn pri" id="chatRepSend" style="margin-top:0">Send report and block</button><button type="button" class="btn" id="chatRepNo" style="margin-top:0">Cancel</button></div></div>`;
    d.querySelector(".x").onclick = () => d.close();
    for (const [id, action] of [["#chatJoin", "orbit_connect"], ["#chatAccept", "orbit_accept"]]) { const b = d.querySelector(id);
      if (b) b.onclick = async () => { b.disabled = true; try { await api({ action, to: chatTo }); await drawChat(false); refresh().catch(() => {}); } catch (e) { b.disabled = false; alertBox(e.message); } }; }
    // Nov 17: Block / Report (app-store rule for messaging). Blocking hides you from each other everywhere in Orbit.
    const safety = async (action, extra = {}) => { try { await api({ action, to: chatTo, ...extra }); if (action === "orbit_unblock") { await drawChat(false); }
        else { alertBox(action === "orbit_report" ? "Thanks. We got your report and blocked this person." : "Blocked. You won't see each other in Orbit."); d.close(); }
        refresh().catch(() => {}); } catch (e) { alertBox(e.message); } };
    const q = (id) => d.querySelector(id);
    if (q("#chatUnblock")) q("#chatUnblock").onclick = () => safety("orbit_unblock");
    if (q("#chatBlock")) q("#chatBlock").onclick = () => { const b = q("#chatBlock"); if (b.dataset.sure) return safety("orbit_block"); b.dataset.sure = "1"; b.textContent = "Tap again to block"; };
    if (q("#chatReport")) q("#chatReport").onclick = () => { q("#chatRep").hidden = false; q("#chatRep textarea").focus(); };
    if (q("#chatRepNo")) q("#chatRepNo").onclick = () => { q("#chatRep").hidden = true; };
    if (q("#chatRepSend")) q("#chatRepSend").onclick = () => { const reason = q("#chatRep textarea").value.trim(); if (reason.length < 3) return alertBox("Say briefly what happened"); q("#chatRepSend").disabled = true; safety("orbit_report", { reason }); };
    const box = d.querySelector(".msgs"); box.scrollTop = box.scrollHeight;
    const f = d.querySelector("form");
    if (f) {
      const ta = f.querySelector("textarea"); ta.value = draft; if (first) ta.focus();
      ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } };
      f.onsubmit = async (e) => {
        e.preventDefault(); const body = ta.value.trim(); if (!body) return;
        const btn = f.querySelector("button"); btn.disabled = true;
        try { await api({ action: "orbit_send", to: chatTo, body }); ta.value = ""; await drawChat(false); }
        catch (err) { btn.disabled = false; alertBox(err.message); }
      };
    }
  }

  function fairBox(o){
    const f = o.fair || { id: null, on: false, people: [] };
    return `<section class="card fairbox"><h2>Going to a career fair?</h2>
      <p class="sub">Pick your fair and see which students are going too. Only students who turn this on for the same fair see each other.</p>
      <select id="fairSel" aria-label="Career fair"><option value="">Choose a fair</option></select>
      <label class="sw"><input type="checkbox" id="fairOn" ${f.on ? "checked" : ""}> <span>Show me to other students going</span></label>
      <button class="btn pri" id="fairSave" style="margin-top:0">Save</button>
      ${f.on ? (f.people.length ? `<div class="sub" style="margin:12px 0 0">${f.people.length} going</div><div class="mini">${f.people.map((p) =>
        `<a href="/u/${encodeURIComponent(p.handle)}">${av(p)}${esc(p.name)}</a>`).join("")}</div>`
        : `<p class="empty" style="margin-top:10px">No one else has turned this on for that fair yet.</p>`) : ""}</section>`;
  }
  async function loadFairs(){
    const sel = $("#fairSel"); if (!sel) return;
    const cur = S.o?.fair?.id || "";
    try {
      S.fairs = S.fairs || (await fetch("/fair/fairs.json").then((r) => r.json())).fairs || [];
      const today = new Date().toISOString().slice(0, 10);
      const list = S.fairs.filter((x) => !x.date || x.date >= today || x.id === cur).sort((a, b) => String(a.date).localeCompare(String(b.date)));
      sel.insertAdjacentHTML("beforeend", list.map((x) => `<option value="${esc(x.id)}" ${x.id === cur ? "selected" : ""} data-noi18n>${esc(x.name)}${x.term ? " · " + esc(x.term) : ""}</option>`).join(""));
    } catch {}
    $("#fairSave").onclick = async () => {
      const b = $("#fairSave"); b.disabled = true;
      try { await api({ action: "orbit_fair", fair: sel.value, on: $("#fairOn").checked }); await refresh(); }
      catch (e) { b.disabled = false; alertBox(e.message); }
    };
  }

  async function onUser(u){
    if (!u) {
      $("main").innerHTML = `<div class="card center"><div class="orb-ic">${GLOBE}</div><h1>Orbit</h1>
        <p class="sub" style="max-width:52ch;margin:6px auto 16px">The people around your internship search: classmates in your major, everyone else on Beat the Pile, and what's new at the companies you follow.</p>
        <button class="btn pri" id="si">Sign in to see your Orbit</button></div>`;
      $("#si").onclick = () => S.clerk.openSignIn({}); return;
    }
    S.biz = (u.unsafeMetadata && u.unsafeMetadata.role) === "employer" || (() => { try { return localStorage.getItem("btp_role") === "employer"; } catch { return false; } })();
    try { await refresh();
      const chat = new URLSearchParams(location.search).get("chat");
      if (chat && /^[A-Za-z0-9_-]{3,40}$/.test(chat)) { history.replaceState(null, "", location.pathname); openChat(chat); }
    }
    catch (e) { $("main").innerHTML = `<div class="card center">Couldn't load Orbit right now (${esc(e.message)}). Refresh in a minute.</div>`; }
  }
  async function loadClerk(){
    try {
      const pk = (await fetch("/api/config").then((r) => r.json())).clerkPublishableKey; if (!pk) throw 0;
      if (!window.Clerk) {
        const host = atob(pk.replace(/^pk_(test|live)_/, "")).replace(/\$$/, "").trim(); if (!/clerk/.test(host)) throw 0;
        await new Promise((ok, bad) => { const s = document.createElement("script"); s.src = `https://${host}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`;
          s.setAttribute("data-clerk-publishable-key", pk); s.async = true; s.crossOrigin = "anonymous"; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
      }
      if (typeof window.Clerk.load === "function" && !window.Clerk.loaded) await window.Clerk.load({});
      S.clerk = window.Clerk;
      let last = S.clerk.user?.id || null;
      S.clerk.addListener?.(({ user }) => { const id = user?.id || null; if (id !== last) { last = id; onUser(user); } });
      await onUser(S.clerk.user);
    } catch { $("main").innerHTML = '<div class="card center">Sign-in is temporarily unavailable. Try again in a minute.</div>'; }
  }
  window.__orbitRender = render;   // used by the offline preview test
  if (location.hash === "#messages") addEventListener("load", () => setTimeout(() => $("#messages")?.scrollIntoView(), 1200));
  loadClerk();
})();
</script>
<script src="/ph.js" defer></script>
<script src="/feedback.js" defer></script>
</body>
</html>
