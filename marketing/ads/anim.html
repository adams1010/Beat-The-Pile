</style></head><body><div id="st"></div>
<script>
const LOGO = "file:///home/claude/ads/logo-white.png";
const cl = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P = (t,a,b)=>cl((t-a)/(b-a));
const out = p=>1-Math.pow(1-p,3);
const back = p=>1-Math.pow(1-p,3); // Nov 18 (owner): no bounce, plain ease-out
const io = p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const esc = s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const fmt = n=>Math.round(n).toLocaleString("en-US");
const ini = c=>{const w=c.replace(/&/g," ").split(/\s+/).filter(x=>/^[A-Za-z0-9]/.test(x)); return (w[0][0]+(w[1]?w[1][0]:w[0][1])).toUpperCase();};

// words pop in one by one. *word* = lime
function words(text, t, t0, gap=0.11){
  let i=0; return text.split(/(\s+|<br>)/).map(tok=>{
    if(tok==="<br>") return "<br>"; if(/^\s+$/.test(tok)) return " ";
    const lime = /^\*.*\*[?.!,]*$/.test(tok); const w = tok.replace(/\*/g,"");
    const p = out(P(t, t0+i*gap, t0+i*gap+0.35)); i++;
    return `<span class="w ${lime?'lime':''}" style="opacity:${p};transform:translateY(${(1-p)*60}px) scale(${0.85+0.15*back(P(t,t0+(i-1)*gap,t0+(i-1)*gap+0.4))})">${esc(w)}</span>`;
  }).join("");
}
function hook(t, text, sub, subAt){
  const s = sub ? `<div class="sub" style="opacity:${out(P(t,subAt,subAt+.4))};transform:translateY(${(1-out(P(t,subAt,subAt+.4)))*30}px)">${esc(sub)}</div>` : "";
  const lg = out(P(t,0,.4));
  return `<div class="sc navy"><img class="logo" src="${LOGO}" style="opacity:${lg}"><div class="hook">${words(text,t,.15)}${s}</div></div>`;
}
function card(j, t, at, extra=""){
  const p = out(P(t,at,at+.45));
  const pill = j.k ? `<div class="pill ${j.kc||''}">${esc(j.k)}</div>` : "";
  return `<div class="card" style="opacity:${p};transform:translateY(${(1-p)*140}px)"><div class="tile">${esc(j.ini||ini(j.c))}</div><div><div class="t">${esc(j.t)}</div><div class="c">${esc(j.c)} <span>· ${esc(j.l)}</span></div>${pill}${extra}</div></div>`;
}
function finger(t, path){ // path: [[time,x,y],...] taps: times
  if(!path.pts.length || t<path.pts[0][0]-.3 || t>path.end) return "";
  let x=path.pts[0][1], y=path.pts[0][2];
  for(let i=1;i<path.pts.length;i++){const [t1,x1,y1]=path.pts[i], [t0,x0,y0]=path.pts[i-1]; if(t>=t0){const p=io(P(t,t0,t1)); x=x0+(x1-x0)*p; y=y0+(y1-y0)*p;}}
  let h = "", sc = 1;
  for(const tap of path.taps){ const d=t-tap; if(d>-0.12&&d<0.12) sc=0.82; if(d>=0&&d<.6){const r=60+d*260; h+=`<div class="ripple" style="left:${x}px;top:${y}px;width:${r*2}px;height:${r*2}px;opacity:${1-d/.6}"></div>`;} }
  const op = Math.min(out(P(t,path.pts[0][0]-.3,path.pts[0][0])), 1-P(t,path.end-.25,path.end));
  return h+`<div class="finger" style="left:${x}px;top:${y}px;opacity:${op};transform:translate(-50%,-50%) scale(${sc})"></div>`;
}
function counter(t, rows, t0){
  return `<div class="sc navy"><img class="logo" src="${LOGO}"><div class="stat">`+rows.map(([n,l],i)=>{
    const a=t0+i*0.55, p=out(P(t,a,a+1.1)), q=out(P(t,a,a+.35));
    return `<div style="opacity:${q};transform:translateX(${(1-q)*-80}px)"><div class="n">${fmt(n*p)}</div><div class="l">${esc(l)}</div></div>`;}).join("")+`</div></div>`;
}
function endcard(t, line="Find your job before the pile does."){
  const a=back(P(t,0,.55)), url="beatthepile.com", n=Math.floor(url.length*P(t,.45,1.25));
  const pulse = 1;
  return `<div class="sc navy"><div class="end"><img src="${LOGO}" style="transform:scale(${a});opacity:${cl(a)}"><div class="u">${url.slice(0,n)}<span class="caret" style="background:#B0F701;height:60px;opacity:${t<1.4?1:0}"></span></div><div class="s" style="opacity:${out(P(t,1.2,1.6))}">${esc(line)}</div><div class="cta" style="opacity:${out(P(t,1.5,1.9))};transform:scale(${(0.8+0.2*back(P(t,1.5,1.95)))*pulse})">Make your free account</div></div></div>`;
}
function swipe(t, sceneStart){ return `transform:translateY(${(1-out(P(t,sceneStart,sceneStart+.32)))*120}px);opacity:${out(P(t,sceneStart,sceneStart+.25))}`; }

// ---------------- real listings (beatthepile.com, Nov 17 2026) ----------------
const J = {
  eng:[{t:"Systems Engineering Intern - Power",c:"Texas Instruments",l:"Dallas, TX",k:"Internship"},
       {t:"Mechanical Engineering Intern",c:"Intuitive Surgical",l:"Blacksburg, VA",k:"Internship"},
       {t:"Software Engineering Intern - Summer 2027",c:"Lockheed Martin",l:"Highlands Ranch, CO",k:"Internship"},
       {t:"Intern Engineering, Product Engineering",c:"Moog",l:"Blacksburg, VA",k:"Internship"}],
  health:[{t:"Student Nurse Emergency Room",c:"Universal Health Services",l:"Bradenton, FL",k:"Internship"},
          {t:"Registered Nurse (RN) - New Graduate",c:"Universal Health Services",l:"Cape Girardeau, MO",k:"Entry-level",kc:"b"},
          {t:"Medical Assistant - Certified",c:"Carilion Clinic",l:"Blacksburg, VA",k:"Entry-level",kc:"b"}],
  mkt:[{t:"Digital Marketing Intern",c:"Oak View Group",l:"Austin, TX",k:"Internship"},
       {t:"Summer 2027 Marketing Internship",c:"Thorlabs",l:"Newton, NJ",k:"Internship"},
       {t:"Social Media Intern",c:"Injective",l:"New York, NY",k:"Internship"}],
  biz:[{t:"Intern, Business",c:"Moog",l:"Blacksburg, VA",k:"Internship"},
       {t:"Sales Development Representative",c:"Saviynt",l:"Raleigh, NC",k:"Entry-level",kc:"b"},
       {t:"Entry-Level HR Associate",c:"Maxinsights",l:"Santa Clara, CA",k:"Entry-level",kc:"b"}],
  hourly:[{t:"Golf Shop Attendant",c:"Troon",l:"Boerne, TX",k:"Part-time & hourly",kc:"b"},
          {t:"Server - Golf Restaurant",c:"Marriott International",l:"Marana, AZ",k:"Part-time & hourly",kc:"b"},
          {t:"Event Staff, Virginia Tech",c:"Teall Sports & Entertainment",l:"Blacksburg, VA",k:"Part-time & hourly",kc:"b"}],
  shadow:[{t:"Volunteer Law Student Summer 2027",c:"U.S. Attorneys' Offices",l:"Lexington, KY",k:"Shadowing"},
          {t:"Volunteer Program Assistant (Seasonal)",c:"National Park Service",l:"West Glacier, MT",k:"Shadowing"},
          {t:"Hospice Volunteer",c:"LifeCare Home Health",l:"Fort Worth, TX",k:"Shadowing"}],
  intern:[{t:"Security and Compliance Analyst Intern",c:"Illumio",l:"Sunnyvale, CA",k:"Internship"},
          {t:"Summer 2027 Software Engineer Intern",c:"Peraton",l:"Herndon, VA",k:"Internship"},
          {t:"Aviation Engineering Intern",c:"Ardurra",l:"Blacksburg, VA",k:"Internship"}],
  near:[{t:"Mechanical Engineering Intern",c:"Intuitive Surgical",l:"2 mi",k:"Internship"},
        {t:"Event Staff, Virginia Tech",c:"Teall Sports & Entertainment",l:"2 mi",k:"Part-time & hourly",kc:"b"},
        {t:"Intern, Business",c:"Moog",l:"2 mi",k:"Internship"},
        {t:"Medical Assistant - Certified",c:"Carilion Clinic",l:"2 mi",k:"Entry-level",kc:"b"},
        {t:"Aviation Engineering Intern",c:"Ardurra",l:"2 mi",k:"Internship"}],
  fairs:[{t:"Business Horizons Career Fair",c:"Virginia Tech",l:"Feb 4, 2027",k:"Spring 2027"},
         {t:"Connection Job Fair (all majors)",c:"Virginia Tech",l:"Feb 10, 2027",k:"Spring 2027"},
         {t:"Construction Industry Career Fair",c:"Virginia Tech",l:"Feb 18, 2027",k:"Spring 2027"}],
};
const N = {intern:19155, entry:52054, hourly:41488, companies:6006, placed:102918, near:35};

// ---------------- videos ----------------
function appTop(title, sub){ return `<div class="band"><h2>${title}</h2><p>${sub}</p></div>`; }

const V = {};
V[1] = {len:17.4, scenes:[
  [0,2.7,t=>hook(t,"Applied to 50 internships and heard *nothing* back?")],
  [2.7,5.5,t=>hook(t,"Stop applying to *reposts*.","We pull every internship straight from the company's own job board.",1.0)],
  [5.5,11.0,t=>{
    const q="engineering intern", typed=q.slice(0,Math.floor(q.length*P(t,.9,2.0)));
    const show=t>2.45;
    const cards = show? J.eng.map((j,i)=>card(j,t,2.55+i*.22, i==0?`<div><span class="abtn" style="background:${t>4.3?'#060A2C':'#4A7000'}">${t>4.3?'Opening their site':'Apply'}</span></div>`:"")).join("") : "";
    const toast = t>4.35? `<div class="toast" style="opacity:${out(P(t,4.35,4.6))};transform:translateY(${(1-out(P(t,4.35,4.65)))*60}px)">Apply goes to <b>Texas Instruments' own careers page</b>. No middleman.</div>`:"";
    const f = finger(t,{pts:[[.5,620,560],[.7,620,560],[2.15,930,560],[3.9,930,560],[4.25,220,1060]],taps:[.7,2.25,4.3],end:5.2});
    return `<div class="sc light">${appTop("Internships and jobs,<br>straight from the source","Every board re-read every few hours.")}<div class="wrap"><div class="box search"><div class="inp ${typed?'':'ph'}">${typed?esc(typed)+'<span class="caret" style="opacity:'+(t<2.2?1:0)+'"></span>':'Job title or company'}</div><div class="sbtn">Search</div></div>${cards}</div>${toast}${f}</div>`;}],
  [11.0,14.2,t=>counter(t,[[N.intern,"internships open right now"],[N.companies,"companies, read from their own boards"]],.1)],
  [14.2,17.4,t=>endcard(t)],
]};

function chipsRow(t, names, switches){ // switches: [[time, idx]]
  let idx=0, from=0, at=-9; for(const [tt,i] of switches){ if(t>=tt){ from=idx; idx=i; at=tt; } }
  const W=[300,260,240], X=[0,316,592]; const p=io(P(t,at,at+.3));
  const x=X[from]+(X[idx]-X[from])*p, w=W[from]+(W[idx]-W[from])*p;
  return {idx, html:`<div class="chips"><div class="chipbg" style="left:${x}px;width:${w}px"></div>`+names.map((n,i)=>`<div class="chip ${i==idx?'on':''}" style="width:${W[i]}px;text-align:center;background:transparent">${n}</div>`).join("")+`</div>`};
}
V[2] = {len:16.2, scenes:[
  [0,2.5,t=>hook(t,"Not an engineer? *Good.*","Beat the Pile is for every major.",1.2)],
  [2.5,10.9,t=>{
    const sw=[[0,0],[2.95,1],[5.65,2]]; const r=chipsRow(t,["Healthcare","Marketing","Business"],sw);
    const lists=[J.health,J.mkt,J.biz], heads=[["Nursing &amp; health","Student nurse roles count as internships here."],["Marketing","Brand, social, digital."],["Business","Sales, HR, finance, ops."]];
    const at=[.35,3.05,5.75][r.idx];
    const cards=lists[r.idx].map((j,i)=>card(j,t,at+i*.2)).join("");
    const f=finger(t,{pts:[[2.4,800,860],[2.85,560,640],[4.9,560,640],[5.55,830,640]],taps:[2.95,5.65],end:6.6});
    const h=heads[r.idx];
    return `<div class="sc light">${appTop(h[0],h[1])}<div class="wrap" style="padding-top:52px">${r.html}${cards}</div>${f}</div>`;}],
  [10.9,13.0,t=>hook(t,"Pick your major. We do the *digging*.")],
  [13.0,16.2,t=>endcard(t)],
]};

function segRow(t, names, switches){
  let idx=0, from=0, at=-9; for(const [tt,i] of switches){ if(t>=tt){ from=idx; idx=i; at=tt; } }
  const w=(1080-108-16)/names.length, p=io(P(t,at,at+.3)), x=8+(from+(idx-from)*p)*w;
  return {idx, html:`<div class="seg"><span class="segbg" style="left:${x}px;width:${w}px"></span>`+names.map((n,i)=>`<div class="${i==idx?'on':''}">${n}</div>`).join("")+`</div>`};
}
V[3] = {len:16.6, scenes:[
  [0,2.4,t=>hook(t,"Not ready for a *desk job* yet?")],
  [2.4,10.6,t=>{
    const r=segRow(t,["Internships","Entry-level","Hourly","Shadowing"],[[0,0],[1.3,2],[4.6,3]]);
