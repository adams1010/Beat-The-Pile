<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beat the Pile, Opening Radar</title>
<meta name="description" content="Know when companies open their summer internships, before everyone else. Based on the last three recruiting seasons.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#060A2C">
<style>
  :root{--green:#4A7000;--green-dark:#3A5A00;--green-light:#F2FADF;--navy:#060A2C;--ink:#1A2230;--muted:#64748B;--faint:#5E6A80;
        --bg:#FBFBFC;--line:#E3E7ED;--amber:#B45309;--amber-light:#FFF4E6;--violet:#1E3A8A;--violet-light:#EFF3FB;
        --font:"Geist",-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px}
  header{background:var(--navy);color:#fff;padding:18px 0 22px}
  .top{display:flex;justify-content:space-between;align-items:center}
  .brand{font-weight:800;font-size:15px;color:var(--green);text-decoration:none}
  .top a.nav{font-size:13px;font-weight:700;color:#CBD5E1;text-decoration:none}
  h1{font-size:clamp(26px,6vw,34px);margin:14px 0 4px;letter-spacing:-.02em;line-height:1.1}
  .sub{color:#CBD5E1;margin:0;font-size:15px}
  .trend{display:flex;gap:14px;align-items:center;background:#13233D;border-radius:10px;padding:14px 16px;margin-top:16px}
  .trend .n{font-size:34px;font-weight:900;color:var(--green);line-height:1;letter-spacing:-.03em}
  .trend .t{font-size:14px;color:#CBD5E1;line-height:1.35}
  .trend .t b{color:#fff}
  .controls{position:sticky;top:0;z-index:5;background:rgba(248,255,254,.96);;border-bottom:1px solid var(--line);padding:12px 0}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;font:inherit;font-size:14px;font-weight:700;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
  .tabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .search{width:100%;margin-top:10px;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .hint{font-size:13.5px;color:var(--muted);margin:14px 0 10px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
  .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .name{font-weight:800;color:var(--navy);font-size:17px;line-height:1.25}
  .pill{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .pill.open{background:var(--green-light);color:var(--green-dark)}
  .pill.soon{background:var(--amber-light);color:var(--amber)}
  .pill.late{background:#FEF2F2;color:#B91C1C}
  .pill.next{background:var(--violet-light);color:var(--violet)}
  .big{font-size:15px;color:var(--ink);margin-top:4px}
  .big b{color:var(--navy)}
  .hist{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .hist span{font-size:12px;color:var(--muted);background:#F1F5F9;border-radius:8px;padding:3px 8px}
  .hist span b{color:var(--ink)}
  .meta{font-size:12.5px;color:var(--faint);margin-top:6px}
  .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:14px;font-weight:700;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;text-decoration:none}
  .btn.go{background:var(--green);border-color:var(--green);color:#fff}
  .early{color:var(--green-dark);font-weight:700}.lateTxt{color:var(--amber);font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  footer{color:var(--muted);font-size:12.5px;padding:24px 0 60px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:10px;z-index:20}
  .more{display:block;width:100%;min-height:48px;margin:12px 0;font:inherit;font-weight:600;border:1px solid var(--line);border-radius:999px;background:#fff;color:#4A7000;cursor:pointer}
</style>
<link rel="stylesheet" href="/d.css">
</head>
<body>
<script src="/nav.js"></script>
<header>
  <div class="wrap">
    <div class="top"><span class="brand">Opening Radar</span></div>
    <h1>Opening Radar</h1>
    <p class="sub">Know when companies usually open their summer internships, so you can apply in the first few days instead of after the pile.</p>
    <div class="trend" id="trend" hidden></div>
  </div>
</header>
<div class="controls">
  <div class="wrap">
    <div class="tabs" role="group" aria-label="View">
      <button data-v="soon" aria-pressed="true">Not open yet</button>
      <button data-v="open" aria-pressed="false">Opened this season</button>
      <button data-v="next" aria-pressed="false">Plan for next summer</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Search a company (Boeing, Deloitte, Capital One…)" aria-label="Search a company">
  </div>
</div>
<main class="wrap">
  <div class="hint" id="fresh" style="font-size:12.5px"></div>
  <p class="hint" id="hint"></p>
  <div id="list"><div class="empty">Loading the radar…</div></div>
</main>
<footer class="wrap" id="foot"></footer>

<script>
(function(){
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const S = { d: null, view: new URLSearchParams(location.search).get("view") || "soon", q: "", onSite: new Set(), onSiteId: new Map() };
  const DAY = 864e5;
  const fmt = (iso, y) => new Date(iso + "T12:00:00Z").toLocaleDateString(undefined, { month: "short", day: "numeric", ...(y ? { year: "numeric" } : {}), timeZone: "UTC" });
  const daysFrom = (iso) => Math.round((Date.parse(iso + "T12:00:00Z") - Date.now()) / DAY);
  const normName = (s) => String(s || "").toLowerCase().replace(/&/g, "and").replace(/\b(inc|llc|ltd|corp|corporation|company|co|the|group|plc|holdings|incorporated)\b\.?/g, "").replace(/[^a-z0-9]/g, "");

  function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }

  // Calendar reminder 7 days before the expected opening (iPhone/Mac → .ics file, everyone else → Google Calendar)
  function remind(c, dateIso, season){
    const at = new Date(Date.parse(dateIso + "T14:00:00Z") - 7 * DAY);
    if (at < new Date()) at.setTime(Date.now() + DAY);
    const end = new Date(at.getTime() + 30 * 6e4);
    const title = `${c.name} internships usually open ~${fmt(dateIso)}`;
    const details = `Summer ${season} internship postings at ${c.name} usually show up around ${fmt(dateIso, true)}. Get your resume ready and check Beat the Pile: ${location.origin}/radar/?view=${S.view}`;
    const z = (d) => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
    if (/iPhone|iPad|Macintosh/.test(navigator.userAgent)) {
      const e = (x) => String(x).replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n");
      const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Beat the Pile//EN","BEGIN:VEVENT",`UID:radar-${c.k}-${season}@beatthepile.com`,`DTSTAMP:${z(new Date())}`,`DTSTART:${z(at)}`,`DTEND:${z(end)}`,`SUMMARY:${e(title)}`,`DESCRIPTION:${e(details)}`,"BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY",`DESCRIPTION:${e(title)}`,"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
      const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
      const a = document.createElement("a"); a.href = url; a.download = `radar-${c.k}.ics`; a.click(); setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast("Open the file to add the reminder");
    } else {
      window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${z(at)}/${z(end)}&details=${encodeURIComponent(details)}`, "_blank", "noopener");
    }
  }

  // Three different kinds of information, always labeled: PAST (history), ESTIMATE (from history), NOW (live jobs we track)
  function history(c){
    return `<div class="hist"><span style="font-weight:700">Past seasons:</span>${Object.entries(c.history).map(([S, d]) => `<span>Summer ${esc(S)}: <b>${esc(fmt(d, true))}</b></span>`).join("")}</div>`;
  }
  const conf = (c) => c.confidence === "high" ? "Very consistent year to year" : c.seasons >= 2 ? `Based on ${c.seasons} seasons` : "Based on 1 season, a rough guide";
  // One company's internships, every major (the jobs page loads just that company — fast on a phone)
  function jobsLink(c){ const id = c.id || S.onSiteId.get(c.k); return `<a class="btn go" href="/jobs/?${id ? `company=${encodeURIComponent(id)}&` : ""}major=all&q=${encodeURIComponent(c.name.trim())}">See internships →</a>`; }

  function card(c){
    const season = S.d.season;
    if (S.view === "open") {
      const d = c.seasons >= 2 && Math.abs(c.diff ?? 999) < 90 ? c.diff : null, how = d == null ? "" : d <= -7 ? `<span class="early">${-d} days earlier than usual</span>` : d >= 7 ? `<span class="lateTxt">${d} days later than usual</span>` : "right on schedule";
      return `<div class="card"><div class="row1"><div class="name">${esc(c.name)}</div><span class="pill open">Open</span></div>
        <div class="big">Opened <b>${esc(fmt(c.opened))}</b>${how ? " · " + how : ""}</div>${history(c)}
        <div class="acts">${S.onSite.has(c.k) || c.id ? jobsLink(c) : ""}</div></div>`;
    }
    if (S.view === "next") {
      const n = c.openedNext ? `<span class="pill open">Already posting</span>` : `<span class="pill next">~${esc(fmt(c.typicalNext))}</span>`;
      return `<div class="card"><div class="row1"><div class="name">${esc(c.name)}</div>${n}</div>
        <div class="big">Estimate: Summer ${season + 1} internships around <b>${esc(fmt(c.typicalNext, true))}</b></div>${history(c)}
        <div class="meta">${esc(conf(c))}</div>
        <div class="acts">${c.openedNext ? (S.onSite.has(c.k) || c.id ? jobsLink(c) : "") : `<button class="btn" data-remind="${esc(c.k)}" data-when="next">Remind me a week before</button>`}</div></div>`;
    }
    const days = daysFrom(c.typical);
    const pill = days >= 0 ? `<span class="pill soon">${days === 0 ? "Any day now" : `In ~${days} day${days === 1 ? "" : "s"}`}</span>` : `<span class="pill late">Late this year</span>`;
    const line = days >= 0 ? `Estimate: usually opens around <b>${esc(fmt(c.typical))}</b>` : `Estimate: usually open by <b>${esc(fmt(c.typical))}</b>. Not seen yet this season, so keep checking their careers page.`;
    return `<div class="card"><div class="row1"><div class="name">${esc(c.name)}</div>${pill}</div>
      <div class="big">${line}</div>${history(c)}<div class="meta">${esc(conf(c))}</div>
      <div class="acts">${days >= 0 ? `<button class="btn" data-remind="${esc(c.k)}" data-when="cur">Remind me a week before</button>` : ""}${S.onSite.has(c.k) || c.id ? jobsLink(c) : ""}</div></div>`;
  }

  function render(){
    if (!S.d) return;
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === S.view)));
    const q = S.q.toLowerCase();
    let list = S.d.companies.filter((c) => !q || c.name.toLowerCase().includes(q));
    // "Open" also counts companies with live internships on Beat the Pile, even if the public list missed them
    const isOpen = (c) => c.opened || S.onSite.has(c.k);
    if (S.view === "soon") list = list.filter((c) => !isOpen(c)).sort((a, b) => (daysFrom(a.typical) < 0) - (daysFrom(b.typical) < 0) || a.typical.localeCompare(b.typical) || b.seasons - a.seasons);
    if (S.view === "open") list = list.filter(isOpen).sort((a, b) => String(b.opened || "9").localeCompare(String(a.opened || "9")));
    if (S.view === "next") list = [...list].sort((a, b) => a.typicalNext.localeCompare(b.typicalNext));
    const n = list.length, season = S.d.season;
    $("#hint").textContent = S.view === "soon" ? `${n} companies haven't posted Summer ${season} internships yet. Here's when they usually do.`
      : S.view === "open" ? `${n} companies have opened Summer ${season} internships. Most recent first.`
      : `Freshman or sophomore? Summer ${season + 1} recruiting starts next year. Set reminders now and be first in line.`;
    // Nov 13: show 60 at a time (all 1,400+ at once made a 400,000-px page that crawled on phones)
    const shown = list.slice(0, S.shown || 60), more = n - shown.length;
    $("#list").innerHTML = n ? shown.map((c) => S.view === "open" && !c.opened
        ? `<div class="card"><div class="row1"><div class="name">${esc(c.name)}</div><span class="pill open">Open now</span></div><div class="big">Now: internships open on their job board (we track it)</div>${history(c)}<div class="acts">${jobsLink(c)}</div></div>`
        : card(c)).join("")
      : `<div class="empty">No companies match${q ? ` “${esc(S.q)}”` : ""}.</div>`;
    if (more > 0) $("#list").insertAdjacentHTML("beforeend", `<button type="button" class="more" id="moreBtn">Show ${Math.min(more, 60)} more (${more} left)</button>`);
    const mb = $("#moreBtn"); if (mb) mb.onclick = () => { S.shown = (S.shown || 60) + 60; render(); };
    $("#fresh").innerHTML = `Opening history updated ${esc(new Date(S.d.built).toLocaleDateString())}. ` + (S.liveErr
      ? `<b style="color:#B45309">We couldn't check which companies have jobs open right now</b> (our side or your connection), so “Open now” may be missing some. That doesn't mean they have none, refresh to try again.`
      : S.lastSync ? `Current openings checked against company job boards (last re-read ${esc(new Date(S.lastSync).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))}).` : "");
  }

  document.querySelector(".tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; S.view = b.dataset.v; S.shown = 60; history_(); render(); });
  const history_ = () => { try { const u = new URL(location.href); u.searchParams.set("view", S.view); window.history.replaceState(null, "", u); } catch {} };
  $("#q").addEventListener("input", (e) => { S.q = e.target.value.trim(); S.shown = 60; render(); });
  $("#list").addEventListener("click", (e) => {
    const b = e.target.closest("[data-remind]"); if (!b) return;
    const c = S.d.companies.find((x) => x.k === b.dataset.remind); if (!c) return;
    b.dataset.when === "next" ? remind(c, c.typicalNext, S.d.season + 1) : remind(c, c.typical, S.d.season);
  });

  Promise.all([fetch("/radar/radar.json").then((r) => r.json()),
               fetch("/api/listings?names=1").then((r) => { if (!r.ok) throw 0; return r.json(); }).catch(() => null)]).then(([d, l]) => {
    S.d = d;
    if (!l) S.liveErr = true; else S.lastSync = l.meta?.lastSync || null;
    for (const j of l?.companies || []) { const k = normName(j.company); S.onSite.add(k); if (!S.onSiteId.has(k)) S.onSiteId.set(k, j.id); }
    if (d.trend && d.trend.companies >= 10) {
      const t = d.trend, pct = Math.round(t.earlier / t.companies * 100);
      $("#trend").innerHTML = `<div class="n">${pct}%</div><div class="t">of companies opened Summer ${d.season} internships <b>earlier than last year</b>. Only ${Math.round(t.later / t.companies * 100)}% opened later (${t.companies} companies compared, from the opening history below).</div>`;
      $("#trend").hidden = false;
    }
    $("#foot").innerHTML = `How this works: we track the date each company's internship postings first appeared over the last few recruiting seasons (from the public <a href="https://github.com/SimplifyJobs" target="_blank" rel="noopener">SimplifyJobs</a> internship list plus our own data). Opening dates are when a company starts posting any summer internships. <b>Estimates</b> come from those past dates and aren't guarantees; <b>Open now</b> means we see internships on their job board today. Updated ${esc(new Date(d.built).toLocaleDateString())}.`;
    render();
  }).catch(() => { $("#list").innerHTML = `<div class="empty">Couldn't load the radar. Refresh to try again.</div>`; });
})();
</script>
<script src="/ph.js" defer></script>
<script src="/feedback.js" defer></script>
</body>
</html>
